      kpiBox,
      ...defs.map((def) => {
        const delta = kpiDelta(def, def.read(nowAnalysis), def.read(planAnalysis));
        return h(
          'div',
          { class: 'kpi' },
          h('div', { class: 'kpi__label', text: def.label }),
          h('div', { class: 'kpi__value', text: def.fmt(def.read(currentAnalysis)) }),
          h('div', { class: `kpi__delta${delta.cls}`, html: delta.html })
        );
      })
    );
  };

  const paintGaps = (currentAnalysis) => {
    const gaps = currentAnalysis.gaps;
    if (!gaps.length) {
      mount(
        gapsBox,
        h('div', {
          class: 'empty-state',
          text: 'Brak dzielnic z ludnością poza zasięgiem w tym scenariuszu.',
        })
      );
      return;
    }

    const uncoveredTotal = gaps.reduce((sum, g) => sum + g.uncoveredPeople, 0);
    mount(
      gapsBox,
      h('div', {
        class: 'note num',
        style: { marginBottom: '6px' },
        text: `${fmtNum(gaps.length)} dzielnic z luką · razem ${fmtNum(uncoveredTotal)} os. poza zasięgiem.`,
      }),
      ...gaps.map((gap, index) =>
        h(
          'div',
          { style: { padding: '8px 0', borderBottom: '1px solid var(--line)' } },
          h(
            'div',
            { class: 'row' },
            h('span', { style: { fontWeight: '500' }, text: gap.name }),
            h('span', { class: 'spacer' }),
            h('span', { class: 'muted num', text: fmtPct(gap.uncoveredPct, 0) })
          ),
          h('div', {
            class: 'muted num',
            style: { fontSize: '11.5px' },
            text:
              `${fmtNum(gap.uncoveredPeople)} os. poza · max ${fmtMin(gap.maxMin, 1)}` +
              (index < GAP_LABELS_ON_MAP ? ' · etykieta na mapie' : ''),
          }),
          h('div', { style: { marginTop: '5px' }, html: barHtml(gap.uncoveredPct, gapVariant(gap.uncoveredPct)) })
        )
      )
    );
  };

  /* ---------------- Akcje na propozycjach ---------------- */

  const acceptPending = async (candidateId) => {
    const proposal = state.pendingProposals.find((p) => p.candidateId === candidateId);
    if (!proposal) return;

    const presetId = getPreset(proposal.presetId) ? proposal.presetId : 'P1';
    const point = makePoint({
      id: nextId('NEW'),
      name: proposal.name,
      lat: proposal.lat,
      lon: proposal.lon,
      presetId,
      districtId: proposal.districtId || districtAt(proposal.lat, proposal.lon),
      kind: 'proposed',
    });
    point.status = 'accepted';
    point.candidateId = proposal.candidateId;
    point.gainPct = proposal.gainPct;
    point.gainWeight = proposal.gainWeight;
    // Szafka na elewacji i totem są z definicji dostępne całodobowo, punkt
    // w budynku publicznym — nie. Tak samo jest w danych demo.
    point.access.always = OUTDOOR_PRESETS.has(presetId);
    point.phase = OUTDOOR_PRESETS.has(presetId) ? 3 : 2;

    checkpoint(`akceptację propozycji „${proposal.name}”`);
    upsertPoint(point);
    state.pendingProposals = state.pendingProposals.filter((p) => p.candidateId !== candidateId);
    await save();
    toast(`Zaakceptowano: ${point.name} → ${point.id}. Punkt jest już w krokach 3 i 4.`);
  };

  const rejectPending = async (candidateId) => {
    const proposal = state.pendingProposals.find((p) => p.candidateId === candidateId);
    if (!proposal) return;
    checkpoint(`odrzucenie propozycji „${proposal.name}”`);
    state.pendingProposals = state.pendingProposals.filter((p) => p.candidateId !== candidateId);
    await save();
    toast(`Odrzucono propozycję: ${proposal.name}.`);
  };

  const setPointStatus = async (pointId, status, message) => {
    const point = getPoint(pointId);
    if (!point) return;
    checkpoint(`zmianę statusu „${point.name}”`);
    point.status = status;
    upsertPoint(point);
    await save();
    toast(message.replace('%s', point.name));
  };

  /* ---------------- Karty propozycji ---------------- */

  const proposalCard = (item) => {
    const preset = getPreset(item.presetId);
    const gain = item.gain;
    const buttons = [];

    if (item.type === 'pending') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Akceptuj — punkt trafi do planu, kart i roadmapy',
            'aria-label': 'Akceptuj propozycję',
            onclick: () => acceptPending(item.candidateId),
          },
          '✓'
        ),
        h(
          'button',
          {
            class: 'btn btn--sm btn--danger',
            title: 'Odrzuć — propozycja znika z listy',
            'aria-label': 'Odrzuć propozycję',
            onclick: () => rejectPending(item.candidateId),
          },
          '✕'
        )
      );
    } else if (item.status === 'proposed') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Akceptuj — punkt wejdzie do scenariusza Plan',
            'aria-label': 'Akceptuj propozycję',
            onclick: () => setPointStatus(item.id, 'accepted', 'Zaakceptowano: %s.'),
          },
          '✓'
        ),
        h(
          'button',
          {
            class: 'btn btn--sm btn--danger',
            title: 'Odrzuć — punkt zostanie oznaczony jako odrzucony',
            'aria-label': 'Odrzuć propozycję',
            onclick: () => setPointStatus(item.id, 'rejected', 'Odrzucono: %s.'),
          },
          '✕'
        )
      );
    } else if (item.status === 'accepted') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Cofnij akceptację — punkt wróci do propozycji',
            onclick: () => setPointStatus(item.id, 'proposed', 'Cofnięto akceptację: %s.'),
          },
          'Cofnij'
        )
      );
    } else {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Przywróć propozycję do rozpatrzenia',
            onclick: () => setPointStatus(item.id, 'proposed', 'Przywrócono propozycję: %s.'),
          },
          'Przywróć'
        )
      );
    }

    return h(
      'div',
      { class: 'card', style: { marginBottom: '8px' } },
      h(
        'div',
        { class: 'row' },
        h('span', { html: dotHtml('proposed') }),
        h('span', { style: { fontWeight: '500' }, text: item.name }),
        h('span', { class: 'spacer' }),
        h('span', { html: pillHtml(item.statusLabel, item.statusVariant) })
      ),
      h('div', {
        class: 'muted',
        style: { fontSize: '11.5px', marginTop: '3px' },
        text:
          `${preset ? `${preset.id} · ${preset.name} · ${fmtCost(preset.cost)}` : 'brak presetu'} · ` +
          `${districtName(item.districtId)}`,
      }),
      h(
        'div',
        { class: 'row', style: { marginTop: '8px' } },
        h('span', {
          class: 'num',
          style: { fontWeight: '600' },
          text: `+${fmtPct(gain.gainPct, 1)} pokrycia`,
        }),
        h('span', { class: 'muted num', style: { fontSize: '11.5px' }, text: `(${fmtNum(gain.gainWeight)} os.)` }),
        h('span', { class: 'spacer' }),
        ...buttons
      ),
      item.type === 'pending'
        ? h('div', {
            class: 'note',
            style: { marginTop: '6px' },
            text: 'Czeka na decyzję — nie jest jeszcze punktem projektu. Pin przeciągasz na mapie.',
          })
        : null
    );
  };

  const paintProposals = (points, pending) => {
    const items = [];

    for (const proposal of pending) {
      const meta0 = statusMeta({ kind: 'proposed', status: 'proposed' });
      items.push({
        type: 'pending',
        candidateId: proposal.candidateId,
        name: proposal.name,
        presetId: proposal.presetId,
        districtId: proposal.districtId,
        statusLabel: meta0.label,
        statusVariant: meta0.variant,
        gain: gainFor({ lat: proposal.lat, lon: proposal.lon }, points),
      });
    }

    const order = { proposed: 0, accepted: 1, rejected: 2 };
    const proposedPoints = points
      .filter((p) => p.kind === 'proposed' && order[p.status] !== undefined)
      .sort((a, b) => order[a.status] - order[b.status]);

    for (const point of proposedPoints) {
      const meta0 = statusMeta(point);
      items.push({
        type: 'point',
        id: point.id,
        status: point.status,
        name: point.name,
        presetId: point.presetId,
        districtId: point.districtId,
        statusLabel: meta0.label,
        statusVariant: meta0.variant,
        // Zysk liczony na żywo: ile ten punkt dokłada ponad resztę planu.
        gain: gainFor({ lat: point.lat, lon: point.lon }, points, point.id),
      });
    }

    if (!items.length) {
      mount(
        proposalsBox,
        h('div', {
          class: 'empty-state',
          text: 'Brak propozycji — użyj przycisku „ZAPROPONUJ NOWE PUNKTY" poniżej.',
        })
      );
      return;
    }

    mount(proposalsBox, ...items.map(proposalCard));
  };

  /**
   * Przemalowanie całego panelu dla podanej (być może tymczasowej) listy punktów.
   * Zwraca analizę bieżącego scenariusza — mapa korzysta z niej przy pierwszym renderze.
   */
  const paintPanel = (points, pending) => {
    const { now, plan } = analysesFor(points);
    const current = scenario === 'plan' ? plan : now;
    paintKpis(now, plan, current);
    paintGaps(current);
    paintProposals(points, pending);
    paintMethod(current);
    return current;
  };

  const analysis = paintPanel(state.points, state.pendingProposals);

  if (ctx.setMeta) {
    ctx.setMeta(
      `${fmtNum(analysis.activeCount)} czynnych AED · pokrycie ${fmtPct(analysis.coveragePct, 0)} · ` +
        `luki w ${fmtNum(analysis.gaps.length)} dzielnicach · ` +
        (analysis.reachMode === 'radius' ? 'zasięg przybliżony okręgiem' : 'zasięg po sieci pieszej')
    );
  }

  releaseMap();

  mapEl.appendChild(
    h('div', {
      class: 'map-hint',
      text: 'Kliknij w mapę, aby dodać rekomendację · przeciągnij kwadratowy pin, aby ją przesunąć.',
    })
  );

  mapEl.appendChild(
    h(
      'div',
      { class: 'map-legend' },
      h('b', { text: 'Analiza dostępności' }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('ok')}<span>punkt popytu w zasięgu</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('warn')}<span>blisko granicy standardu</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('crit')}<span>poza zasięgiem</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('square')}<span>propozycja (przeciągalna)</span>` }),
      h('div', {
        class: 'note',
        style: { marginTop: '4px' },
        text:
          analysis.reachMode === 'radius'
            ? `Kryterium: ${fmtNum(analysis.radiusM, 0)} m w linii prostej od czynnego AED ` +
              `(${fmtMin(standardMinutes, 0)} dojścia) — przybliżenie, brak danych o sieci pieszej.`
            : `Kryterium: ${fmtMin(standardMinutes, 0)} marszu do AED po realnych chodnikach i ulicach. ` +
              'Obrys to izochrona, nie okrąg.',
      })
    )
  );

  const reachStats = reachCoverageOf(analysis.activePoints || [], reach);

  mapEl.appendChild(
    h(
      'div',
      { class: 'map-toolbar' },
      h('span', {
        class: `pill ${reachStats.radius ? 'pill--warn' : 'pill--ok'}`,
        title:
          'Obrys zasięgu pochodzi z izochron Mapboksa liczonych po sieci pieszej OSM. ' +
          'Punkty bez izochrony liczone są zapasowo okręgiem.',
        text: reachStats.radius
          ? `ZASIĘG PO SIECI PIESZEJ — ${fmtNum(reachStats.network)}/${fmtNum(reachStats.total)} AED`
          : 'ZASIĘG PO REALNEJ SIECI PIESZEJ',
      })
    )
  );

  /** Piny: istniejące (statyczne) + propozycje (przeciągalne). */
  const buildPins = () => {
    const pins = state.points
      .filter((p) => p.kind === 'existing' && p.status !== 'rejected')
      .map((p) => ({
        id: p.id,
        lat: p.lat,
        lon: p.lon,
        level: pointStatusLevel(p, completeness(p, getPreset(p.presetId), state.photos).pct),
        name: p.name,
        draggable: false,
      }));

    for (const p of state.points) {
      if (p.kind !== 'proposed' || p.status === 'rejected') continue;
      pins.push({
        id: p.id,
        lat: p.lat,
        lon: p.lon,
        level: 'proposed',
        name: `${p.name} — propozycja`,
        draggable: true,
      });
    }

    for (const proposal of state.pendingProposals) {
      pins.push({
        id: pendingPinId(proposal),
        lat: proposal.lat,
        lon: proposal.lon,
        level: 'proposed',
        name: `${proposal.name} — propozycja (czeka na decyzję)`,
        draggable: true,
      });
    }

    return pins;
  };

  /** Etykiety „LUKA: …" w centroidach trzech najgorszych dzielnic. */
  const buildGapLabels = (currentAnalysis) => {
    const features = (state.districtsGeo && state.districtsGeo.features) || [];
    return currentAnalysis.gaps
      .slice(0, GAP_LABELS_ON_MAP)
      .map((gap) => {
        const feature = features.find((f) => f.properties.id === gap.districtId);
        if (!feature) return null;
        const centre = ringCentroid(feature.geometry.coordinates[0]);
        return { lat: centre.lat, lon: centre.lon, text: `LUKA: ${gap.name}`, kind: 'gap' };
      })
      .filter(Boolean);
  };

  /**
   * Obrysy realnego zasięgu dojścia dla czynnych AED bieżącego scenariusza.
   * Wybrany punkt dostaje mocniejszy obrys — reszta zostaje tłem.
   */
  const buildReachShapes = () =>
    (analysis.activePoints || [])
      .map((p) => {
        const contours = contoursFor(p.lat, p.lon);
        const ring = contours && contours[standardMinutes];
        if (!ring) return null;
        return {
          id: p.id,
          kind: p.kind === 'proposed' ? 'proposed' : 'existing',
          ring,
          emphasis: p.id === selectedReachId,
        };
      })
      .filter(Boolean);

  /** Trasy dojścia wybranego punktu — pokazywane tylko dla niego. */
  const buildRouteLines = () => {
    if (!selectedReachId) return [];
    const point = (analysis.activePoints || []).find((p) => p.id === selectedReachId);
    if (!point) return [];
    const routes = routesFor(point.lat, point.lon);
    return routes ? routes.map((r) => r.line) : [];
  };

  const paintScene = () => {
    map.setScene({
      boundary: state.boundary,
      districts: state.districtsGeo,
      // Obrysy dzielnic wyłączone: nakładały się na punkty popytu i utrudniały
      // czytanie kolorów. Nazwy dzielnic zostają w panelu luk.
      showDistricts: false,
      // Zamiast okręgów — realne izochrony po sieci pieszej (patrz reach.js).
      coverage: [],
      showCoverage: false,
      reach: buildReachShapes(),
      showReach: true,
      routes: buildRouteLines(),
      showRoutes: true,
      demand: analysis.demandStatus,
      showDemand: true,
      targetMinutes: standardMinutes,
      points: buildPins(),
      labels: buildGapLabels(analysis),
      selectedId: state.ui.selectedPointId,
    });
  };

  paintScene();
  paintSelected();
  // Widok przerysowuje się po każdej zmianie danych (przesunięcie pinu, nowa
  // rekomendacja). Kadr wraca taki, jaki był — bez odjeżdżania do całego miasta.
  if (savedCamera && typeof map.setCamera === 'function') map.setCamera(savedCamera);
  else map.fit();

  /* ---------------- Interakcje mapy ---------------- */

  // Klik w pin nie przerzuca już od razu do karty: najpierw pokazuje, SKĄD
  // bierze się zasięg tego AED — obrys na mocno i trasy dojścia, które go
  // narysowały. Do karty prowadzi przycisk w panelu i drugi klik w ten sam pin.
  map.on('pointclick', (pin) => {
    if (isPendingPin(pin.id)) {
      toast('Propozycja czeka na decyzję — po ✓ dostanie własną kartę punktu.');
      return;
    }
    if (selectedReachId === pin.id) {
      ctx.navigate(`#/card/${encodeURIComponent(pin.id)}`);
      return;
    }
    selectedReachId = pin.id;
    paintScene();
    paintSelected();
  });

  // Klik w puste miejsce mapy dokłada rekomendację (fioletowy kwadrat) — to
  // najszybsza odpowiedź na pytanie „a gdyby AED stanęło tutaj?". Zysk liczy
  // ten sam coverageGainFor(), którego używa optymalizator, więc nowa
  // rekomendacja jest porównywalna z propozycjami wygenerowanymi automatycznie.
  // Pomyłkę odwraca „Cofnij" w pasku górnym.
  map.on('mapclick', async ({ lat, lon }) => {
    const districtId = districtAt(lat, lon);
    if (!districtId) {
      toast('Kliknięcie poza granicą miasta — rekomendacji nie dodano.');
      return;
    }

    const presetId = 'P1';
    const point = makePoint({
      id: nextId('NEW'),
      name: `Rekomendacja — ${districtName(districtId)}`,
      lat: Math.round(lat * 1e6) / 1e6,
      lon: Math.round(lon * 1e6) / 1e6,
      presetId,
      districtId,
      kind: 'proposed',
    });
    const gain = gainFor({ lat: point.lat, lon: point.lon }, state.points);
    point.gainPct = gain.gainPct;
    point.gainWeight = gain.gainWeight;
    point.access.always = OUTDOOR_PRESETS.has(presetId);
    point.phase = OUTDOOR_PRESETS.has(presetId) ? 3 : 2;

    checkpoint('dodanie rekomendacji na mapie');
    upsertPoint(point);
    await save();
    toast(`Rekomendacja ${point.id} · +${fmtPct(gain.gainPct, 1)} pokrycia. Zaakceptuj ją albo cofnij.`);
  });

  // Przeciąganie na żywo: liczymy na tymczasowej kopii i przemalowujemy panel.
  // Nic nie trafia do IndexedDB — zapis dopiero w pointdragend.
  let lastDrag = null;
  map.on('pointdrag', (pin) => {
    lastDrag = pin;
    if (dragTimer) return;
    dragTimer = setTimeout(() => {
      dragTimer = null;
      const moved = lastDrag;
      lastDrag = null;
      if (!moved) return;
      const points = state.points.map((p) =>
        p.id === moved.id ? { ...p, lat: moved.lat, lon: moved.lon } : p
      );
      const pending = state.pendingProposals.map((p) =>
        pendingPinId(p) === moved.id ? { ...p, lat: moved.lat, lon: moved.lon } : p
      );
      paintPanel(points, pending);
    }, DRAG_THROTTLE_MS);
  });

  map.on('pointdragend', async (pin) => {
    if (dragTimer) {
      clearTimeout(dragTimer);
      dragTimer = null;
    }
    lastDrag = null;

    if (isPendingPin(pin.id)) {
      const proposal = state.pendingProposals.find((p) => pendingPinId(p) === pin.id);
      if (!proposal) return;
      checkpoint(`przesunięcie propozycji „${proposal.name}”`);
      proposal.lat = pin.lat;
      proposal.lon = pin.lon;
      proposal.districtId = districtAt(pin.lat, pin.lon) || proposal.districtId;
      const gain = gainFor({ lat: proposal.lat, lon: proposal.lon }, state.points);
      proposal.gainPct = gain.gainPct;
      proposal.gainWeight = gain.gainWeight;
      await save();
      toast(`${proposal.name}: +${fmtPct(gain.gainPct, 1)} pokrycia w nowym miejscu.`);
      return;
    }

    const point = getPoint(pin.id);
    if (!point) return;
    checkpoint(`przesunięcie punktu „${point.name}”`);
    point.lat = pin.lat;
    point.lon = pin.lon;
    point.districtId = districtAt(pin.lat, pin.lon) || point.districtId;
    if (point.kind === 'proposed') {
      const gain = gainFor({ lat: point.lat, lon: point.lon }, state.points, point.id);
      point.gainPct = gain.gainPct;
      point.gainWeight = gain.gainWeight;
    }
    upsertPoint(point);
    await save();
    toast(`Przesunięto: ${point.name} · ${districtName(point.districtId)}.`);
  });
}

/** Zdejmuje mapę, zapamiętując wcześniej kadr. */
function releaseMap() {
  if (!map) return;
  try {
    if (typeof map.getCamera === 'function') savedCamera = map.getCamera();
  } catch (err) {
    console.warn('map.getCamera() failed', err);
  }
  try {
    map.destroy();
  } catch (err) {
    console.warn('map.destroy() failed', err);
  }
  map = null;
}

function destroy() {
  if (dragTimer) {
    clearTimeout(dragTimer);
    dragTimer = null;
  }
  releaseMap();
}

return { destroy, meta, render };
};

 * Stałe widoku

  'nazwa',

  'rekomendacje',

  { id: 'existing', label: 'Istniejące', test: (row) => row.point.kind === 'existing' },
  { id: 'proposed', label: 'Nowe', test: (row) => row.point.kind === 'proposed' },
];

  { id: 'completeness', label: 'Sortuj: kompletność rosnąco' },
  { id: 'recommendations', label: 'Sortuj: rekomendacje malejąco' },
  { id: 'name', label: 'Sortuj: alfabetycznie (A–Z)' },
];

const PRIORITY_ORDER = { high: 3, medium: 2, low: 1 };

/** Progi paska kompletności. Kolor niesie wyłącznie informację o danych. */

const PCT_WARN = 60;

 * Stan lokalny widoku (to nie są dane projektu — nie trafia do state)
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

/** Polska odmiana rzeczownika po liczebniku. */
function plural(n, [one, few, many]) {

  const rest100 = abs % 100;
  const rest10 = abs % 10;

  return rest10 >= 2 && rest10 <= 4 ? few : many;

/** Biernik po „wyeksportowano": „1 kartę · 3 karty · 19 kart". */

function barVariant(pct) {

 * Wiersz tabeli policzony z modelu.

    point,
    preset,
    score,
    pct,
    recs,

        h(

          {},

            { colspan: '7' },
            h('div', {

        `(${chosen.length ? 'zaznaczone' : 'wszystkie widoczne'}).`
    );
  }

 * Sprzątanie

const OWNER_OPTIONS = [

  { value: 'serwis', label: 'Serwis' },
  { value: 'wykonawca', label: 'Wykonawca' },
];

const PRIORITY_OPTIONS = ['high', 'medium', 'low'];

const MONTHS_PL = [
  'styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec',
  'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień',

/* ------------------------------------------------------------------ *
 * Stan lokalny modułu (przeżywa przerysowania widoku)
 * ------------------------------------------------------------------ */

let saveTimer = null;
let focusMemo = null;
let scrollMemo = null;
let photosModulePromise = null;

/** Numery wszystkich sekcji karty — do „rozwiń/zwiń wszystkie". */
const ALL_SECTIONS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

/**
 * Które sekcje są zwinięte — pamiętane per punkt między przerysowaniami
 * (zapis pola przerysowuje widok i nie może zamykać sekcji pod ręką).
 * Karta otwiera się zwinięta do przeglądu nagłówków, jak w makiecie W3b.
 */
let collapseMemo = null;

function collapsedSetFor(pointId) {
  if (!collapseMemo || collapseMemo.pointId !== pointId) {
    collapseMemo = { pointId, set: new Set(ALL_SECTIONS) };
  }
  return collapseMemo.set;
}

/**
 * js/photos.js powstaje równolegle. Import jest dynamiczny i buforowany, żeby
 * przy każdym przerysowaniu karty nie dobijać się o plik, którego może nie być.
 * Brak modułu = komunikat w sekcji zdjęć, reszta karty działa normalnie.
 */
function loadPhotosModule() {
  if (!photosModulePromise) {
    photosModulePromise = Promise.resolve(__req('js/photos.js')).catch(() => null);
  }
  return photosModulePromise;
}

/* ------------------------------------------------------------------ *
 * Pomocniki lokalne (rdzenia nie ruszamy)
 * ------------------------------------------------------------------ */

function readPath(obj, path) {
  return path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), obj);
}

/** Zapis w głąb obiektu punktu; brakujące gałęzie są dotwarzane. */
function writePath(obj, path, value) {
  const keys = path.split('.');
  let node = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (node[keys[i]] == null || typeof node[keys[i]] !== 'object') node[keys[i]] = {};
    node = node[keys[i]];
  }
  node[keys[keys.length - 1]] = value;
}

/** Puste pole trzymamy jako null — tak samo traktuje je completeness(). */
function normalizeText(raw) {
  return raw === '' ? null : raw;
}

function fieldId(key) {
  return `card-f-${String(key).replace(/[^\w-]/g, '-')}`;
}

/** '2026-03' → 'marzec 2026'; puste → '—'. */
function monthLabel(value) {
  if (!value) return '—';
  const [year, month] = String(value).slice(0, 7).split('-');
  const index = Number(month) - 1;
  if (!year || Number.isNaN(index) || !MONTHS_PL[index]) return String(value);
  return `${MONTHS_PL[index]} ${year}`;
}

/** Czy termin (YYYY-MM) minął względem TODAY z config.js. */
function isOverdueMonth(value) {
  if (!value) return false;
  return String(value).slice(0, 7) < String(TODAY).slice(0, 7);
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    save();
  }, TEXT_DEBOUNCE_MS);
}

async function saveNow() {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  await save();
}

/**
 * save() przerysowuje cały widok, więc przed zapisem zapamiętujemy, gdzie stał
 * kursor, a po przerysowaniu wracamy w to samo miejsce.
 */
function rememberFocus(node, pointId) {
  let start = null;
  let end = null;
  try {
    start = node.selectionStart;
    end = node.selectionEnd;
  } catch (err) {
    // input[type=month|number] nie wspiera zaznaczenia — to nie jest błąd
    start = null;
    end = null;
  }
  focusMemo = { pointId, key: node.dataset ? node.dataset.fkey : null, start, end, at: Date.now() };
}

/** To samo dla przewinięcia kolumny sekcji — inaczej zapis odrzucałby na górę karty. */
function rememberScroll(node, pointId) {
  scrollMemo = { pointId, top: node.scrollTop };
}

function restoreScroll(node, pointId) {
  if (!scrollMemo || scrollMemo.pointId !== pointId) return;
  node.scrollTop = scrollMemo.top;
}

function restoreFocus(root, pointId) {
  const memo = focusMemo;
  focusMemo = null;
  if (!memo || !memo.key || memo.pointId !== pointId) return;
  if (Date.now() - memo.at > FOCUS_TTL_MS) return;
  const node = root.querySelector(`[data-fkey="${memo.key}"]`);
  if (!node) return;
  node.focus();
  if (memo.start !== null && typeof node.setSelectionRange === 'function') {
    try {
      node.setSelectionRange(memo.start, memo.end);
    } catch (err) {
      /* pole bez zaznaczenia — wystarczy sam fokus */
    }
  }
}

/* ------------------------------------------------------------------ *
 * Klocki formularza
 * ------------------------------------------------------------------ */

function field(label, control, hint, forId) {
  return h(
    'div',
    { class: 'field' },
    h('label', { class: 'field__label', for: forId || null, text: label }),
    control,
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/**
 * Pole tekstowe / textarea / input[type=month] podpięte do ścieżki w punkcie.
 * Zmiana leci od razu do state, save() jest opóźniony (SPEC §6.5).
 */
function textField({
  point,
  path,
  label,
  hint,
  type = 'text',
  placeholder = '',
  textarea = false,
  disabled = false,
  readonly = false,
  display = null,
}) {
  const id = fieldId(path);
  const raw = readPath(point, path);
  const value = display !== null ? display : raw == null ? '' : String(raw);

  const props = {
    class: textarea ? 'textarea' : 'input',
    id,
    dataset: { fkey: path },
    placeholder: placeholder || null,
    disabled: disabled || null,
    readonly: readonly || null,
  };

  const control = textarea
    ? h('textarea', props, value)
    : h('input', { ...props, type, value });

  if (!disabled && !readonly) {
    control.addEventListener('input', (event) => {
      rememberFocus(event.target, point.id);
      writePath(point, path, normalizeText(event.target.value));
      upsertPoint(point);
      scheduleSave();
    });
  }

  return field(label, control, hint, id);
}

/** Select podpięty do ścieżki w punkcie — zapis natychmiastowy. */
function selectField({ point, path, label, hint, options, disabled = false, onPick = null }) {
  const id = fieldId(path);
  const value = readPath(point, path);
  const control = h(
    'select',
    { class: 'select', id, dataset: { fkey: path }, disabled: disabled || null },
    ...options.map((option) =>
      h('option', { value: option.value, selected: String(option.value) === String(value ?? '') }, option.label)
    )
  );

  if (!disabled) {
    control.addEventListener('change', async (event) => {
      rememberFocus(event.target, point.id);
      const picked = event.target.value === '' ? null : event.target.value;
      if (onPick) onPick(picked);
      else writePath(point, path, picked);
      upsertPoint(point);
      await saveNow();
    });
  }

  return field(label, control, hint, id);
}

/** Trzy stany: tak / nie / brak danych (null). Zapis natychmiastowy. */
function triStateField({ point, path, label, hint, disabled = false }) {
  const value = readPath(point, path) ?? null;
  const name = `card-${path.replace(/\./g, '-')}`;
  const options = [
    { v: true, l: 'tak' },
    { v: false, l: 'nie' },
    { v: null, l: 'brak danych' },
  ];

  const row = h(
    'div',
    { class: 'radio-row' },
    ...options.map((option) => {
      const id = `${name}-${String(option.v)}`;
      const input = h('input', {
        type: 'radio',
        name,
        id,
        dataset: { fkey: `${path}:${String(option.v)}` },
        checked: value === option.v,
        disabled: disabled || null,
      });
      if (!disabled) {
        input.addEventListener('change', async () => {
          rememberFocus(input, point.id);
          writePath(point, path, option.v);
          upsertPoint(point);
          await saveNow();
        });
      }
      return h('label', { class: 'checkline', for: id }, input, h('span', { text: option.l }));
    })
  );

  return h(
    'div',
    { class: 'field' },
    h('span', { class: 'field__label', text: label }),
    row,
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/** Checkbox z trzecim stanem „brak danych" pokazywanym jako indeterminate. */
function checkboxField({ point, path, label, hint, disabled = false }) {
  const value = readPath(point, path) ?? null;
  const id = fieldId(path);
  const input = h('input', {
    type: 'checkbox',
    id,
    dataset: { fkey: path },
    checked: value === true,
    disabled: disabled || null,
  });
  if (value === null) input.indeterminate = true;

  if (!disabled) {
    input.addEventListener('change', async () => {
      rememberFocus(input, point.id);
      writePath(point, path, input.checked);
      upsertPoint(point);
      await saveNow();
    });
  }

  return h(
    'div',
    { class: 'field' },
    h('label', { class: 'checkline', for: id }, input, h('span', { text: label })),
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/* ------------------------------------------------------------------ *
 * Sekcja karty
 * ------------------------------------------------------------------ */

const SECTION_PILL = {
  crit: { text: 'BRAK KRYTYCZNY', variant: 'crit' },
  warn: { text: 'BRAKI', variant: 'warn' },
  '': { text: 'KOMPLET', variant: 'ok' },
};

/** Zwinięty zestaw bieżącej karty + odświeżacz etykiety przycisku — ustawiane w render(). */
let currentCollapsed = new Set();
let refreshToggleLabel = () => {};

function cardSection({ num, title, level = '', pills = [], badge: customBadge = null, children }) {
  const badge = customBadge || SECTION_PILL[level] || SECTION_PILL[''];
  const collapsed = currentCollapsed.has(num);

  const chev = h('span', { class: 'card-section__chev', text: collapsed ? '▸' : '▾' });
  const section = h(
    'section',
    { class: `card-section${level ? ` card-section--${level}` : ''}${collapsed ? ' is-collapsed' : ''}` },
    h(
      'div',
      {
        class: 'card-section__head',
        title: collapsed ? 'Rozwiń sekcję' : 'Zwiń sekcję',
        onclick: () => {
          const nowCollapsed = !currentCollapsed.has(num);
          if (nowCollapsed) currentCollapsed.add(num);
          else currentCollapsed.delete(num);
          section.classList.toggle('is-collapsed', nowCollapsed);
          chev.textContent = nowCollapsed ? '▸' : '▾';
          refreshToggleLabel();
        },
      },
      chev,
      h('span', { class: 'card-section__num', text: String(num) }),
      h('h3', { text: title }),
      ...pills.map((p) => h('span', { html: pillHtml(p.text, p.variant) })),
      h('span', { html: pillHtml(badge.text, badge.variant) })
    ),
    h('div', { class: 'card-section__body' }, ...children.filter(Boolean))
  );
  return section;
}

function twoCols(...children) {
  return h('div', { class: 'card-section__body--cols', style: { display: 'grid', gap: '12px' } }, ...children.filter(Boolean));
}

function note(text) {
  return h('p', { class: 'note', style: { margin: '0' }, text });
}

/* ------------------------------------------------------------------ *
 * Rekomendacje — scalenie auto + zapisanych
 * ------------------------------------------------------------------ */

/** Kopia rekomendacji bez pól pomocniczych widoku. */
function cleanRec(rec) {
  const { persisted, stale, ...rest } = rec;
  return rest;
}

/**
 * autoRecommendations() + pozycje już zapisane w state, scalone po id.
 * Z zapisanej wersji zachowujemy `done`, `phase` i ramy czasowe roadmapy.
 * Pozycje auto, których reguła już nie obowiązuje, zostają na liście
 * oznaczone jako nieaktualne — nie kasujemy ich za plecami operatora.
 */
function mergeRecommendations(point, preset) {
  const stored = recommendationsForPoint(point.id);
  const byId = new Map(stored.map((r) => [r.id, r]));
  const autos = autoRecommendations(point, preset, state.photos);
  const autoIds = new Set(autos.map((r) => r.id));

  const merged = autos.map((auto) => {
    const prev = byId.get(auto.id);
    if (!prev) return { ...auto, persisted: false, stale: false };
    return {
      ...auto,
      done: prev.done === true,
      phase: prev.phase ?? null,
      startMonth: prev.startMonth,
      lengthMonths: prev.lengthMonths,
      persisted: true,
      stale: false,
    };
  });

  for (const rec of stored) {
    if (autoIds.has(rec.id)) continue;
    merged.push({ ...rec, persisted: true, stale: rec.auto === true });
  }

  const rank = { high: 0, medium: 1, low: 2 };
  return merged.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (rank[a.priority] ?? 3) - (rank[b.priority] ?? 3);
  });
}

/** Dopisuje do state pozycje automatyczne, których jeszcze tam nie ma. */
function persistAutoRecommendations(merged) {
  let added = 0;
  for (const rec of merged) {
    if (rec.persisted || rec.stale) continue;
    upsertRecommendation(cleanRec(rec));
    added += 1;
  }
  return added;
}

async function addManualRecommendation(point) {
  const textEl = h('textarea', { class: 'textarea', placeholder: 'Co dokładnie trzeba zrobić w tym punkcie?' });
  const priorityEl = h(
    'select',
    { class: 'select' },
    ...PRIORITY_OPTIONS.map((p) => h('option', { value: p, selected: p === 'medium' }, PRIORITY_LABEL[p]))
  );
  const costEl = h('input', { class: 'input', type: 'number', min: '0', step: '100', value: '0' });
  const ownerEl = h(
    'select',
    { class: 'select' },
    ...OWNER_OPTIONS.map((o) => h('option', { value: o.value }, o.label))
  );

  const body = h(
    'div',
    { class: 'stack' },
    field('Treść pozycji', textEl),
    field('Priorytet', priorityEl),
    field('Koszt (zł)', costEl, 'Wpisz 0, jeśli pozycja nie generuje kosztu.'),
    field('Odpowiedzialny', ownerEl)
  );

  const confirmed = await modal({
    title: 'Nowa pozycja checklisty',
    body,
    confirmLabel: 'Dodaj pozycję',
  });
  if (!confirmed) return;

  const text = textEl.value.trim();
  if (!text) {
    toast('Pozycja bez treści nie została dodana.');
    return;
  }

  upsertRecommendation({
    id: `man-${point.id}-${Date.now().toString(36)}`,
    pointId: point.id,
    text,
    priority: priorityEl.value,
    cost: Number(costEl.value) || 0,
    owner: ownerEl.value,
    phase: null,
    auto: false,
    done: false,
  });
  await saveNow();
  toast('Dodano pozycję do checklisty punktu.');
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */

async function render(root, ctx) {
  const project = state.project;
  const point = getPoint(ctx.params && ctx.params.id);

  if (!project || !point) {
    mount(
      root,
      h(
        'div',
        { style: { padding: '20px', width: '100%' } },
        h(
          'div',
          { class: 'empty-state' },
          h('p', { text: `Nie znaleziono punktu o identyfikatorze „${(ctx.params && ctx.params.id) || '—'}".` }),
          h('p', { class: 'note', text: 'Punkt mógł zostać usunięty albo link jest nieaktualny.' }),
          h(
            'button',
            { class: 'btn btn--primary', style: { marginTop: '10px' }, onclick: () => ctx.navigate('#/cards') },
            '← WRÓĆ DO LISTY KART'
          )
        )
      )
    );
    return;
  }

  if (!(project.stepsDone || []).includes(3)) {
    markStepDone(3);
    await save({ silent: true });
  }

  /* ---------------- Moduł zdjęć (budowany równolegle) ---------------- */

  const photosApi = await loadPhotosModule();

  /* ---------------- Dane wyliczone (zawsze z model.js) ---------------- */

  const preset = getPreset(point.presetId);
  const comp = completeness(point, preset, state.photos);
  const status = statusMeta(point, comp.pct);
  const isProposed = point.kind === 'proposed';
  const standardMinutes = project.standardMinutes;
  const radiusM = coverageRadiusM(standardMinutes);
  const merged = mergeRecommendations(point, preset);
  const openRecs = merged.filter((r) => !r.done);
  const pointPhotos = state.photos.filter((ph) => ph.pointId === point.id);
  const score = expertScore(point);

  state.ui.selectedPointId = point.id;
  currentCollapsed = collapsedSetFor(point.id);

  /* ---------------- Poziom paska statusu sekcji ---------------- */

  const openRuleSections = new Set(
    openRecs.filter((r) => r.rule && RULE_SECTION[r.rule]).map((r) => RULE_SECTION[r.rule])
  );

  const missesRequired = (num) => {
    const prefixes = SECTION_PATHS[num] || [];
    return comp.missingFields.some((path) =>
      prefixes.some((prefix) => path === prefix || path.startsWith(`${prefix}.`))
    );
  };

  // Miękkie braki: pola nieobowiązkowe dla presetu i terminy po dacie TODAY.
  const softGap = {
    1: !point.address || !point.placement || !point.districtId || comp.missingPhotos.length > 0,
    3: (point.access?.always ?? null) === null || !point.access?.hours || !point.access?.weekend,
    4: !point.keeper?.person || !point.keeper?.contact,
    5: (point.signage?.atDevice ?? null) === null || (point.signage?.route ?? null) === null,
    6:
      !point.device?.padsDue ||
      isOverdueMonth(point.device?.inspectionDue) ||
      isOverdueMonth(point.device?.padsDue),
    7: point.dispatcherRegistered !== true,
  };

  const levelOf = (num) => {
    if (isProposed && INERT_FOR_PROPOSED.has(num)) return '';
    if (missesRequired(num)) return 'crit';
    if (openRuleSections.has(num) || softGap[num]) return 'warn';
    return '';
  };

  /* ---------------- Sub bar ---------------- */

  if (ctx.setMeta) {
    ctx.setMeta(
      `${point.id} · kompletność ${fmtPct(comp.pct, 0)} · ` +
        `rekomendacje otwarte: ${fmtNum(openRecs.length)} z ${fmtNum(merged.length)}`
    );
  }

  if (ctx.subbar && ctx.subbar.controls) {
    const order = state.points.map((p) => p.id);
    const index = order.indexOf(point.id);
    const goto = (offset) => {
      const target = order[index + offset];
      if (target) ctx.navigate(`#/card/${encodeURIComponent(target)}`);
    };

    const prevBtn = h('button', { class: 'btn btn--sm', onclick: () => goto(-1) }, '← Poprzedni');
    const nextBtn = h('button', { class: 'btn btn--sm', onclick: () => goto(1) }, 'Następny →');
    if (index <= 0) {
      prevBtn.setAttribute('disabled', '');
      prevBtn.setAttribute('data-tip', 'to pierwszy punkt na liście');
    }
    if (index < 0 || index >= order.length - 1) {
      nextBtn.setAttribute('disabled', '');
      nextBtn.setAttribute('data-tip', 'to ostatni punkt na liście');
    }

    mount(
      ctx.subbar.controls,
      prevBtn,
      nextBtn,
      h('button', { class: 'btn btn--sm', onclick: () => ctx.navigate('#/cards') }, 'LISTA KART')
    );
  }

  /* ================================================================ *
   * SEKCJA 1 — Identyfikacja
   * ================================================================ */

  const photoBox = h('div', { class: 'stack' });

  const paintPhotoFallback = (reason) => {
    const missingRoles = comp.missingPhotos.map(photoRoleLabel);
    mount(
      photoBox,
      h('div', { class: 'note', text: reason }),
      preset && (preset.requiredPhotos || []).length
        ? h('div', {
            class: 'note',
            text:
              `Preset ${preset.id} wymaga zdjęć: ${(preset.requiredPhotos || []).map(photoRoleLabel).join(', ')}. ` +
              `Wgranych przy tym punkcie: ${fmtNum(pointPhotos.length)}.`,
          })
        : null,
      missingRoles.length
        ? h('div', { class: 'note', text: `Brakuje: ${missingRoles.join(', ')} — kompletność karty jest o to obniżona.` })
        : null
    );
  };

  if (photosApi && typeof photosApi.renderPhotoSlots === 'function') {
    try {
      photosApi.renderPhotoSlots(photoBox, point, preset, {
        onChange: async () => {
          await saveNow();
        },
      });
    } catch (err) {
      console.warn('renderPhotoSlots() nie powiodło się', err);
      paintPhotoFallback('Moduł zdjęć niedostępny');
    }
  } else {
    paintPhotoFallback('Moduł zdjęć niedostępny');
  }

  const districtOptions = [
    { value: '', label: '— nie przypisano —' },
    ...(project.districts || []).map((d) => ({ value: d.id, label: d.name })),
  ];

  const section1 = cardSection({
    num: 1,
    title: 'Identyfikacja',
    level: levelOf(1),
    children: [
      textField({ point, path: 'name', label: 'Nazwa punktu', placeholder: 'np. SP nr 7 — hol główny' }),
      twoCols(
        textField({ point, path: 'address', label: 'Adres', placeholder: 'ul. Szkolna 3' }),
        selectField({ point, path: 'districtId', label: 'Dzielnica', options: districtOptions })
      ),
      twoCols(
        textField({
          point,
          path: 'lat',
          label: 'Szerokość geogr.',
          readonly: true,
          display: fmtNum(point.lat, 6),
          hint: 'tylko odczyt',
        }),
        textField({
          point,
          path: 'lon',
          label: 'Długość geogr.',
          readonly: true,
          display: fmtNum(point.lon, 6),
          hint: 'tylko odczyt',
        })
      ),
      textField({
        point,
        path: 'placement',
        label: 'Umiejscowienie',
        textarea: true,
        placeholder: 'np. hol główny, przy portierni, na wysokości 1,4 m',
      }),
      h('div', { class: 'divider' }),
      h('span', { class: 'label-caps', text: 'Galeria zdjęć — dowody audytu (SPEC §7)' }),
      photoBox,
    ],
  });

  /* ================================================================ *
   * SEKCJA 2 — Preset
   * ================================================================ */

  const presetOptions = state.presets.map((p) => ({
    value: p.id,
    label: `${p.id} — ${p.name} · ${fmtCost(p.cost)}`,
  }));

  const requirementRow = (label, ok) =>
    h(
      'div',
      { class: 'row', style: { fontSize: '12px' } },
      h('span', { html: pillHtml(ok ? 'jest' : 'brak', ok ? 'ok' : 'warn') }),
      h('span', { text: label })
    );

  const section2 = cardSection({
    num: 7,
    title: 'Preset i koszt jednostkowy',
    level: preset ? '' : 'crit',
    pills: preset ? [{ text: fmtCost(preset.cost), variant: '' }] : [],
    children: [
      selectField({
        point,
        path: 'presetId',
        label: 'Preset',
        options: presetOptions,
        hint: 'Preset decyduje o tym, które pola i zdjęcia są wymagane oraz o koszcie jednostkowym.',
      }),
      preset
        ? h(
            'div',
            { class: 'stack' },
            h('span', { class: 'label-caps', text: `Pola wymagane (${fmtNum((preset.requiredFields || []).length)})` }),
            h(
              'div',
              { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '4px' } },
              ...(preset.requiredFields || []).map((path) =>
                requirementRow(FIELD_LABEL[path] || path, !comp.missingFields.includes(path))
              )
            ),
            h('span', {
              class: 'label-caps',
              style: { marginTop: '6px' },
              text: `Zdjęcia wymagane (${fmtNum((preset.requiredPhotos || []).length)})`,
            }),
            h(
              'div',
              { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '4px' } },
              ...(preset.requiredPhotos || []).map((role) =>
                requirementRow(photoRoleLabel(role), !comp.missingPhotos.includes(role))
              )
            ),
            note(`Koszt jednostkowy presetu: ${fmtCost(preset.cost)} — trafia do wyceny roadmapy.`)
          )
        : note('Punkt nie ma przypisanego presetu — bez niego nie da się policzyć kompletności ani kosztu.'),
    ],
  });

  /* ================================================================ *
   * SEKCJE 3–6 — dane terenowe (dla propozycji wyszarzone)
   * ================================================================ */

  const inert = isProposed;
  const inertPills = inert ? [{ text: 'PO MONTAŻU', variant: 'phase3' }] : [];
  const inertNote = inert
    ? note('Punkt jest jeszcze propozycją — te dane uzupełnia się po montażu urządzenia. Wytyczne wdrożeniowe znajdziesz w sekcji 6.')
    : null;

  const section3 = cardSection({
    num: 2,
    title: 'Dostępność',
    level: levelOf(3),
    pills: inertPills,
    children: [
      inertNote,
      checkboxField({
        point,
        path: 'access.always',
        label: 'Dostępny całodobowo (24/7)',
        hint: 'Tylko punkty 24/7 liczą się w trybie nocnym analizy pokrycia.',
        disabled: inert,
      }),
      twoCols(
        textField({
          point,
          path: 'access.hours',
          label: 'Godziny dostępu',
          placeholder: 'pn–pt 8:00–16:00',
          disabled: inert,
        }),
        textField({ point, path: 'access.weekend', label: 'Weekend', placeholder: 'zamknięte', disabled: inert })
      ),
      textField({
        point,
        path: 'access.barriers',
        label: 'Bariery dostępu',
        textarea: true,
        placeholder: 'np. domofon po 15:00, wejście przez portiernię',
        disabled: inert,
      }),
    ],
  });

  const section4 = cardSection({
    num: 3,
    title: 'Opiekun punktu',
    level: levelOf(4),
    pills: inertPills,
    children: [
      inertNote,
      textField({
        point,
        path: 'keeper.org',
        label: 'Organizacja',
        placeholder: 'np. MOSiR Tychy',
        disabled: inert,
        hint: 'Brak organizacji uruchamia rekomendację o priorytecie wysokim.',
      }),
      twoCols(
        textField({ point, path: 'keeper.person', label: 'Osoba', placeholder: 'imię i nazwisko', disabled: inert }),
        textField({ point, path: 'keeper.contact', label: 'Kontakt', placeholder: 'tel. / e-mail', disabled: inert })
      ),
    ],
  });

  const section5 = cardSection({
    num: 4,
    title: 'Oznakowanie',
    level: levelOf(5),
    pills: inertPills,
    children: [
      inertNote,
      triStateField({
        point,
        path: 'signage.atDevice',
        label: 'Znak ILCOR przy urządzeniu',
        hint: 'Tabliczka bezpośrednio przy AED.',
        disabled: inert,
      }),
      triStateField({
        point,
        path: 'signage.route',
        label: 'Oznakowanie dojścia od ulicy',
        hint: 'Strzałki kierunkowe prowadzące od wejścia lub chodnika.',
        disabled: inert,
      }),
    ],
  });

  const inspectionOverdue = isOverdueMonth(point.device?.inspectionDue);
  const padsOverdue = isOverdueMonth(point.device?.padsDue);

  const section6 = cardSection({
    num: 5,
    title: 'Urządzenie',
    level: levelOf(6),
    pills: [
      ...inertPills,
      ...(!inert && (inspectionOverdue || padsOverdue) ? [{ text: 'PO TERMINIE', variant: 'crit' }] : []),
    ],
    children: [
      inertNote,
      textField({ point, path: 'device.model', label: 'Model urządzenia', placeholder: 'np. Zoll AED Plus', disabled: inert }),
      twoCols(
        textField({
          point,
          path: 'device.inspectionDue',
          label: 'Termin przeglądu',
          type: 'month',
          disabled: inert,
          hint: `w danych: ${monthLabel(point.device?.inspectionDue)}`,
        }),
        textField({
          point,
          path: 'device.padsDue',
          label: 'Termin elektrod',
          type: 'month',
          disabled: inert,
          hint: `w danych: ${monthLabel(point.device?.padsDue)}`,
        })
      ),
      !inert && inspectionOverdue
        ? note(
            `Termin przeglądu (${monthLabel(point.device.inspectionDue)}) minął względem daty odniesienia ${monthLabel(TODAY)} — ` +
              'sekcja 8 pokazuje rekomendację przeglądu z priorytetem wysokim.'
          )
        : null,
      !inert && padsOverdue
        ? note(`Termin elektrod (${monthLabel(point.device.padsDue)}) minął — elektrody po dacie ważności nie gwarantują defibrylacji.`)
        : null,
    ],
  });

  /* ================================================================ *
   * SEKCJA 7 — rejestracja w CPR / wytyczne montażu
   * ================================================================ */

  const section7 = isProposed
    ? cardSection({
        num: 6,
        title: `Wytyczne montażu — preset ${preset ? preset.id : '—'}`,
        level: preset && (preset.checklist || []).length ? '' : 'warn',
        pills: [{ text: 'SPECYFIKACJA WDROŻENIOWA', variant: 'phase3' }],
        children: [
          note('Punkt proponowany — poniżej lista warunków, które muszą być spełnione przy montażu. Pochodzi z presetu.'),
          preset && (preset.checklist || []).length
            ? h(
                'ul',
                { style: { margin: '0', paddingLeft: '18px' } },
                ...(preset.checklist || []).map((item) => h('li', { style: { fontSize: '12.5px' }, text: item }))
              )
            : note('Preset nie zawiera listy wytycznych montażowych.'),
          preset
            ? note(
                `Koszt jednostkowy ${fmtCost(preset.cost)} · zdjęcia wymagane po montażu: ` +
                  `${(preset.requiredPhotos || []).map(photoRoleLabel).join(', ') || 'brak'}.`
              )
            : null,
          note('Rejestrację urządzenia u dyspozytora CPR 112/999 zgłasza się po odbiorze montażu — pole pojawi się tutaj po zmianie punktu na istniejący.'),
        ],
      })
    : cardSection({
        num: 6,
        title: 'Rejestracja w systemie CPR 112/999',
        level: levelOf(7),
        children: [
          triStateField({
            point,
            path: 'dispatcherRegistered',
            label: 'AED zgłoszone dyspozytorowi medycznemu',
          }),
          note(
            'Dyspozytor CPR może wskazać świadkowi najbliższe AED tylko wtedy, gdy urządzenie jest w jego bazie. ' +
              'Punkt niezgłoszony nie działa w łańcuchu przeżycia — fizycznie istnieje, ale nie zostanie użyty w wezwaniu. ' +
              'Zgłoszenie jest bezkosztowe, dlatego reguła nadaje mu priorytet wysoki.'
          ),
        ],
      });

  /* ================================================================ *
   * SEKCJA 8 — checklist zgodności i rekomendacje
   * ================================================================ */

  const openCost = openRecs.reduce((sum, r) => sum + (r.cost || 0), 0);
  const inRoadmap = merged.filter((r) => r.phase).length;
  const highOpen = openRecs.some((r) => r.priority === 'high');

  const recRow = (rec) => {
    const checkbox = h('input', {
      type: 'checkbox',
      checked: rec.done === true,
      dataset: { fkey: `rec:${rec.id}` },
      title: rec.done ? 'Odznacz jako niezrobione' : 'Oznacz jako zrobione',
    });
    checkbox.addEventListener('change', async () => {
      rememberFocus(checkbox, point.id);
      upsertRecommendation({ ...cleanRec(rec), done: checkbox.checked });
      await saveNow();
    });

    const removable = rec.auto !== true || rec.stale;
    const removeBtn = removable
      ? h(
          'button',
          {
            class: 'btn btn--sm btn--danger',
            title: rec.stale ? 'Usuń nieaktualną pozycję automatyczną' : 'Usuń pozycję ręczną',
            onclick: async () => {
              const ok = await modal({
                title: 'Usunąć pozycję?',
                body: `<p class="note">${escapeHtml(rec.text)}</p><p class="note">Pozycja zniknie także z roadmapy.</p>`,
                confirmLabel: 'Usuń',
              });
              if (!ok) return;
              removeRecommendation(rec.id);
              await saveNow();
              toast('Pozycja usunięta.');
            },
          },
          'usuń'
        )
      : null;

    return h(
      'div',
      { class: 'list-row', style: { cursor: 'default' } },
      h('label', { class: 'checkline', style: { paddingTop: '1px' } }, checkbox),
      h(
        'div',
        { class: 'list-row__body' },
        h('div', {
          class: 'list-row__title',
          style: rec.done ? { textDecoration: 'line-through', color: 'var(--ink-2)' } : {},
          text: rec.text,
        }),
        h(
          'div',
          { class: 'row row--wrap', style: { marginTop: '4px' } },
          h('span', { html: pillHtml(PRIORITY_LABEL[rec.priority] || rec.priority, PRIORITY_VARIANT[rec.priority] || '') }),
          h('span', { class: 'list-row__meta num', text: fmtCost(rec.cost || 0) }),
          h('span', { class: 'list-row__meta', text: `odp.: ${rec.owner || '—'}` }),
          h('span', { class: 'list-row__meta', text: rec.auto ? 'z reguły' : 'ręczna' }),
          rec.phase && PHASE_META[rec.phase]
            ? h('span', { html: pillHtml(PHASE_META[rec.phase].label, `phase${rec.phase}`) })
            : null,
          !rec.persisted ? h('span', { html: pillHtml('NIEZAPISANA', 'warn') }) : null,
          rec.stale ? h('span', { html: pillHtml('REGUŁA NIEAKTUALNA', '') }) : null
        )
      ),
      removeBtn
    );
  };

  const section8 = cardSection({
    num: 8,
    title: 'Checklist zgodności i rekomendacje',
    level: openRecs.length === 0 ? '' : highOpen ? 'crit' : 'warn',
    children: [
      merged.length
        ? h('div', { class: 'stack', style: { gap: '0' } }, ...merged.map(recRow))
        : h('div', { class: 'empty-state', text: 'Brak rekomendacji — punkt spełnia wszystkie reguły automatyczne.' }),
      h(
        'div',
        { class: 'row row--wrap', style: { marginTop: '6px' } },
        h('span', {
          class: 'note',
          text:
            `Otwarte: ${fmtNum(openRecs.length)} z ${fmtNum(merged.length)} · ` +
            `koszt otwartych ${fmtCost(openCost)} · w roadmapie: ${fmtNum(inRoadmap)}`,
        }),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn btn--sm', onclick: () => addManualRecommendation(point) }, '+ dodaj pozycję')
      ),
      note('Pozycje „z reguły" wylicza model po każdej zmianie karty. Zapis karty utrwala je w projekcie, dzięki czemu trafiają do roadmapy i raportu.'),
    ],
  });

  /* ================================================================ *
   * SEKCJA 9 — ocena ekspercka lokalizacji
   * ================================================================ */

  /** Wartości suwaków przed pierwszym zapisem — start neutralny (5). */
  const scoreDraft = {};
  for (const c of EXPERT_CRITERIA) {
    const saved = point.expert ? point.expert[c.key] : null;
    scoreDraft[c.key] = typeof saved === 'number' ? saved : 5;
  }

  const scoreValueEl = h('span', { class: 'score-box__value num', text: score ? fmtNum(score.value, 1) : '—' });
  const scoreVerdictEl = h('span', {
    html: score ? pillHtml(score.verdict.label, score.verdict.variant) : pillHtml('NIEOCENIONA', 'warn'),
  });

  /** Podgląd wyniku na żywo w trakcie przesuwania — bez zapisu. */
  const previewScore = () => {
    let sum = 0;
    for (const c of EXPERT_CRITERIA) sum += scoreDraft[c.key] * c.weight;
    scoreValueEl.textContent = fmtNum(Math.round(sum * 10) / 10, 1);
  };

  /** Zapis oceny: pierwszy ruch suwakiem utrwala komplet sześciu kryteriów. */
  const commitScore = async () => {
    point.expert = { ...(point.expert || {}), ...scoreDraft };
    upsertPoint(point);
    await saveNow();
  };

  const criterionRow = (c) => {
    const valEl = h('span', { class: 'score-crit__val num', text: String(scoreDraft[c.key]) });
    const slider = h('input', {
      type: 'range',
      min: '0',
      max: '10',
      step: '1',
      value: String(scoreDraft[c.key]),
      dataset: { fkey: `expert.${c.key}` },
      disabled: inert || null,
    });
    if (!inert) {
      // input = podgląd na żywo; change (puszczenie suwaka) = zapis.
      slider.addEventListener('input', () => {
        scoreDraft[c.key] = Number(slider.value);
        valEl.textContent = slider.value;
        previewScore();
      });
      slider.addEventListener('change', commitScore);
    }
    return h(
      'div',
      { class: 'score-crit' },
      h(
        'div',
        { class: 'score-crit__head' },
        h('b', { text: `[${c.key}] ${c.label}` }),
        h('span', { class: 'muted', text: `(${fmtNum(c.weight * 100, 0)}%)` }),
        valEl
      ),
      slider
    );
  };

  const section9 = cardSection({
    num: 9,
    title: 'Ocena ekspercka lokalizacji',
    level: '',
    badge: score
      ? { text: `${fmtNum(score.value, 1)} / 10`, variant: score.verdict.variant }
      : { text: 'NIEOCENIONA', variant: 'warn' },
    children: [
      inert
        ? note('Punkt jest propozycją — lokalizację ocenia się po wizji lokalnej albo montażu.')
        : null,
      h(
        'div',
        { class: 'score-box' },
        h(
          'div',
          null,
          h('div', { class: 'label-caps', text: 'Wzór obliczeniowy' }),
          h('div', { class: 'score-box__formula', text: EXPERT_FORMULA })
        ),
        scoreValueEl,
        h('span', { class: 'muted', style: { fontSize: '12px' }, text: '/ 10' }),
        scoreVerdictEl
      ),
      h('div', { class: 'score-grid' }, ...EXPERT_CRITERIA.map(criterionRow)),
      score
        ? null
        : note('Ocena zapisze się przy pierwszym ruchu dowolnym suwakiem — wtedy utrwala się komplet sześciu kryteriów.'),
      textField({
        point,
        path: 'expert.note',
        label: 'Notatka eksperta',
        textarea: true,
        placeholder: 'np. dobra widoczność od parkingu; zasilanie wymaga przedłużenia z rozdzielni w piwnicy',
        disabled: inert,
      }),
      note('Progi werdyktu: ≥ 7,5 dobra · 5,0–7,4 zadowalająca · < 5,0 niska. Wynik widać też na liście kart.'),
    ],
  });

  /* ================================================================ *
   * Lewa kolumna
   * ================================================================ */

  const toggleAllBtn = h('button', { class: 'btn btn--sm' });
  refreshToggleLabel = () => {
    toggleAllBtn.textContent = currentCollapsed.size > 0 ? 'ROZWIŃ WSZYSTKIE SEKCJE' : 'ZWIŃ WSZYSTKIE SEKCJE';
  };
  refreshToggleLabel();
  toggleAllBtn.addEventListener('click', () => {
    const expandAll = currentCollapsed.size > 0;
    if (expandAll) currentCollapsed.clear();
    else for (const n of ALL_SECTIONS) currentCollapsed.add(n);
    for (const sec of column.querySelectorAll('.card-section')) {
      sec.classList.toggle('is-collapsed', !expandAll);
      const chev = sec.querySelector('.card-section__chev');
      if (chev) chev.textContent = expandAll ? '▾' : '▸';
    }
    refreshToggleLabel();
  });

  const header = h(
    'div',
    { style: { marginBottom: '14px' } },
    h(
      'div',
      { class: 'row row--wrap' },
      h('h2', { text: point.name || 'Punkt bez nazwy' }),
      h('span', { html: pillHtml(status.label, status.variant) }),
      // statusMeta() dla propozycji mówi już „PROPOZYCJA"; przy statusie
      // „ZAAKCEPTOWANY" dopowiadamy, że to wciąż punkt jeszcze niezamontowany.
      isProposed && point.status !== 'proposed'
        ? h('span', { html: pillHtml('PUNKT PROPONOWANY', 'phase3') })
        : null,
      h('span', { class: 'spacer' }),
      toggleAllBtn
    ),
    h('div', {
      class: 'muted',
      style: { fontSize: '12px', marginTop: '2px' },
      text:
        `${point.id} · ${isProposed ? 'specyfikacja wdrożeniowa' : 'specyfikacja'} · ` +
        `${districtName(point.districtId)} · preset ${preset ? preset.id : '—'}`,
    })
  );

  const column = h(
    'div',
    { class: 'card-column' },
    header,
    // Najpierw to, co audytor zastaje w terenie…
    section1,
    section3,
    section4,
    section5,
    section6,
    section7,
    // …a dopiero potem wnioski. Preset i checklista to wynik tych danych,
    // nie parametr wejściowy — klient słusznie zwrócił uwagę, że stały wyżej.
    h('div', {
      class: 'label-caps',
      style: { margin: '18px 0 8px', color: 'var(--ink-2)' },
      text: 'Podsumowanie — co z tych danych wynika',
    }),
    section2,
    section8,
    section9
  );

  column.addEventListener('scroll', () => rememberScroll(column, point.id), { passive: true });

  /* ================================================================ *
   * Panel boczny
   * ================================================================ */

  const scene = {
    boundary: state.boundary,
    districts: state.districtsGeo,
    showDistricts: true,
    // Dzielnica punktu podświetlona — mini-mapa mówi od razu „gdzie to jest".
    highlightDistrictId: point.districtId || null,
    // Bez okręgu strefy — promień jest podany liczbowo pod mapką, a okrąg
    // przy tym kadrze zasłaniał sam punkt.
    coverage: [],
    showCoverage: false,
    targetMinutes: standardMinutes,
    points: [{ id: point.id, lat: point.lat, lon: point.lon, level: status.level, name: point.name }],
  };

  const mapBox = h('div', {
    class: 'map-wrap',
    style: { height: `${MINI_MAP_H}px`, flex: `0 0 ${MINI_MAP_H}px`, border: '1px solid var(--line)' },
    html: renderSceneSvg(scene, {
      width: 480,
      height: MINI_MAP_H,
      showDemand: false,
      showCoverage: false,
      showLabels: false,
    }),
  });
  const mapSvg = mapBox.querySelector('svg');
  if (mapSvg) {
    mapSvg.style.width = '100%';
    mapSvg.style.height = '100%';
    mapSvg.style.display = 'block';
  }

  const moveBtn = h(
    'button',
    {
      class: 'btn btn--sm btn--block',
      onclick: async () => {
        const go = await modal({
          title: 'Przesuwanie punktu',
          body:
            '<p class="note">Współrzędne zmienia się przeciągnięciem pinu na mapie w kroku 2 (Analiza dostępności) — ' +
            'tam KPI przeliczają się na żywo w trakcie przeciągania.</p>' +
            `<p class="note">${
              isProposed
                ? 'Ten punkt jest propozycją, więc jego pin jest przeciągalny.'
                : 'Piny punktów istniejących są zablokowane — ich położenie pochodzi z inwentaryzacji (krok 1).'
            }</p>`,
          confirmLabel: 'Przejdź do kroku 2',
          cancelLabel: 'Zostań w karcie',
        });
        if (go) ctx.navigate('#/analysis');
      },
    },
    'Przesuń punkt'
  );

  const barVariant = comp.pct >= 100 ? 'ok' : comp.pct >= 60 ? 'warn' : 'crit';

  const missingList = [
    ...comp.missingFields.map((path) => FIELD_LABEL[path] || path),
    ...comp.missingPhotos.map((role) => `zdjęcie: ${photoRoleLabel(role)}`),
  ];

  const saveBtn = h(
    'button',
    {
      class: 'btn btn--primary btn--block',
      onclick: async () => {
        const added = persistAutoRecommendations(merged);
        await saveNow();
        toast(
          added
            ? `Zapisano kartę · utrwalono ${fmtNum(added)} poz. z reguł automatycznych.`
            : 'Zapisano kartę punktu.'
        );
      },
    },
    'ZAPISZ'
  );

  const roadmapBtn = h(
    'button',
    {
      class: 'btn btn--block',
      onclick: async () => {
        const items = merged.filter((rec) => !rec.done && !rec.phase);

/**
 * Pasek mapy pod kolumnami: punkty pokolorowane fazą, istniejąca sieć jako

 * zmianie szerokości, żeby SVG nie był rozciągany.

function mapStrip(afterPlan) {
  /** Faza punktu = jego własna faza (propozycje) albo najwcześniejsza faza jego zadań. */
  const phaseByPoint = new Map();
  for (const point of state.points) {
    const own = Number(point.phase);
    if (PHASES.includes(own)) phaseByPoint.set(point.id, own);
  }
  for (const rec of state.recommendations || []) {
    const phase = phaseOf(rec);
    if (!phase || !rec.pointId) continue;
    const current = phaseByPoint.get(rec.pointId);
    if (current === undefined || phase < current) phaseByPoint.set(rec.pointId, phase);
  }

  const pins = [];
  for (const point of state.points) {
    if (point.status === 'rejected') continue;
    const phase = phaseByPoint.get(point.id);
    if (!phase) continue;
    pins.push({
      id: point.id,
      lat: point.lat,
      lon: point.lon,
      level: PHASE_LEVEL[phase],
      name: point.name,
    });
  }

  const scene = {
    boundary: state.boundary,
    districts: state.districtsGeo,
    showDistricts: true,
    coverage: afterPlan.activePoints.map((p) => ({
      lat: p.lat,
      lon: p.lon,
      radiusM: afterPlan.radiusM,
      kind: p.kind === 'proposed' ? 'proposed' : 'existing',
    })),
    showCoverage: true,
    targetMinutes: state.project.standardMinutes,
    points: pins,
  };

  const holder = h('div', {
    class: 'card',
    style: {
      padding: '0',
      height: `${MAP_STRIP_HEIGHT}px`,
      overflow: 'hidden',
      marginTop: '12px',
    },
  });

  const paint = () => {
    const width = Math.max(320, Math.round(holder.clientWidth || 900));
    holder.innerHTML = renderSceneSvg(scene, {
      width,
      height: MAP_STRIP_HEIGHT,
      showDemand: false,
      showCoverage: true,
      showLabels: false,
    });
    const svg = holder.querySelector('svg');
    if (svg) {
      svg.style.width = '100%';
      svg.style.height = '100%';
      svg.style.display = 'block';
    }
  };

  if (typeof ResizeObserver === 'function') {
    resizeObserver = new ResizeObserver(paint);
    resizeObserver.observe(holder);
  }
  paint();

  const legend = h(
    'div',
    { class: 'row row--wrap', style: { marginTop: '8px' } },
    ...PHASES.map((n) =>
      h('span', { html: pillHtml(`${PHASE_META[n].label} — ${PHASE_META[n].title}`, PHASE_VARIANT[n]) })
    ),
    h('span', { class: 'spacer' }),
    h('span', {
      class: 'note',
      text: `${fmtNum(pins.length)} punktów objętych planem · strefy pokrycia = sieć po wdrożeniu.`,
    })
  );

  return h('div', {}, holder, legend);
}

/* ------------------------------------------------------------------ *
 * Sprzątanie
 * ------------------------------------------------------------------ */

function destroy() {
  if (resizeObserver) {
    resizeObserver.disconnect();
    resizeObserver = null;
  }
  if (releasePointer) {
    releasePointer();
    releasePointer = null;
  }
  draggedRecId = null;
}

return { destroy, meta, render };
