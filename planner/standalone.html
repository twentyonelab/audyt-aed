<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinecco · AED Planner — makieta iteracji 2</title>
<style>
/* ==========================================================================
   Sinecco AED Planner — design system (ITERACJA2_SPEC.md §3)

   Rule that governs everything here: the interface is grey. Colour carries
   information about DATA only — point status, phase, gap severity. No
   gradients, no shadows, no radius above 2px.
   ========================================================================== */

:root {
  --ink: #1e1e1e;
  --bar: #3a3a3a;
  --ink-2: #666666;
  --line: #d0d0d0;
  --panel: #f4f4f4;
  --section: #f9f9f9;
  --white: #ffffff;

  /* data colours — never used for chrome */
  --ok: #4caf7d;
  --warn: #e8b33c;
  --crit: #d9534f;
  --phase-1: #4caf7d;
  --phase-2: #e8b33c;
  --phase-3: #8a6fc7;

  --ok-wash: #eaf6f0;
  --warn-wash: #fdf6e6;
  --crit-wash: #fbecec;
  --phase-3-wash: #f1edf9;

  --topbar-h: 56px;
  --subbar-h: 48px;
  --stepper-w: 232px;

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--section);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

.app { display: flex; flex-direction: column; height: 100vh; }
.boot { padding: 40px; color: var(--ink-2); }

/* ---------- typography ---------------------------------------------------- */

.label-caps {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
h4 { font-size: 13px; }
a { color: var(--ink); }

/* ---------- top bar ------------------------------------------------------- */

.topbar {
  height: var(--topbar-h);
  flex: 0 0 var(--topbar-h);
  background: var(--bar);
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 16px;
}
.topbar__brand {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: none;
  border: 0;
  color: inherit;
  padding: 0;
}
.topbar__brand b { font-weight: 700; }
.topbar__mark { width: 18px; height: 18px; display: block; }
.topbar__project { font-size: 12px; color: #cfcfcf; }
.topbar__project strong { color: var(--white); font-weight: 600; }
.topbar__spacer { flex: 1; }
.topbar__actions { display: flex; align-items: center; gap: 10px; }

/* ---------- sub bar ------------------------------------------------------- */

.subbar {
  height: var(--subbar-h);
  flex: 0 0 var(--subbar-h);
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
}
.subbar__title { font-size: 13px; font-weight: 600; }
.subbar__title em { font-style: normal; font-weight: 400; color: var(--ink-2); }
.subbar__meta { font-size: 12px; color: var(--ink-2); }
.subbar__spacer { flex: 1; }
.subbar__controls { display: flex; align-items: center; gap: 8px; }

/* ---------- layout -------------------------------------------------------- */

.layout { flex: 1; display: flex; min-height: 0; }

.stepper {
  width: var(--stepper-w);
  flex: 0 0 var(--stepper-w);
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 12px 8px;
  overflow-y: auto;
}
.stepper__item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 2px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  border-radius: 2px;
}
.stepper__item:hover { background: #eaeaea; }
.stepper__item.is-active { background: var(--bar); color: var(--white); }
.stepper__circle {
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--white);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.stepper__item.is-done .stepper__circle { background: #d8d8d8; color: var(--ink); border-color: #c2c2c2; }
.stepper__item.is-active .stepper__circle { background: var(--white); color: var(--ink); border-color: var(--white); }
.stepper__label { font-size: 12.5px; line-height: 1.25; }
.stepper__label small { display: block; font-size: 11px; color: var(--ink-2); }
.stepper__item.is-active .stepper__label small { color: #c9c9c9; }
.stepper__sep { height: 1px; background: var(--line); margin: 10px 10px; }

.workspace { flex: 1; min-width: 0; display: flex; overflow: hidden; }
.workspace--scroll { display: block; overflow-y: auto; padding: 20px; }

/* ---------- buttons ------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink);
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 500;
  border-radius: 2px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--bar); }
.btn:focus-visible { outline: 2px solid var(--bar); outline-offset: 1px; }
.btn--primary { background: var(--bar); border-color: var(--bar); color: var(--white); }
.btn--primary:hover { background: #2b2b2b; }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { border-color: var(--line); }
.btn--sm { padding: 4px 9px; font-size: 12px; }
.btn--block { width: 100%; justify-content: center; }
.btn--danger { color: var(--crit); }
.btn[disabled], .btn.is-disabled {
  opacity: 0.45;
  cursor: not-allowed;
  border-color: var(--line);
  background: var(--white);
  color: var(--ink-2);
}
.topbar .btn { border-color: #5a5a5a; background: transparent; color: var(--white); }
.topbar .btn:hover { border-color: var(--white); }
.topbar .btn--primary { background: var(--white); color: var(--ink); border-color: var(--white); }

/* ---------- segmented control -------------------------------------------- */

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; background: var(--white); }
.seg__btn {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--ink-2);
  border-right: 1px solid var(--line);
}
.seg__btn:last-child { border-right: 0; }
.seg__btn.is-on { background: var(--bar); color: var(--white); font-weight: 500; }

/* ---------- chips / pills / dots ----------------------------------------- */

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  color: var(--ink-2);
}
.chip.is-on { background: var(--bar); border-color: var(--bar); color: var(--white); }

.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink-2);
  white-space: nowrap;
}
.pill--ok { background: var(--ok-wash); border-color: #b6ded0; color: #1f7a52; }
.pill--warn { background: var(--warn-wash); border-color: #e8d5a2; color: #8a6412; }
.pill--crit { background: var(--crit-wash); border-color: #eec4c3; color: #a5322e; }
.pill--phase1 { background: var(--ok-wash); border-color: #b6ded0; color: #1f7a52; }
.pill--phase2 { background: var(--warn-wash); border-color: #e8d5a2; color: #8a6412; }
.pill--phase3 { background: var(--phase-3-wash); border-color: #cdc0e8; color: #5b4590; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot--ok { background: var(--ok); }
.dot--warn { background: var(--warn); }
.dot--crit { background: var(--crit); }
.dot--proposed { background: var(--phase-3); }

/* ---------- panels -------------------------------------------------------- */

.panel {
  background: var(--white);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel__head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel__head h3 { flex: 1; }
.panel__body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.panel__foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; }
.panel__section { margin-bottom: 22px; }
.panel__section > .label-caps { display: block; margin-bottom: 8px; }

.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 14px 16px;
}

/* ---------- KPI tiles ----------------------------------------------------- */

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi-grid--3 { grid-template-columns: repeat(3, 1fr); }
.kpi {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 10px 12px;
}
.kpi__label { font-size: 11px; color: var(--ink-2); line-height: 1.3; margin-bottom: 6px; min-height: 28px; }
.kpi__value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi__value small { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kpi__delta { font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.kpi__delta.is-up { color: #1f7a52; }
.kpi__delta.is-down { color: #a5322e; }
.kpi__arrow { font-size: 13px; color: var(--ink-2); padding: 0 2px; }

/* ---------- progress bars ------------------------------------------------- */

.bar { height: 6px; background: #e7e7e7; border-radius: 1px; overflow: hidden; }
.bar__fill { height: 100%; background: var(--bar); }
.bar__fill--ok { background: var(--ok); }
.bar__fill--warn { background: var(--warn); }
.bar__fill--crit { background: var(--crit); }
.bar--thin { height: 4px; }

/* ---------- tables -------------------------------------------------------- */

.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--section);
  position: sticky;
  top: 0;
  z-index: 1;
}
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:hover { background: var(--section); }
.table tbody tr.is-selected { background: #eef1f5; }
.table__num { text-align: right; font-variant-numeric: tabular-nums; }
.table__main { font-weight: 500; }
.table__sub { font-size: 11.5px; color: var(--ink-2); }

.list-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.list-row:hover { background: var(--section); }
.list-row__body { flex: 1; min-width: 0; }
.list-row__title { font-weight: 500; font-size: 12.5px; }
.list-row__meta { font-size: 11.5px; color: var(--ink-2); }
.list-row__meta .is-crit { color: var(--crit); font-weight: 600; }

/* ---------- forms --------------------------------------------------------- */

.form { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field__label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.field__hint { font-size: 11.5px; color: var(--ink-2); }
.field__row { display: flex; gap: 8px; align-items: center; }
.input, .select, .textarea {
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 7px 9px;
  background: var(--white);
  width: 100%;
  font-size: 12.5px;
}
.input:focus, .select:focus, .textarea:focus { outline: 0; border-color: var(--bar); border-width: 1px; box-shadow: inset 0 0 0 1px var(--bar); }
.textarea { min-height: 64px; resize: vertical; }
.checkline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.checkline input { accent-color: var(--bar); }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- card sections (spec §6.5) ------------------------------------ */

.card-section {
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-left-color: var(--line);
  background: var(--white);
  border-radius: 2px;
  margin-bottom: 10px;
}
.card-section--warn { border-left-color: var(--warn); }
.card-section--crit { border-left-color: var(--crit); }
.card-section__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.card-section__head h3 { flex: 1; font-size: 13px; }
.card-section__num { font-size: 11px; color: var(--ink-2); font-weight: 600; }
.card-section__body { padding: 14px; display: grid; gap: 12px; }
.card-section__body--cols { grid-template-columns: 1fr 1fr; }

/* ---------- photo slots (spec §7) ---------------------------------------- */

.photo-slots { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-slot {
  width: 106px;
  height: 106px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--section);
  display: grid;
  place-items: center;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  padding: 6px;
}
.photo-slot:hover { border-color: var(--bar); }
.photo-slot.is-required-missing { border-color: var(--warn); border-width: 2px; }
.photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-slot__label { font-size: 10.5px; color: var(--ink-2); line-height: 1.25; z-index: 1; }
.photo-slot__icon { font-size: 16px; display: block; margin-bottom: 3px; }
.photo-slot__badge {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(30, 30, 30, 0.72);
  color: var(--white);
  font-size: 10px;
  padding: 2px 4px;
  z-index: 2;
}
.photo-slot__req { position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--warn); font-weight: 700; z-index: 2; }

/* ---------- map ----------------------------------------------------------- */

.map-wrap { flex: 1; position: relative; min-width: 0; background: #e9e9e6; }
.map-canvas { position: absolute; inset: 0; }
.map-fallback { position: absolute; inset: 0; }
.map-fallback svg { width: 100%; height: 100%; display: block; }
.map-notice {
  position: absolute;
  left: 12px;
  top: 12px;
  z-index: 5;
  background: var(--warn-wash);
  border: 1px solid #e8d5a2;
  color: #7a5a10;
  font-size: 11.5px;
  padding: 6px 10px;
  border-radius: 2px;
  max-width: 340px;
}
.map-legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 5;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 8px 10px;
  font-size: 11.5px;
}
.map-legend__row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.map-legend b { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.map-toolbar { position: absolute; right: 12px; top: 12px; z-index: 5; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.map-hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  z-index: 6; background: var(--bar); color: var(--white);
  font-size: 12px; padding: 6px 12px; border-radius: 2px;
}

.pin {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--white);
  background: var(--ink-2);
  cursor: pointer;
  box-sizing: border-box;
}
.pin--ok { background: var(--ok); }
.pin--warn { background: var(--warn); }
.pin--crit { background: var(--crit); }
.pin--proposed { border-radius: 2px; background: var(--phase-3); }
.pin.is-selected { outline: 2px solid var(--bar); outline-offset: 2px; }
.pin--district-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: #8d8d8d; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
}
.gap-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
  color: #a5322e; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
}

.map-popup { min-width: 210px; font-size: 12.5px; }
.map-popup h4 { font-size: 13px; margin-bottom: 2px; }
.map-popup__meta { color: var(--ink-2); font-size: 11.5px; margin-bottom: 8px; }
.map-popup__flags { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.map-popup__flag { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.mapboxgl-popup-content { border-radius: 2px; padding: 12px; font-family: var(--font); }

/* ---------- dashboard ----------------------------------------------------- */

.dash { max-width: 1180px; margin: 0 auto; }
.dash__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.project-card {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 186px;
}
.project-card__head { display: flex; align-items: flex-start; gap: 8px; }
.project-card__head h3 { flex: 1; }
.project-card__steps { display: flex; gap: 3px; }
.project-card__step { flex: 1; height: 5px; background: #e7e7e7; }
.project-card__step.is-done { background: var(--bar); }
.project-card__kpi { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.project-card__kpi small { font-size: 11.5px; font-weight: 400; color: var(--ink-2); display: block; }
.project-card__foot { margin-top: auto; display: flex; gap: 8px; align-items: center; }
.project-card--new {
  border-style: dashed;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink-2);
}
.project-card--new:hover { border-color: var(--bar); color: var(--ink); }

.dash__section { margin-top: 28px; }
.dash__section > h2 { margin-bottom: 10px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.preset-card { border: 1px solid var(--line); background: var(--white); padding: 10px 12px; border-radius: 2px; }
.preset-card__id { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.preset-card__cost { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }

/* ---------- kanban -------------------------------------------------------- */

.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
.kanban__col { border: 1px solid var(--line); background: var(--white); border-radius: 2px; min-height: 220px; display: flex; flex-direction: column; }
.kanban__stripe { height: 3px; }
.kanban__stripe--1 { background: var(--phase-1); }
.kanban__stripe--2 { background: var(--phase-2); }
.kanban__stripe--3 { background: var(--phase-3); }
.kanban__head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.kanban__head h3 { font-size: 13px; }
.kanban__head .muted { font-size: 11.5px; }
.kanban__body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.kanban__body.is-dropzone { background: #eef1f5; outline: 1px dashed var(--bar); outline-offset: -4px; }
.kanban__card {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 8px 10px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  cursor: grab;
}
.kanban__card.is-dragging { opacity: 0.4; }
.kanban__grip { color: var(--line); font-size: 12px; line-height: 1.1; cursor: grab; user-select: none; }
.kanban__card h4 { font-size: 12.5px; font-weight: 500; }
.kanban__meta { font-size: 11px; color: var(--ink-2); }
.kanban__effect { font-size: 11px; font-weight: 600; color: #1f7a52; }

/* ---------- gantt --------------------------------------------------------- */

.gantt { border: 1px solid var(--line); background: var(--white); border-radius: 2px; overflow-x: auto; }
.gantt__grid { display: grid; grid-template-columns: 430px 1fr; min-width: 900px; }
.gantt__tasks { border-right: 1px solid var(--line); }
.gantt__row { height: 30px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #ececec; font-size: 12px; gap: 8px; }
.gantt__row--head { height: 34px; background: var(--section); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.gantt__row--group { background: var(--section); font-weight: 600; }
.gantt__lane { position: relative; height: 30px; border-bottom: 1px solid #ececec; }
.gantt__quarters { display: flex; height: 34px; background: var(--section); border-bottom: 1px solid var(--line); }
.gantt__quarter { flex: 1; border-right: 1px solid #ececec; font-size: 10.5px; color: var(--ink-2); display: grid; place-items: center; }
.gantt__bar {
  position: absolute; top: 6px; height: 18px;
  border-radius: 2px; cursor: grab;
  display: flex; align-items: center; padding: 0 6px;
  font-size: 10.5px; color: #fff; overflow: hidden; white-space: nowrap;
}
.gantt__bar--1 { background: var(--phase-1); }
.gantt__bar--2 { background: var(--phase-2); color: #4a3a08; }
.gantt__bar--3 { background: var(--phase-3); }
.gantt__handle { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; background: rgba(0,0,0,0.12); }
.gantt__milestones { position: relative; height: 34px; border-bottom: 1px solid var(--line); }
.gantt__milestone { position: absolute; top: 4px; transform: translateX(-50%); text-align: center; font-size: 10px; color: var(--ink-2); }
.gantt__milestone::before { content: '▲'; display: block; color: var(--bar); font-size: 9px; }
.gantt__curve { height: 74px; position: relative; }
.gantt__curve svg { width: 100%; height: 100%; display: block; }

/* ---------- report -------------------------------------------------------- */

.report-layout { display: grid; grid-template-columns: 170px 620px 1fr; gap: 16px; height: 100%; min-height: 0; }
.report-thumbs { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.report-thumb {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 8px;
  font-size: 11.5px;
  cursor: pointer;
  text-align: left;
}
.report-thumb.is-on { border-color: var(--bar); border-width: 2px; }
.report-thumb__no { font-size: 10px; color: var(--ink-2); font-weight: 700; }
.report-preview { overflow-y: auto; background: #e4e4e1; padding: 14px; }
.report-config { overflow-y: auto; }

.report-page {
  background: var(--white);
  border: 1px solid var(--line);
  width: 100%;
  min-height: 820px;
  padding: 34px 38px;
  margin-bottom: 14px;
}
.report-page__head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--bar); padding-bottom: 8px; margin-bottom: 18px; }
.report-page__head b { font-size: 14px; letter-spacing: 0.02em; }
.report-page__head span { font-size: 11px; color: var(--ink-2); margin-left: auto; }
.report-page h2 { font-size: 19px; margin-bottom: 6px; }
.report-page h3 { margin: 16px 0 6px; }
.report-page p { font-size: 12.5px; }
.report-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.report-kpi { border: 1px solid var(--line); padding: 8px; }
.report-kpi__v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.report-kpi__l { font-size: 10px; color: var(--ink-2); line-height: 1.25; }
.report-maps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.report-map { border: 1px solid var(--line); height: 220px; position: relative; background: var(--section); }
.report-map svg { width: 100%; height: 100%; display: block; }
.report-map__cap { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.report-quote { border-left: 3px solid var(--bar); padding: 8px 12px; background: var(--section); font-size: 12.5px; margin: 14px 0; }

/* ---------- field form (mobile, spec §6.8) ------------------------------- */

.field-form { max-width: 420px; margin: 0 auto; padding: 16px; background: var(--white); min-height: 100vh; }
.field-form h2 { margin-bottom: 4px; }
.field-form .form { max-width: none; }

/* ---------- misc ---------------------------------------------------------- */

.empty-state { padding: 26px 16px; text-align: center; color: var(--ink-2); font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; }
.row--wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.note { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }

[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: var(--bar);
  color: var(--white);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 2px;
  white-space: nowrap;
  z-index: 40;
  pointer-events: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: var(--bar);
  color: var(--white);
  font-size: 12.5px;
  padding: 8px 16px;
  border-radius: 2px;
  z-index: 100;
}

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(30,30,30,0.4);
  display: grid; place-items: center; z-index: 60;
}
.modal {
  background: var(--white); border: 1px solid var(--line); border-radius: 2px;
  width: 420px; max-width: calc(100vw - 32px); max-height: 86vh; overflow-y: auto;
}
.modal__head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal__body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal__foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ==========================================================================
   Responsywność

   Widths that used to sit in inline styles live here as classes, so the
   breakpoints below can actually override them. Three steps:
     ≤1200px — chrome tightens, side panels shrink
     ≤900px  — split views stack (map over panel), stepper turns horizontal
     ≤620px  — single-column everything, top bar reduced to essentials
   ========================================================================== */

.panel--side { width: 480px; flex: 0 0 480px; }
.panel--metrics { width: 380px; flex: 0 0 380px; }
.form-col { width: 560px; flex: 0 0 560px; }

@media (max-width: 1400px) {
  .report-layout { grid-template-columns: 150px minmax(420px, 560px) 1fr; }
}

@media (max-width: 1200px) {
  :root { --stepper-w: 176px; }
  .panel--side { width: 400px; flex: 0 0 400px; }
  .panel--metrics { width: 336px; flex: 0 0 336px; }
  .form-col { width: 460px; flex: 0 0 460px; }
  .stepper__label small { display: none; }
  .report-layout { grid-template-columns: minmax(380px, 620px) 1fr; }
  .report-thumbs { display: none; }
  .report-kpis { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 900px) {
  /* Stepper becomes a scrollable strip above the workspace. */
  .layout { flex-direction: column; min-height: 0; }
  .stepper {
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch;
  }
  .stepper__item { width: auto; flex: 0 0 auto; margin: 0; padding: 6px 10px; }
  .stepper__label { white-space: nowrap; font-size: 12px; }
  .stepper__sep { display: none; }

  /* Split views stack: map on top, panel below. */
  .workspace { flex-direction: column; overflow-y: auto; }
  .map-wrap { flex: 0 0 auto; height: 48vh; min-height: 300px; width: 100%; }
  .panel,
  .panel--side,
  .panel--metrics {
    width: 100%;
    flex: 1 1 auto;
    border-left: 0;
    border-top: 1px solid var(--line);
    min-height: 0;
  }
  .panel__body { overflow-y: visible; }
  .form-col { width: 100%; flex: 1 1 auto; }

  .kanban { grid-template-columns: 1fr; }
  .kpi-grid--3 { grid-template-columns: 1fr 1fr; }
  .report-layout { grid-template-columns: 1fr; height: auto; }
  .report-preview { padding: 0; background: transparent; }
  .report-page { padding: 22px; min-height: 0; }
  .report-kpis { grid-template-columns: repeat(2, 1fr); }
  .report-maps { grid-template-columns: 1fr; }
  .card-section__body--cols { grid-template-columns: 1fr; }

  /* Wide tables scroll instead of squeezing the page. */
  .workspace--scroll { overflow-x: auto; }
  .table { min-width: 720px; }
}

@media (max-width: 620px) {
  body { font-size: 12.5px; }
  .topbar { gap: 10px; padding: 0 10px; }
  .topbar__project { display: none; }
  .topbar__brand { font-size: 12.5px; }
  .subbar {
    height: auto;
    flex: 0 0 auto;
    min-height: var(--subbar-h);
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 8px 10px;
  }
  .subbar__spacer { display: none; }
  .subbar__controls { width: 100%; }
  .seg { width: 100%; }
  .seg__btn { flex: 1; text-align: center; }
  .kpi-grid, .kpi-grid--3 { grid-template-columns: 1fr; }
  .dash__grid { grid-template-columns: 1fr; }
  .preset-grid { grid-template-columns: 1fr; }
  .report-kpis { grid-template-columns: 1fr; }
  .map-wrap { height: 42vh; min-height: 240px; }
  .map-legend { display: none; }
  /* Keep the notice clear of the toolbar buttons on the right. */
  .map-notice { max-width: calc(100% - 168px); font-size: 10.5px; padding: 5px 8px; }
  /* District captions collide at this scale and add nothing — the panel lists them. */
  .pin--district-label { display: none; }
  .photo-slot { width: 92px; height: 92px; }
  .workspace--scroll { padding: 12px; }
  .modal { width: calc(100vw - 20px); }
}

/* Coarse pointers get bigger hit targets. */
@media (pointer: coarse) {
  .btn { padding: 9px 14px; }
  .stepper__item { padding: 9px 12px; }
  .pin { width: 24px; height: 24px; }
  .list-row { padding: 12px 4px; }
}

/* ---------- print (spec §6.7) -------------------------------------------- */

@media print {
  @page { size: A4; margin: 14mm; }
  body { background: var(--white); }
  .topbar, .subbar, .stepper, .report-thumbs, .report-config, .no-print { display: none !important; }
  .app, .layout, .workspace { display: block; height: auto; overflow: visible; }
  .report-layout { display: block; }
  .report-preview { background: var(--white); padding: 0; overflow: visible; }
  .report-page { border: 0; margin: 0; padding: 0 0 10mm; min-height: 0; break-after: page; }
  .report-page:last-child { break-after: auto; }
  .report-kpis, .report-maps, .card-section, .kanban__col { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>

__defs['config.js'] = function () {
/**
 * config.js — deployment configuration for the Sinecco AED Planner makieta.
 *
 * Put your own Mapbox public token in MAPBOX_TOKEN. Without it the app still
 * runs: the map falls back to a schematic vector rendering of the same data,
 * and a notice explains what to do.
 */

/**
 * Public Mapbox token, resolved in this order:
 *   1. ?mbtoken=pk... in the page URL   — lets one link carry the token
 *   2. window.MAPBOX_TOKEN               — set by a host page or a deploy step
 *   3. the placeholder below             — falls back to the schematic map
 *
 * Kept out of the repository on purpose. A pk.* token is public by design once
 * embedded in a page; the real protection is a URL restriction in the Mapbox
 * account (Account → Tokens → URL restrictions).
 */
function resolveMapboxToken() {
  try {
    const fromUrl = new URLSearchParams(window.location.search).get('mbtoken');
    if (fromUrl && fromUrl.startsWith('pk.')) return fromUrl;
  } catch {
    /* no URL access — fall through */
  }
  if (typeof window !== 'undefined' && typeof window.MAPBOX_TOKEN === 'string') {
    return window.MAPBOX_TOKEN;
  }
  return 'MAPBOX_TOKEN';
}

const MAPBOX_TOKEN = resolveMapboxToken();

/** Mapbox style. A muted light style keeps the data, not the basemap, in front. */
const MAP_STYLE = 'mapbox://styles/mapbox/light-v11';

/** Fallback view when a project carries no saved camera position. */
const MAP_DEFAULT = { center: [19.0, 50.118], zoom: 11.6 };

/** Which demo project is seeded on first run. */
const DEMO_PROJECT_FILE = 'data/demo-tychy.json';

/** IndexedDB database name and version. */
const DB_NAME = 'sinecco-aed-planner';
const DB_VERSION = 1;

/** Photo pipeline limits (spec §7). */
const PHOTO_MAX_EDGE = 1600;
const PHOTO_THUMB_EDGE = 300;
const PHOTO_QUALITY = 0.8;

/** Reference "today" — fixed so the makieta shows stable overdue states. */
const TODAY = '2026-07-29';

/** Operator shown in the top bar. */
const OPERATOR = 'Operator: K. Bogomaz';

return { DB_NAME, DB_VERSION, DEMO_PROJECT_FILE, MAPBOX_TOKEN, MAP_DEFAULT, MAP_STYLE, OPERATOR, PHOTO_MAX_EDGE, PHOTO_QUALITY, PHOTO_THUMB_EDGE, TODAY };
};

__defs['js/model.js'] = function () {
/**
 * model.js — all analytical computation for the AED planner.
 *
 * Pure functions only: no DOM, no state import, no side effects.
 * This module is imported both by the browser app and by tools/generate-demo.mjs,
 * so demo-data tuning uses exactly the same math the UI shows.
 *
 * Spec reference: ITERACJA2_SPEC.md §5.
 */

/* ------------------------------------------------------------------ *
 * Constants (spec §5)
 * ------------------------------------------------------------------ */

/** Walking speed of a bystander fetching an AED, metres per minute. */
const WALK_SPEED = 100;

/** Straight-line -> street-network correction factor. */
const DETOUR = 1.35;

/** Golden angle, used for deterministic demand-point scatter. */
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

/**
 * Radial density exponent for demand scatter. 0.5 spreads people evenly by
 * area; higher values pull them towards the centre of the built-up area,
 * which is how residential density actually behaves inside an estate.
 */
const DENSITY_FALLOFF = 0.68;

const M_PER_DEG_LAT = 111320;

/* ------------------------------------------------------------------ *
 * Geometry
 * ------------------------------------------------------------------ */

function metresPerDegLon(lat) {
  return M_PER_DEG_LAT * Math.cos((lat * Math.PI) / 180);
}

/** Equirectangular approximation — accurate enough at city scale. */
function distanceM(a, b) {
  const dy = (a.lat - b.lat) * M_PER_DEG_LAT;
  const dx = (a.lon - b.lon) * metresPerDegLon((a.lat + b.lat) / 2);
  return Math.hypot(dx, dy);
}

/** One-way walking time in minutes for a straight-line distance. */
function walkTimeMin(distM) {
  return (distM * DETOUR) / WALK_SPEED;
}

/** Coverage radius for a standard expressed as one-way minutes. */
function coverageRadiusM(standardMinutes) {
  return (standardMinutes * WALK_SPEED) / DETOUR;
}

/** Offset a lat/lon by a metric vector. */
function offsetLatLon(origin, dxM, dyM) {
  return {
    lat: origin.lat + dyM / M_PER_DEG_LAT,
    lon: origin.lon + dxM / metresPerDegLon(origin.lat),
  };
}

/* ------------------------------------------------------------------ *
 * Polygons
 * ------------------------------------------------------------------ */

/** Area-weighted centroid of a GeoJSON linear ring ([lon,lat] pairs). */
function ringCentroid(ring) {
  let area = 0;
  let cx = 0;
  let cy = 0;
  for (let i = 0, n = ring.length - 1; i < n; i++) {
    const [x0, y0] = ring[i];
    const [x1, y1] = ring[i + 1];
    const cross = x0 * y1 - x1 * y0;
    area += cross;
    cx += (x0 + x1) * cross;
    cy += (y0 + y1) * cross;
  }
  if (Math.abs(area) < 1e-12) {
    const [x, y] = ring[0];
    return { lat: y, lon: x };
  }
  area *= 0.5;
  return { lat: cy / (6 * area), lon: cx / (6 * area) };
}

function pointInRing(point, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    const intersects =
      yi > point.lat !== yj > point.lat &&
      point.lon < ((xj - xi) * (point.lat - yi)) / (yj - yi) + xi;
    if (intersects) inside = !inside;
  }
  return inside;
}

/**
 * Distance in metres from `centre` to the ring boundary along `theta`
 * (radians, 0 = east). Works for star-shaped polygons, which is what the
 * district blobs are. Returns 0 when the ray misses (degenerate geometry).
 */
function ringRadiusAtAngle(centre, ring, theta) {
  const kx = metresPerDegLon(centre.lat);
  const dirX = Math.cos(theta);
  const dirY = Math.sin(theta);
  let best = 0;

  for (let i = 0, n = ring.length - 1; i < n; i++) {
    const ax = (ring[i][0] - centre.lon) * kx;
    const ay = (ring[i][1] - centre.lat) * M_PER_DEG_LAT;
    const bx = (ring[i + 1][0] - centre.lon) * kx;
    const by = (ring[i + 1][1] - centre.lat) * M_PER_DEG_LAT;

    const ex = bx - ax;
    const ey = by - ay;
    const denom = dirX * ey - dirY * ex;
    if (Math.abs(denom) < 1e-9) continue;

    const t = (ax * ey - ay * ex) / denom; // distance along ray
    const u = (ax * dirY - ay * dirX) / denom; // position along edge
    if (t > 0 && u >= 0 && u <= 1 && t > best) best = t;
  }
  return best;
}

/* ------------------------------------------------------------------ *
 * Demand points (spec §5)
 * ------------------------------------------------------------------ */

/**
 * Scatter deterministic, population-weighted demand points inside district
 * polygons. Same input always yields the same output.
 *
 * @param {Array} features GeoJSON Features (Polygon) with
 *                properties {id, name, population}
 * @returns {Array<{lat,lon,weight,districtId}>}
 */
function buildDemandPoints(features) {
  const out = [];
  for (const feature of features) {
    const props = feature.properties || {};
    const population = props.population || 0;
    if (population <= 0) continue;

    const ring = feature.geometry.coordinates[0];
    const centre = ringCentroid(ring);
    const count = Math.max(20, Math.round(population / 200));
    const weight = population / count;

    for (let i = 0; i < count; i++) {
      const theta = i * GOLDEN_ANGLE;
      const frac = Math.pow((i + 0.5) / count, DENSITY_FALLOFF); // denser core
      const edge = ringRadiusAtAngle(centre, ring, theta);
      if (edge <= 0) continue;
      const r = frac * edge;
      const p = offsetLatLon(centre, r * Math.cos(theta), r * Math.sin(theta));
      out.push({ lat: p.lat, lon: p.lon, weight, districtId: props.id });
    }
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * Point selection
 * ------------------------------------------------------------------ */

/**
 * Which AED points count towards coverage.
 * @param {Array} points  state.points
 * @param {'now'|'plan'} scenario
 * @param {'day'|'night'} mode
 */
function activePoints(points, scenario = 'now', mode = 'day') {
  return points.filter((p) => {
    if (p.kind === 'existing') {
      if (p.status === 'rejected') return false;
    } else {
      // proposed points only count in the plan scenario, once accepted
      if (scenario !== 'plan') return false;
      if (p.status !== 'accepted') return false;
    }
    if (mode === 'night' && !(p.access && p.access.always === true)) return false;
    return true;
  });
}

/* ------------------------------------------------------------------ *
 * Coverage + KPIs
 * ------------------------------------------------------------------ */

function median(sortedValues, weights) {
  const total = weights.reduce((s, w) => s + w, 0);
  if (!total) return 0;
  let acc = 0;
  for (let i = 0; i < sortedValues.length; i++) {
    acc += weights[i];
    if (acc >= total / 2) return sortedValues[i];
  }
  return sortedValues[sortedValues.length - 1] || 0;
}

/**
 * Full analysis for one scenario/mode combination.
 *
 * @param {object} args
 * @param {Array}  args.demandPoints  from buildDemandPoints()
 * @param {Array}  args.points        state.points
 * @param {Array}  args.districts     [{id, name, population}]
 * @param {number} args.standardMinutes
 * @param {number} args.population    project population (for per-10k)
 * @param {'now'|'plan'} args.scenario
 * @param {'day'|'night'} args.mode
 */
function analyze({
  demandPoints,
  points,
  districts = [],
  standardMinutes = 2,
  population = 0,
  scenario = 'now',
  mode = 'day',
}) {
  const radiusM = coverageRadiusM(standardMinutes);
  const active = activePoints(points, scenario, mode);

  const perDistrict = new Map();
  for (const d of districts) {
    perDistrict.set(d.id, {
      districtId: d.id,
      name: d.name,
      population: d.population || 0,
      totalWeight: 0,
      uncoveredWeight: 0,
      maxMin: 0,
    });
  }

  const status = new Array(demandPoints.length);
  let totalWeight = 0;
  let coveredWeight = 0;
  const times = [];
  const timeWeights = [];

  for (let i = 0; i < demandPoints.length; i++) {
    const dp = demandPoints[i];
    let nearest = Infinity;
    for (const p of active) {
      const d = distanceM(dp, p);
      if (d < nearest) nearest = d;
    }

/** 'ph-' + next free number, matching the ids seeded in state.js. */
function nextPhotoId() {
  const used = state.photos
    .map((p) => p.id)
    .filter((id) => typeof id === 'string' && /^ph-\d+$/.test(id))
    .map((id) => parseInt(id.slice(3), 10))
    .filter((n) => !Number.isNaN(n));

  return `ph-${String(next).padStart(3, '0')}`;

/**
 * Run the whole pipeline for one file and register the result.
 *
 * @param {File|Blob} file
 * @param {{pointId:string, role:string}} target
 * @returns {Promise<object|null>} photoMeta (spec §4) or null when refused
 */
async function attachPhoto(file, { pointId, role } = {}) {
  const point = getPoint(pointId);
  if (!point) {
    toast('Nie znaleziono punktu, do którego miało trafić zdjęcie.');
    return null;
  }
  if (!PHOTO_ROLES.some((r) => r.id === role)) {
    toast('Nieznany slot zdjęcia.');
    return null;
  }
  if (!isImageFile(file)) {
    toast('To nie jest plik graficzny — wybierz JPEG, PNG lub WebP.');
    return null;
  }

  let bitmap = null;
  try {
    // 1. EXIF FIRST — the canvas pass below destroys it irreversibly.
    const exif = await readExifMeta(file);

    // 2. rescale + strip EXIF + straighten
    bitmap = await loadRawBitmap(file);
    const rawW = bitmap.source.width || bitmap.source.naturalWidth || 0;
    const rawH = bitmap.source.height || bitmap.source.naturalHeight || 0;
    if (!rawW || !rawH) throw new Error('Obraz ma zerowe wymiary.');

    const full = drawUpright(bitmap.source, rawW, rawH, PHOTO_MAX_EDGE, exif.orientation);

    // 3. export
    const blob = await exportCanvas(full);

    // 4. thumbnail
    const thumbBlob = await exportCanvas(scaleCanvas(full, PHOTO_THUMB_EDGE));

    // 5. deduplicate within the point
    const hash = await hashBlob(blob);
    const twin = state.photos.find((ph) => ph.pointId === pointId && ph.hash === hash);
    if (twin) {
      toast('To zdjęcie jest już dodane do tego punktu.');
      return twin;
    }

    // 6. persist bytes, then metadata
    const id = nextPhotoId();
    const blobKey = id;
    const thumbKey = `${id}-t`;
    await savePhotoBlob(blobKey, blob);
    await savePhotoBlob(thumbKey, thumbBlob);

    const meta = {
      id,
      pointId,
      role,
      caption: '',
      takenAt: exif.takenAt,
      gps: exif.gps,
      width: full.width,
      height: full.height,
      bytes: blob.size,
      blobKey,
      thumbKey,
      hash,
    };

    state.photos.push(meta);
    if (!Array.isArray(point.photos)) point.photos = [];
    if (!point.photos.includes(id)) point.photos.push(id);

    await save();
    return meta;
  } catch (err) {
    console.warn('attachPhoto() nie powiodło się', err);
    toast('Nie udało się przetworzyć zdjęcia. Spróbuj z innym plikiem.');
    return null;
  } finally {
    if (bitmap && bitmap.release) {
      try {
        bitmap.release();
      } catch (err) {
        /* ignore */
      }
    }
  }
}

/**
 * Drop a photo: blobs from IndexedDB, metadata from state, id from every
 * point that references it.
 */
async function removePhoto(photoId) {
  const meta = state.photos.find((ph) => ph.id === photoId);
  if (!meta) return;

  await deletePhotoBlob(meta.blobKey);
  if (meta.thumbKey && meta.thumbKey !== meta.blobKey) await deletePhotoBlob(meta.thumbKey);

  state.photos = state.photos.filter((ph) => ph.id !== photoId);
  for (const point of state.points) {
    if (Array.isArray(point.photos) && point.photos.includes(photoId)) {
      point.photos = point.photos.filter((id) => id !== photoId);
    }
  }

  await save();

      `<rect x="0.8" y="3.3" width="18.4" height="12" rx="1.5"/>` +

    ? `GPS z EXIF: ${fmtNum(meta.gps.lat, 5)}, ${fmtNum(meta.gps.lon, 5)}`

    if (cancel) cancel.click();

      { class: 'field' },

      })

  );

    title: `Zdjęcie — ${photoRoleLabel(meta.role)}`,
    body,

      title: 'Usunąć zdjęcie?',

 * Synchronous by contract — card.js calls it inside its render pass — while

 * @param {HTMLElement} container

  const byRole = new Map();
  for (const photo of pointPhotos) {
    if (!byRole.has(photo.role)) byRole.set(photo.role, []);
    byRole.get(photo.role).push(photo);
  }

    if (onChange) await onChange();

      return;

    // error) restore the slot so it stays clickable.

      slot.style.opacity = '';

    const photos = byRole.get(role.id) || [];
    const photo = photos[0] || null;
    const isRequired = requiredRoles.has(role.id);
    const missingRequired = isRequired && !photo;

    const slot = h('div', {
      class: `photo-slot${missingRequired ? ' is-required-missing' : ''}`,
      role: 'button',
      tabindex: '0',

        ? `Zdjęcie: ${role.label} — otwórz podgląd`
        : `Dodaj zdjęcie: ${role.label}${isRequired ? ' (wymagane przez preset)' : ''}`,
      'data-tip': photo
        ? `${role.label} — kliknij, aby otworzyć podgląd`
        : `${role.label} — kliknij lub przeciągnij plik${isRequired ? ' · wymagane przez preset' : ''}`,
    });

    if (photo) {
      const img = h('img', { alt: photo.caption || role.label });
      getPhotoUrl(photo.thumbKey || photo.blobKey)
        .then((url) => {
          if (url) img.src = url;
        })
        .catch(() => {});
      const extra = photos.length > 1 ? ` (+${fmtNum(photos.length - 1)})` : '';
      slot.appendChild(img);
      slot.appendChild(
        h('span', {
          class: 'photo-slot__badge',
          text: `${photo.caption || role.label}${extra}`,
        })
      );
    } else {
      for (const child of emptySlotChildren(role.id, isRequired)) slot.appendChild(child);
    }

    const activate = async () => {
      if (photo) {
        await openPhotoModal(photo, { onChange });
        return;
      }
      const file = await pickFile('image/*');
      await upload(slot, role.id, file);
    };

    slot.addEventListener('click', activate);
    slot.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate();
      }
    });

    // drag & drop straight onto the slot
    slot.addEventListener('dragenter', (event) => {
      event.preventDefault();
      highlightSlot(slot, true);
    });
    slot.addEventListener('dragover', (event) => {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
      highlightSlot(slot, true);
    });
    slot.addEventListener('dragleave', () => highlightSlot(slot, false));
    slot.addEventListener('drop', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      highlightSlot(slot, false);
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      if (photo) {
        // dropping onto a taken slot replaces its content
        const fresh = await attachPhoto(file, { pointId: point.id, role: role.id });
        if (fresh && fresh.id !== photo.id) await removePhoto(photo.id);
        if (fresh) await notify();
        return;
      }
      await upload(slot, role.id, file);
    });

    row.appendChild(slot);
  }

  /* Summary line — every number comes from model.js `completeness`. */
  const comp = completeness(point, preset, state.photos);
  const requiredCount = requiredRoles.size;
  const missingLabels = comp.missingPhotos.map(photoRoleLabel);

  const summary = h(
    'div',
    { class: 'note' },
    h('div', {
      text: requiredCount
        ? `Wymagane przez preset ${preset ? preset.id : '—'}: ` +
          `${fmtNum(requiredCount - comp.missingPhotos.length)} z ${fmtNum(requiredCount)} slotów. ` +
          `Wgranych zdjęć przy punkcie: ${fmtNum(pointPhotos.length)}.`
        : `Ten preset nie wymaga zdjęć. Wgranych przy punkcie: ${fmtNum(pointPhotos.length)}.`,
    }),
    missingLabels.length
      ? h('div', { text: `Brakuje: ${missingLabels.join(', ')} — obniża kompletność karty.` })
      : null,
    h('div', {
      text:
        `Po wgraniu: EXIF (GPS, data) trafia do metadanych, plik jest przeskalowany ` +
        `do ${fmtNum(PHOTO_MAX_EDGE)} px i zapisany bez EXIF. Miniatura ${fmtNum(PHOTO_THUMB_EDGE)} px.`,
    })
  );

  mount(container, row, summary);
}

/** Children of an empty slot: camera icon + role label (+ required marker). */
function emptySlotChildren(roleId, isRequired) {
  const label = h(
    'div',
    { class: 'photo-slot__label' },
    cameraIcon(),
    h('span', { text: photoRoleLabel(roleId) })
  );
  const children = [label];
  if (isRequired) children.push(h('span', { class: 'photo-slot__req', text: 'WYM.' }));
  return children;
}

return { attachPhoto, removePhoto, renderPhotoSlots };

/**
 * Liczy wszystko, czego potrzebują sekcje i KPI: trzy przebiegi `analyze()`
 * (dziś / po planie / noc) oraz sumy roadmapy. Wołane raz na budowę raportu.
 */
function buildContext(state, options = {}) {
  const project = state.project || {};
  const standardMinutes = project.standardMinutes || 2;

  const base = {
    demandPoints: state.demandPoints || [],
    points: state.points || [],
    districts: project.districts || [],
    standardMinutes,
    population: project.population || 0,
  };

  const now = analyze({ ...base, scenario: 'now', mode: 'day' });
  const plan = analyze({ ...base, scenario: 'plan', mode: 'day' });
  const night = analyze({ ...base, scenario: 'now', mode: 'night' });
  const totals = roadmapTotals(state.recommendations || []);

  // Wiersze inwentarza — kompletność i status liczone raz, używane w kilku sekcjach.
  const rows = (state.points || []).map((point) => {
    const preset = presetById(state, point.presetId);
    const comp = completeness(point, preset, state.photos || []);
    return {
      point,
      preset,
      completeness: comp,
      level: pointStatusLevel(point, comp.pct),
      status: statusMeta(point, point.kind === 'proposed' ? null : comp.pct),
    };
  });

  const levelOf = (point) => {
    const row = rows.find((r) => r.point.id === point.id);
    return row ? row.level : pointStatusLevel(point, 0);
  };

  return {
    state,
    project,
    standardMinutes,
    radiusM: now.radiusM,
    now,
    plan,
    night,
    totals,
    rows,
    levelOf,
    date: options.date || project.updatedAt || TODAY,
    contact: options.contact || OPERATOR,
  };
}

/* ------------------------------------------------------------------ *
 * KPI raportu (SPEC §6.7 — pięć wskaźników)
 * ------------------------------------------------------------------ */

function deltaPp(value) {
  if (Math.abs(value) < 0.05) return 'bez zmiany';
  return `${value > 0 ? '+' : '−'}${fmtNum(Math.abs(value), 0)} pp`;
}

function direction(value, higherIsBetter = true) {
  if (Math.abs(value) < 0.05) return 'flat';
  return value > 0 === higherIsBetter ? 'up' : 'down';
}

function kpisFrom(ctx) {
  const { state, now, plan, totals, standardMinutes } = ctx;

  const coverageDelta = plan.coveragePct - now.coveragePct;
  const per10kDelta = plan.aedPer10k - now.aedPer10k;

  // analyze() liczy udział 24/7 po punktach istniejących; dla scenariusza
  // „po planie" ten sam udział liczymy po zbiorze aktywnych punktów planu,
  // który analyze() zwraca w activePoints (istniejące + zaakceptowane nowe).
  const always247Now = now.always247Pct;
  const always247Plan = share(plan.activePoints, is247);

  const governanceNowPct = share(now.activePoints, governanceNow);
  const governancePlanPct = share(plan.activePoints, (p) => governancePlan(state, p));

  const gainedPeople = Math.max(0, plan.coveredPeople - now.coveredPeople);
  const perPerson = gainedPeople ? totals.total / gainedPeople : 0;

  return [
    {
      id: 'coverage',
      label: `Pokrycie ≤ ${fmtMin(standardMinutes, 0)} (dojście w jedną stronę)`,
      now: fmtPct(now.coveragePct, 0),
      plan: fmtPct(plan.coveragePct, 0),
      delta: deltaPp(coverageDelta),
      direction: direction(coverageDelta),
      nowValue: now.coveragePct,
      planValue: plan.coveragePct,
    },
    {
      id: 'per10k',
      label: 'AED na 10 tys. mieszkańców',
      now: fmtNum(now.aedPer10k, 1),
      plan: fmtNum(plan.aedPer10k, 1),
      delta:
        Math.abs(per10kDelta) < 0.05
          ? 'bez zmiany'
          : `${per10kDelta > 0 ? '+' : '−'}${fmtNum(Math.abs(per10kDelta), 1)}`,
      direction: direction(per10kDelta),
      nowValue: now.aedPer10k,
      planValue: plan.aedPer10k,
    },
    {
      id: 'always247',
      label: 'Punkty dostępne całodobowo (24/7)',
      now: fmtPct(always247Now, 0),
      plan: fmtPct(always247Plan, 0),
      delta: deltaPp(always247Plan - always247Now),
      direction: direction(always247Plan - always247Now),
      nowValue: always247Now,
      planValue: always247Plan,
    },
    {
      id: 'governance',
      label: 'Punkty z opiekunem i ważnym przeglądem',
      now: fmtPct(governanceNowPct, 0),
      plan: fmtPct(governancePlanPct, 0),
      delta: deltaPp(governancePlanPct - governanceNowPct),
      direction: direction(governancePlanPct - governanceNowPct),
      nowValue: governanceNowPct,
      planValue: governancePlanPct,
    },
    {
      id: 'costPerPerson',
      label: 'Koszt planu na mieszkańca objętego ochroną',
      now: '—',
      // fmtCost zaokrągla do pełnych złotych, co skasowałoby wskaźnik rzędu
      // kilku złotych — dlatego kwota jednostkowa idzie przez fmtNum z groszami.
      plan: gainedPeople ? `${fmtNum(perPerson, 2)} zł` : '—',
      delta: gainedPeople
        ? `${fmtCost(totals.total)} / ${fmtNum(gainedPeople)} ${plural(gainedPeople, ['osoba', 'osoby', 'osób'])}`
        : 'plan nie zwiększa liczby objętych osób',
      direction: 'flat',
      nowValue: 0,
      planValue: perPerson,
    },
  ];
}

/**
 * Pięć KPI raportu (SPEC §6.7), każdy w formacie
 * `{label, now, plan, delta}` (+ `id`, `direction`, wartości surowe).
 */
function reportKpis(state) {
  return kpisFrom(buildContext(state));
}

/* ------------------------------------------------------------------ *
 * Mapy „jest / będzie" — statyczny SVG z map.js
 * ------------------------------------------------------------------ */

function sceneFor(ctx, analysis) {
  return {
    boundary: ctx.state.boundary,
    districts: ctx.state.districtsGeo,
    showDistricts: true,
    coverage: analysis.activePoints.map((p) => ({
      lat: p.lat,
      lon: p.lon,
      radiusM: analysis.radiusM,
      kind: p.kind === 'proposed' ? 'proposed' : 'existing',
    })),
    showCoverage: true,
    demand: analysis.demandStatus,
    showDemand: true,
    targetMinutes: ctx.standardMinutes,
    points: analysis.activePoints.map((p) => ({
      id: p.id,
      lat: p.lat,
      lon: p.lon,
      name: p.name,
      level: ctx.levelOf(p),
    })),
    labels: [],
  };
}

function mapHtml(ctx, analysis, caption) {
  const svg = renderSceneSvg(sceneFor(ctx, analysis), {
    width: MAP_W,
    height: MAP_H,
    showDemand: true,
    showCoverage: true,
    showDistricts: true,
    pad: 8,
  });
  // Podpis po SVG, żeby leżał na nim (`.report-map__cap` jest pozycjonowany absolutnie).
  return `<div class="report-map">${svg}<span class="report-map__cap">${esc(caption)}</span></div>`;
}

function kpiStripHtml(kpis) {
  const cells = kpis
    .map(
      (k) => `<div class="report-kpi">
        <div class="report-kpi__v">${esc(k.now)}<span class="kpi__arrow"> → </span>${esc(k.plan)}</div>
        <div class="report-kpi__l">${esc(k.label)}</div>
        <div class="kpi__delta${k.direction === 'up' ? ' is-up' : k.direction === 'down' ? ' is-down' : ''}">${esc(
          k.delta
        )}</div>
      </div>`
    )
    .join('');
  return `<div class="report-kpis">${cells}</div>`;
}

 * Sekcje

    <div class="divider"></div>
    ${factsHtml([
      ['Gmina', esc(project.name || '—')],
      ['Liczba mieszkańców', `${fmtNum(project.population || 0)}`],
      ['Jednostki pomocnicze (dzielnice)', fmtNum(districts)],
      ['Punkty AED w inwentarzu', fmtNum(existing)],
      ['Punkty planowane', fmtNum(proposed)],
      ['Standard czasu dojścia', `${fmtMin(standardMinutes, 0)} w jedną stronę`],
      ['Promień strefy pokrycia', `${fmtNum(now.radiusM)} m`],
      ['Pokrycie w stanie obecnym', fmtPct(now.coveragePct, 0)],

}

function sectionSummary(ctx, kpis) {
  const { now, plan, totals, standardMinutes } = ctx;
  const gained = Math.max(0, plan.coveredPeople - now.coveredPeople);
  const newPoints = ctx.rows.filter((r) => r.point.kind === 'proposed').length;
  const tasks = (ctx.state.recommendations || []).filter((r) => r.phase).length;

  return `
    <h2>Podsumowanie dla decydenta — na jednej kartce</h2>
    <p>
      Sieć AED w gminie ${esc(ctx.project.name || '—')} obejmuje dziś
      <strong>${fmtPct(now.coveragePct, 0)}</strong> mieszkańców w standardzie
      dojścia <strong>${fmtMin(standardMinutes, 0)}</strong> w jedną stronę.
      Po wykonaniu planu będzie to <strong>${fmtPct(plan.coveragePct, 0)}</strong>, czyli
      <strong>${fmtNum(gained)}</strong> ${plural(gained, ['osoba', 'osoby', 'osób'])} więcej
      w zasięgu defibrylatora. Mediana czasu dojścia spada z
      <strong>${fmtMin(now.medianMin)}</strong> do <strong>${fmtMin(plan.medianMin)}</strong>.
    </p>
    ${kpiStripHtml(kpis)}
    <div class="report-maps">
      ${mapHtml(ctx, now, 'Jest — stan obecny')}
      ${mapHtml(ctx, plan, 'Będzie — po planie')}
    </div>
    <p class="note">
      Zielone punkty to mieszkańcy w zasięgu, czerwone — poza zasięgiem.
      Okręgi to strefy pokrycia (fioletowe: punkty planowane).
    </p>
    <div class="report-quote">„${esc(CONTEXT_SENTENCE)}”</div>
    <p>
      Plan to <strong>${fmtNum(tasks)}</strong> ${plural(tasks, ['zadanie', 'zadania', 'zadań'])}
      w trzech fazach i <strong>${fmtNum(newPoints)}</strong>
      ${plural(newPoints, ['nowy punkt', 'nowe punkty', 'nowych punktów'])};
      łączny koszt <strong>${fmtCost(totals.total)}</strong>
      (faza 1: ${fmtCost(totals.phases[1].cost)} · faza 2: ${fmtCost(totals.phases[2].cost)} ·
      faza 3: ${fmtCost(totals.phases[3].cost)}).
    </p>`;
}

function sectionCurrent(ctx) {
  const { now, night, rows } = ctx;
  const byLevel = (level) => rows.filter((r) => r.point.kind === 'existing' && r.level === level).length;
  const existing = rows.filter((r) => r.point.kind === 'existing');

  const inventoryRows = [
    ['ok', 'Zweryfikowane, karta kompletna'],
    ['warn', 'Zweryfikowane, karta z brakami'],
    ['crit', 'Niezweryfikowane — wymagają wizyty'],
  ].map(([level, label]) => {
    const count = byLevel(level);
    return [
      `${dotHtml(level)} ${esc(label)}`,
      fmtNum(count),
      fmtPct(existing.length ? (100 * count) / existing.length : 0, 0),
    ];
  });
  inventoryRows.push([
    `${dotHtml('proposed')} Punkty planowane (zaakceptowane propozycje)`,
    fmtNum(rows.filter((r) => r.point.kind === 'proposed').length),
    '—',
  ]);

  const avgCompleteness = existing.length
    ? existing.reduce((sum, r) => sum + (r.completeness.required ? r.completeness.pct : 0), 0) / existing.length
    : 0;

  return `
    <h2>Stan obecny</h2>
    <p>
      Inwentarz obejmuje <strong>${fmtNum(existing.length)}</strong>
      ${plural(existing.length, ['punkt', 'punkty', 'punktów'])} istniejących.
      W scenariuszu dziennym w obliczeniach pokrycia bierze udział
      <strong>${fmtNum(now.activeCount)}</strong> z nich; w scenariuszu nocnym tylko
      <strong>${fmtNum(night.activeCount)}</strong> (dostępne całodobowo).
    </p>

    <h3>Struktura inwentarza</h3>
    ${tableHtml(['Kategoria', 'Liczba', 'Udział'], inventoryRows, ['', 'r', 'r'])}

    <h3>Wskaźniki wyjściowe</h3>
    ${factsHtml([
      [`Pokrycie ≤ ${fmtMin(ctx.standardMinutes, 0)} — dzień`, fmtPct(now.coveragePct, 0)],
      [`Pokrycie ≤ ${fmtMin(ctx.standardMinutes, 0)} — noc (tylko 24/7)`, fmtPct(night.coveragePct, 0)],
      ['Mediana czasu dojścia', fmtMin(now.medianMin)],
      ['Średni czas dojścia (ważony ludnością)', fmtMin(now.meanMin)],
      ['Mieszkańcy w zasięgu', `${fmtNum(now.coveredPeople)} z ${fmtNum(now.totalPeople)}`],
      ['AED na 10 tys. mieszkańców', fmtNum(now.aedPer10k, 1)],
      ['Punkty dostępne 24/7', fmtPct(now.always247Pct, 0)],
      ['Średnia kompletność kart', fmtPct(avgCompleteness, 0)],
    ])}
    <p class="note">
      Pokrycie nocne liczone jest wyłącznie po punktach z całodobowym dostępem —
      to najczęstsza przyczyna różnicy między deklarowaną a realną dostępnością sieci.
    </p>`;
}

function sectionAnalysis(ctx) {
  const { now, plan } = ctx;
  const demandCount = (ctx.state.demandPoints || []).length;
  /** Dzielnica „w głębokiej luce" = ponad połowa mieszkańców poza zasięgiem. */
  const deepGaps = (analysis) => analysis.gaps.filter((g) => g.uncoveredPct > 50).length;

  const gapRows = now.gaps.map((g) => [
    esc(g.name),
    fmtNum(g.uncoveredPeople),
    `${fmtPct(g.uncoveredPct, 0)}<div style="width:120px;margin-top:4px">${barHtml(
      g.uncoveredPct,
      g.uncoveredPct >= 50 ? 'crit' : 'warn'
    )}</div>`,
    fmtMin(g.maxMin),
  ]);

  const proposedRows = ctx.rows
    .filter((r) => r.point.kind === 'proposed')
    .map((r) => [
      esc(r.point.name),
      `${esc(r.point.presetId || '—')}${r.preset ? ` <span class="muted">${esc(r.preset.name)}</span>` : ''}`,
      esc(districtNameOf(ctx.state, r.point.districtId)),
      Number.isFinite(r.point.gainPct) ? `+${fmtPct(r.point.gainPct, 1)}` : '—',
      r.preset ? fmtCost(r.preset.cost) : '—',
    ]);

  const totalGain = ctx.rows
    .filter((r) => r.point.kind === 'proposed')
    .reduce((sum, r) => sum + (r.point.gainWeight || 0), 0);

  return `
    <h2>Analiza dostępności</h2>
    <p>
      Model rozkłada mieszkańców na <strong>${fmtNum(demandCount)}</strong>
      ${plural(demandCount, ['punkt popytu', 'punkty popytu', 'punktów popytu'])}
      i dla każdego liczy czas dojścia do najbliższego AED.
      Punkt jest pokryty, gdy mieści się w promieniu <strong>${fmtNum(ctx.radiusM)} m</strong>
      (${fmtMin(ctx.standardMinutes, 0)} w jedną stronę).
    </p>

    <h3>Luki wg dzielnic — stan obecny</h3>
    ${tableHtml(
      ['Dzielnica', 'Osoby poza zasięgiem', 'Udział poza zasięgiem', 'Maks. czas dojścia'],
      gapRows,
      ['', 'r', 'r', 'r']
    )}

    <h3>Punkty planowane (wybór optymalizatora)</h3>
    ${tableHtml(
      ['Lokalizacja', 'Preset', 'Dzielnica', 'Przyrost pokrycia', 'Koszt jednostkowy'],
      proposedRows,
      ['', '', '', 'r', 'r']
    )}
    <p class="note">
      Dobór lokalizacji: algorytm zachłanny maksymalnego pokrycia — w każdej turze
      wybierany jest kandydat domykający najwięcej niepokrytej ludności.
      Łączny przyrost: <strong>${fmtNum(totalGain)}</strong>
      ${plural(totalGain, ['osoba', 'osoby', 'osób'])} w zasięgu.
    </p>

    <h3>Porównanie scenariuszy</h3>
    ${tableHtml(
      ['Wskaźnik', 'Stan obecny', 'Po planie'],
      [
        ['Pokrycie', fmtPct(now.coveragePct, 0), fmtPct(plan.coveragePct, 0)],
        ['Mediana dojścia', fmtMin(now.medianMin), fmtMin(plan.medianMin)],
        ['Średni czas dojścia', fmtMin(now.meanMin), fmtMin(plan.meanMin)],
        ['Punkty czynne', fmtNum(now.activeCount), fmtNum(plan.activeCount)],
        ['AED / 10 tys.', fmtNum(now.aedPer10k, 1), fmtNum(plan.aedPer10k, 1)],
        ['Dzielnice z luką', fmtNum(now.gaps.length), fmtNum(plan.gaps.length)],
        [
          'Dzielnice z ponad połową mieszkańców poza zasięgiem',
          fmtNum(deepGaps(now)),
          fmtNum(deepGaps(plan)),
        ],
      ].map(([label, a, b]) => [esc(label), a, b]),
      ['', 'r', 'r']
    )}`;
}

function sectionRecommendations(ctx) {
  const recs = ctx.state.recommendations || [];
  const pointName = (id) => {
    const row = ctx.rows.find((r) => r.point.id === id);
    return row ? row.point.name : '—';
  };

  const order = { high: 0, medium: 1, low: 2 };
  const sorted = [...recs].sort(
    (a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3) || (a.phase || 9) - (b.phase || 9)
  );

  const rows = sorted.map((r) => [
    esc(r.text),
    r.pointId ? `${esc(r.pointId)} <span class="muted">${esc(pointName(r.pointId))}</span>` : '<span class="muted">zadanie ogólne</span>',
    pillHtml(PRIORITY_LABEL[r.priority] || r.priority || '—', PRIORITY_VARIANT[r.priority] || ''),
    esc(OWNER_LABEL[r.owner] || r.owner || '—'),
    r.phase ? pillHtml(PHASE_META[r.phase].label, `phase${r.phase}`) : '<span class="muted">nieprzypisane</span>',
    fmtCost(r.cost || 0),
  ]);

  const byPriority = ['high', 'medium', 'low'].map((p) => {
    const list = recs.filter((r) => r.priority === p);
    return [
      pillHtml(PRIORITY_LABEL[p], PRIORITY_VARIANT[p]),
      fmtNum(list.length),
      fmtCost(list.reduce((s, r) => s + (r.cost || 0), 0)),
    ];
  });

  const done = recs.filter((r) => r.done).length;

  return `
    <h2>Rekomendacje</h2>
    <p>
      Lista powstaje automatycznie z reguł audytu (SPEC §5) po każdym zapisie karty
      punktu i jest uzupełniana ręcznie przez operatora. Łącznie
      <strong>${fmtNum(recs.length)}</strong> ${plural(recs.length, ['pozycja', 'pozycje', 'pozycji'])},
      z czego wykonanych: <strong>${fmtNum(done)}</strong>.
    </p>

    <h3>Zestawienie wg priorytetu</h3>
    ${tableHtml(['Priorytet', 'Pozycji', 'Koszt'], byPriority, ['', 'r', 'r'])}

    <h3>Pełna lista</h3>
    ${tableHtml(
      ['Zalecenie', 'Punkt', 'Priorytet', 'Odpowiedzialny', 'Faza', 'Koszt'],
      rows,
      ['', '', '', '', '', 'r']
    )}
    <p class="note">Koszt łączny pozycji przypisanych do faz: <strong>${fmtCost(ctx.totals.total)}</strong>.</p>`;
}

function sectionRoadmap(ctx) {
  const { totals } = ctx;
  const pointName = (id) => {
    const row = ctx.rows.find((r) => r.point.id === id);
    return row ? row.point.name : null;
  };

  const phaseBlocks = [1, 2, 3]
    .map((phase) => {
      const meta = PHASE_META[phase];
      const bucket = totals.phases[phase];
      const rows = bucket.items.map((r) => [
        esc(r.text),
        r.pointId ? esc(pointName(r.pointId) || r.pointId) : '<span class="muted">zadanie ogólne</span>',
        esc(OWNER_LABEL[r.owner] || r.owner || '—'),
        Number.isFinite(r.startMonth) ? `${fmtNum(r.startMonth)}–${fmtNum(r.startMonth + (r.lengthMonths || 1) - 1)}` : '—',
        fmtCost(r.cost || 0),
      ]);
      return `
        <h3>${esc(meta.label)} — ${esc(meta.title)}
          <span class="muted">· ${esc(meta.months)} · ${fmtCost(bucket.cost)} ·
          ${fmtNum(bucket.items.length)} ${plural(bucket.items.length, ['pozycja', 'pozycje', 'pozycji'])}</span>
        </h3>
        ${tableHtml(['Zadanie', 'Punkt', 'Odpowiedzialny', 'Miesiące', 'Koszt'], rows, ['', '', '', 'r', 'r'])}`;
    })
    .join('');

  const unassigned = (ctx.state.recommendations || []).filter((r) => !r.phase).length;

  return `
    <h2>Roadmapa wdrożenia</h2>
    <p>
      Plan podzielony na trzy fazy. Faza 1 domyka zgodność na istniejącej sieci
      (opiekunowie, rejestracja u dyspozytora, przeglądy, oznakowanie) i jest
      najtańsza; fazy 2 i 3 dogęszczają sieć nowymi punktami.
    </p>
    ${tableHtml(
      ['Faza', 'Zakres', 'Okres', 'Pozycji', 'Koszt'],
      [1, 2, 3].map((phase) => [
        pillHtml(PHASE_META[phase].label, `phase${phase}`),
        esc(PHASE_META[phase].title),
        esc(PHASE_META[phase].months),
        fmtNum(totals.phases[phase].items.length),
        fmtCost(totals.phases[phase].cost),
      ]),
      ['', '', '', 'r', 'r']
    )}
    <p><strong>Razem: ${fmtCost(totals.total)}</strong>${
      unassigned ? ` <span class="muted">· poza harmonogramem: ${fmtNum(unassigned)}</span>` : ''
    }</p>
    ${phaseBlocks}
    <p class="note">
      Terminy wyznaczają zadania proceduralne (zamówienie sprzętu, dokumentacja
      i uzgodnienia, przetarg), a nie sam montaż — dlatego są ujęte w harmonogramie
      jako osobne pozycje.
    </p>`;
}

function sectionMethod(ctx) {
  const demand = (ctx.state.demandPoints || []).length;

      ? `${fmtPct(c.pct, 0)}<div style="width:90px;margin-top:4px">${barHtml(

      : '<span class="muted">brak presetu</span>';
    const recCount = (ctx.state.recommendations || []).filter((x) => x.pointId === r.point.id).length;

    return [
      `${dotHtml(r.level)} ${esc(r.point.id)} <span class="muted">${esc(KIND_LABEL[r.point.kind] || r.point.kind)}</span>`,

      esc(districtNameOf(ctx.state, r.point.districtId)),
      esc(r.point.presetId || '—'),
      pctCell,
      fmtNum(recCount),

  return `
    <h2>Karty punktów — załącznik</h2>
    <p class="note">
      Zestawienie skrócone. Pełne karty (dostępność, opiekun, oznakowanie,
      urządzenie, rejestracja u dyspozytora, dokumentacja fotograficzna) są

      rows,

const BUILDERS = {
  cover: (ctx) => sectionCover(ctx),
  summary: (ctx, kpis) => sectionSummary(ctx, kpis),
  current: (ctx) => sectionCurrent(ctx),
  analysis: (ctx) => sectionAnalysis(ctx),
  recommendations: (ctx) => sectionRecommendations(ctx),
  roadmap: (ctx) => sectionRoadmap(ctx),
  method: (ctx) => sectionMethod(ctx),
  cards: (ctx) => sectionCards(ctx),
};

/* ------------------------------------------------------------------ *
 * API
 * ------------------------------------------------------------------ */

/** Które sekcje są włączone: `state.ui.reportSections === null` znaczy wszystkie. */
function enabledSectionIds(state) {
  const chosen = state.ui && state.ui.reportSections;
  if (!Array.isArray(chosen)) return REPORT_SECTIONS.map((s) => s.id);
  return REPORT_SECTIONS.map((s) => s.id).filter((id) => chosen.includes(id));
}

function isSectionOn(state, id) {
  return enabledSectionIds(state).includes(id);
}

/**
 * Buduje treść raportu.
 *
 * @param {object} state pełny obiekt stanu aplikacji
 * @param {object} [options] `{date, contact}` — metryka dokumentu z panelu konfiguracji
 * @returns {{sections: Array<{id,title,html}>, kpis: Array}}
 */
function buildReport(state, options = {}) {
  const ctx = buildContext(state, options);
  const kpis = kpisFrom(ctx);
  const enabled = enabledSectionIds(state);

  const sections = REPORT_SECTIONS.filter((s) => enabled.includes(s.id)).map((s) => ({
    id: s.id,
    title: s.title,
    html: BUILDERS[s.id](ctx, kpis),
  }));

  return { sections, kpis };
}

return { CONTEXT_SENTENCE, REPORT_SECTIONS, buildReport, enabledSectionIds, isSectionOn, reportKpis };
};

__defs['js/router.js'] = function () {
/**
 * router.js — hash routing plus the application shell (top bar, sub bar,
 * stepper). Views are plain modules that export `meta` and `render`.
 *
 * Spec reference: ITERACJA2_SPEC.md §3 (shell), §6 (routes).
 */

const { h, mount, clear, toast } = __req('js/ui.js');
const { state } = __req('js/state.js');
const { OPERATOR } = __req('config.js');
/** The five audit steps plus setup (spec §3). */
const STEPS = [
  { step: 0, route: '#/setup', name: 'Setup projektu', short: 'dane wejściowe' },
  { step: 1, route: '#/inventory', name: 'Inwentaryzacja', short: 'jak jest' },
  { step: 2, route: '#/analysis', name: 'Analiza dostępności', short: 'gdzie są luki' },
  { step: 3, route: '#/cards', name: 'Karty punktów', short: 'co zrobić' },
  { step: 4, route: '#/roadmap', name: 'Roadmapa', short: 'kiedy i za ile' },
  { step: 5, route: '#/report', name: 'Raport', short: 'dla decydenta' },
];

const routes = [];
let current = null;

function registerRoute(pattern, loader) {
  const keys = [];
  const regex = new RegExp(
    `^${pattern
      .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      .replace(/:(\w+)/g, (_, key) => {
        keys.push(key);
        return '([^/]+)';
      })}$`
  );
  routes.push({ pattern, regex, keys, loader });
}

function match(hash) {
  for (const route of routes) {
    const m = route.regex.exec(hash);
    if (m) {
      const params = Object.fromEntries(route.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])]));
      return { route, params };
    }
  }
  return null;
}

function navigate(hash) {
  if (window.location.hash === hash) render();
  else window.location.hash = hash;
}

/* ------------------------------------------------------------------ *
 * Shell
 * ------------------------------------------------------------------ */

function topbar() {
  const project = state.project;
  return h(
    'header',
    { class: 'topbar' },
    h(
      'button',
      { class: 'topbar__brand', onclick: () => navigate('#/'), title: 'Wróć do pulpitu' },
      h('span', {
        class: 'topbar__mark',
        html: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 2 5 14h6l-1 8 9-12h-6z" fill="#4CAF7D"/></svg>',
      }),
      h('span', { html: '<b>SINECCO</b> · AED Planner' })
    ),
    project
      ? h('span', {
          class: 'topbar__project',
          html: `Projekt: <strong>${project.label || project.name}</strong>`,
        })
      : null,
    h('span', { class: 'topbar__spacer' }),
    h('span', { class: 'topbar__project', text: OPERATOR }),
    h(
      'div',
      { class: 'topbar__actions' },
      h(
        'button',
        {
          class: 'btn btn--sm btn--primary',
          onclick: () => navigate('#/report'),
          title: 'Przejdź do raportu i wygeneruj PDF',
        },
        'PDF'
      )
    )
  );
}

function stepper(activeStep) {
  const done = new Set(state.project?.stepsDone || []);
  return h(
    'nav',
    { class: 'stepper', 'aria-label': 'Kroki audytu' },
    ...STEPS.map((s) =>
      h(
        'button',
        {
          class: `stepper__item${s.step === activeStep ? ' is-active' : ''}${
            done.has(s.step) && s.step !== activeStep ? ' is-done' : ''
          }`,
          onclick: () => navigate(s.route),
        },
        h('span', { class: 'stepper__circle', text: done.has(s.step) && s.step !== activeStep ? '✓' : String(s.step) }),
        h('span', { class: 'stepper__label', html: `${s.name}<small>${s.short}</small>` })
      )
    ),
    h('div', { class: 'stepper__sep' }),
    h(
      'button',
      { class: 'stepper__item', onclick: () => navigate('#/') },
      h('span', { class: 'stepper__circle', text: '⌂' }),
      h('span', { class: 'stepper__label', html: 'Pulpit<small>wszystkie projekty</small>' })
    )
  );
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */

async function render() {
  const root = document.getElementById('app');
  const hash = window.location.hash || '#/';
  const found = match(hash);

  if (!found) {
    navigate('#/');
    return;
  }

  if (current && typeof current.destroy === 'function') {
    try {
      current.destroy();
    } catch (err) {
      console.warn('destroy() failed', err);
    }
  }

  let view;
  try {
    view = await found.route.loader();
  } catch (err) {
    console.error(err);
    mount(root, h('div', { class: 'boot', text: `Nie udało się wczytać widoku: ${err.message}` }));
    return;
  }
  current = view;

  const meta = view.meta || {};

  // Chrome-less views (dashboard, field form) render straight into the root.
  if (meta.chrome === 'none') {
    clear(root);
    const holder = h('div', { class: meta.layout === 'scroll' ? 'workspace workspace--scroll' : 'workspace' });
    root.appendChild(topbarIf(meta));
    root.appendChild(holder);
    await view.render(holder, { params: found.params, navigate, subbar: null });
    return;
  }

  const subbarMeta = h('span', { class: 'subbar__meta' });
  const subbarControls = h('div', { class: 'subbar__controls' });
  const workspace = h('div', {
    class: meta.layout === 'scroll' ? 'workspace workspace--scroll' : 'workspace',
  });

  const stepLabel = meta.step !== undefined && meta.step !== null ? `Krok ${meta.step} z 5 · ` : '';
  const subbar = h(
    'div',
    { class: 'subbar' },
    h('span', {
      class: 'subbar__title',
      html: `${stepLabel}${meta.title || ''}${meta.subtitle ? ` <em>— „${meta.subtitle}”</em>` : ''}`,
    }),
    subbarMeta,
    h('span', { class: 'subbar__spacer' }),
    subbarControls
  );

  clear(root);
  root.appendChild(topbar());
  root.appendChild(subbar);
  root.appendChild(
    h('div', { class: 'layout' }, meta.hideStepper ? null : stepper(meta.step), workspace)
  );

  try {
    await view.render(workspace, {
      params: found.params,
      navigate,
      subbar: { meta: subbarMeta, controls: subbarControls },
      setMeta: (html) => {
        subbarMeta.innerHTML = html;
      },
    });
  } catch (err) {
    console.error(err);
    mount(workspace, h('div', { class: 'boot', text: `Błąd widoku: ${err.message}` }));
    toast('Widok nie wczytał się poprawnie — szczegóły w konsoli.');
  }
}

function topbarIf(meta) {
  return meta.showTopbar === false ? h('div') : topbar();
}

function initRouter() {
  window.addEventListener('hashchange', render);
  return render();
}

function currentHash() {
  return window.location.hash || '#/';
}

return { STEPS, currentHash, initRouter, navigate, registerRoute, render };
};

__defs['js/views/dashboard.js'] = function () {
/**
 * views/dashboard.js — pulpit projektów (SPEC §6.0, trasa '#/').
 *
 * Bez steppera: top bar i sub bar rysuje router, widok wypełnia tylko

const { h, el, mount, pillHtml, toast, modal, disabledControl, download } = __req('js/ui.js');

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */

/** Kroki 0–5 z SPEC §3 — sześć segmentów paska postępu. */
const STEP_COUNT = 6;

const STATUS_META = {
  w_toku: { label: 'W TOKU', variant: 'warn' },
  oferta: { label: 'OFERTA', variant: '' },
  zakonczony: { label: 'ZAKOŃCZONY', variant: 'ok' },
};

const REASON_OUT_OF_SCOPE = 'poza zakresem iteracji 2';

/** Polska odmiana liczebnika: [1, 2–4, 5+]. */
function plural(n, forms) {
  const abs = Math.abs(n);
  const last = abs % 10;
  const lastTwo = abs % 100;
  if (abs === 1) return forms[0];
  if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return forms[1];
  return forms[2];
}

/** Rozmiar pliku — liczby przez fmtNum, żeby separatory były jednolite. */
function fmtBytes(bytes) {
  if (bytes < 1024) return `${fmtNum(bytes)} B`;
  if (bytes < 1024 * 1024) return `${fmtNum(bytes / 1024, 1)} kB`;
  return `${fmtNum(bytes / (1024 * 1024), 2)} MB`;
}

function statusOf(project) {
  return STATUS_META[project.status] || { label: String(project.status || '—').toUpperCase(), variant: '' };
}

/** Analiza stanu obecnego dla aktywnego projektu (SPEC §5). */
