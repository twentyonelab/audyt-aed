<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinecco · AED Planner — makieta iteracji 2</title>
<style>
/* ==========================================================================
   Sinecco AED Planner — design system (ITERACJA2_SPEC.md §3)

   Rule that governs everything here: the interface is grey. Colour carries
   information about DATA only — point status, phase, gap severity. No
   gradients, no shadows, no radius above 2px.
   ========================================================================== */

:root {
  --ink: #1e1e1e;
  --bar: #3a3a3a;
  --ink-2: #666666;
  --line: #d0d0d0;
  --panel: #f4f4f4;
  --section: #f9f9f9;
  --white: #ffffff;

  /* data colours — never used for chrome */
  --ok: #4caf7d;
  --warn: #e8b33c;
  --crit: #d9534f;
  --phase-1: #4caf7d;
  --phase-2: #e8b33c;
  --phase-3: #8a6fc7;

  --ok-wash: #eaf6f0;
  --warn-wash: #fdf6e6;
  --crit-wash: #fbecec;
  --phase-3-wash: #f1edf9;

  --topbar-h: 56px;
  --subbar-h: 48px;
  --stepper-w: 232px;

  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--section);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

.app { display: flex; flex-direction: column; height: 100vh; }
.boot { padding: 40px; color: var(--ink-2); }

/* ---------- typography ---------------------------------------------------- */

.label-caps {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
h4 { font-size: 13px; }
a { color: var(--ink); }

/* ---------- top bar ------------------------------------------------------- */

.topbar {
  height: var(--topbar-h);
  flex: 0 0 var(--topbar-h);
  background: var(--bar);
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 16px;
}
.topbar__brand {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  background: none;
  border: 0;
  color: inherit;
  padding: 0;
}
.topbar__brand b { font-weight: 700; }
.topbar__mark { width: 18px; height: 18px; display: block; }
.topbar__project { font-size: 12px; color: #cfcfcf; }
.topbar__project strong { color: var(--white); font-weight: 600; }
.topbar__spacer { flex: 1; }
.topbar__actions { display: flex; align-items: center; gap: 10px; }

/* ---------- sub bar ------------------------------------------------------- */

.subbar {
  height: var(--subbar-h);
  flex: 0 0 var(--subbar-h);
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
}
.subbar__title { font-size: 13px; font-weight: 600; }
.subbar__title em { font-style: normal; font-weight: 400; color: var(--ink-2); }
.subbar__meta { font-size: 12px; color: var(--ink-2); }
.subbar__spacer { flex: 1; }
.subbar__controls { display: flex; align-items: center; gap: 8px; }

/* ---------- layout -------------------------------------------------------- */

.layout { flex: 1; display: flex; min-height: 0; }

.stepper {
  width: var(--stepper-w);
  flex: 0 0 var(--stepper-w);
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 12px 8px;
  overflow-y: auto;
}
.stepper__item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  margin-bottom: 2px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  border-radius: 2px;
}
.stepper__item:hover { background: #eaeaea; }
.stepper__item.is-active { background: var(--bar); color: var(--white); }
.stepper__circle {
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--white);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.stepper__item.is-done .stepper__circle { background: #d8d8d8; color: var(--ink); border-color: #c2c2c2; }
.stepper__item.is-active .stepper__circle { background: var(--white); color: var(--ink); border-color: var(--white); }
.stepper__label { font-size: 12.5px; line-height: 1.25; }
.stepper__label small { display: block; font-size: 11px; color: var(--ink-2); }
.stepper__item.is-active .stepper__label small { color: #c9c9c9; }
.stepper__sep { height: 1px; background: var(--line); margin: 10px 10px; }

.workspace { flex: 1; min-width: 0; display: flex; overflow: hidden; }
.workspace--scroll { display: block; overflow-y: auto; padding: 20px; }

/* ---------- buttons ------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink);
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 500;
  border-radius: 2px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--bar); }
.btn:focus-visible { outline: 2px solid var(--bar); outline-offset: 1px; }
.btn--primary { background: var(--bar); border-color: var(--bar); color: var(--white); }
.btn--primary:hover { background: #2b2b2b; }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { border-color: var(--line); }
.btn--sm { padding: 4px 9px; font-size: 12px; }
.btn--block { width: 100%; justify-content: center; }
.btn--danger { color: var(--crit); }
.btn[disabled], .btn.is-disabled {
  opacity: 0.45;
  cursor: not-allowed;
  border-color: var(--line);
  background: var(--white);
  color: var(--ink-2);
}
.topbar .btn { border-color: #5a5a5a; background: transparent; color: var(--white); }
.topbar .btn:hover { border-color: var(--white); }
.topbar .btn--primary { background: var(--white); color: var(--ink); border-color: var(--white); }
.topbar .btn[disabled] { background: transparent; color: #8a8a8a; border-color: #454545; }
.topbar .btn[disabled]:hover { border-color: #454545; }
/* Sits immediately after the brand — the top-left corner the operator reaches for. */
.topbar__undo { margin-left: -12px; }

/* ---------- segmented control -------------------------------------------- */

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; background: var(--white); }
.seg__btn {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--ink-2);
  border-right: 1px solid var(--line);
}
.seg__btn:last-child { border-right: 0; }
.seg__btn.is-on { background: var(--bar); color: var(--white); font-weight: 500; }

/* ---------- chips / pills / dots ----------------------------------------- */

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  color: var(--ink-2);
}
.chip.is-on { background: var(--bar); border-color: var(--bar); color: var(--white); }

.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink-2);
  white-space: nowrap;
}
.pill--ok { background: var(--ok-wash); border-color: #b6ded0; color: #1f7a52; }
.pill--warn { background: var(--warn-wash); border-color: #e8d5a2; color: #8a6412; }
.pill--crit { background: var(--crit-wash); border-color: #eec4c3; color: #a5322e; }
.pill--phase1 { background: var(--ok-wash); border-color: #b6ded0; color: #1f7a52; }
.pill--phase2 { background: var(--warn-wash); border-color: #e8d5a2; color: #8a6412; }
.pill--phase3 { background: var(--phase-3-wash); border-color: #cdc0e8; color: #5b4590; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot--ok { background: var(--ok); }
.dot--warn { background: var(--warn); }
.dot--crit { background: var(--crit); }
.dot--proposed { background: var(--phase-3); }
/* Rekomendacje rysują się na mapie jako kwadraty — legenda pokazuje ten sam kształt. */
.dot--square { background: #8a6fc7; border-radius: 0; }

/* ---------- panels -------------------------------------------------------- */

.panel {
  background: var(--white);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel__head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel__head h3 { flex: 1; }
.panel__body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.panel__foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; }
.panel__section { margin-bottom: 22px; }
.panel__section > .label-caps { display: block; margin-bottom: 8px; }

.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 14px 16px;
}

/* ---------- KPI tiles ----------------------------------------------------- */

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi-grid--3 { grid-template-columns: repeat(3, 1fr); }
.kpi {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 10px 12px;
}
.kpi__label { font-size: 11px; color: var(--ink-2); line-height: 1.3; margin-bottom: 6px; min-height: 28px; }
.kpi__value { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi__value small { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kpi__delta { font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.kpi__delta.is-up { color: #1f7a52; }
.kpi__delta.is-down { color: #a5322e; }
.kpi__arrow { font-size: 13px; color: var(--ink-2); padding: 0 2px; }

/* ---------- progress bars ------------------------------------------------- */

.bar { height: 6px; background: #e7e7e7; border-radius: 1px; overflow: hidden; }
.bar__fill { height: 100%; background: var(--bar); }
.bar__fill--ok { background: var(--ok); }
.bar__fill--warn { background: var(--warn); }
.bar__fill--crit { background: var(--crit); }
.bar--thin { height: 4px; }

/* ---------- tables -------------------------------------------------------- */

.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--section);
  position: sticky;
  top: 0;
  z-index: 1;
}
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:hover { background: var(--section); }
.table tbody tr.is-selected { background: #eef1f5; }
.table__num { text-align: right; font-variant-numeric: tabular-nums; }
.table__main { font-weight: 500; }
.table__sub { font-size: 11.5px; color: var(--ink-2); }

.list-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.list-row:hover { background: var(--section); }
.list-row__body { flex: 1; min-width: 0; }
.list-row__title { font-weight: 500; font-size: 12.5px; }
.list-row__meta { font-size: 11.5px; color: var(--ink-2); }
.list-row__meta .is-crit { color: var(--crit); font-weight: 600; }

/* ---------- forms --------------------------------------------------------- */

.form { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field__label { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.field__hint { font-size: 11.5px; color: var(--ink-2); }
.field__row { display: flex; gap: 8px; align-items: center; }
.input, .select, .textarea {
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 7px 9px;
  background: var(--white);
  width: 100%;
  font-size: 12.5px;
}
.input:focus, .select:focus, .textarea:focus { outline: 0; border-color: var(--bar); border-width: 1px; box-shadow: inset 0 0 0 1px var(--bar); }
.textarea { min-height: 64px; resize: vertical; }
.checkline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.checkline input { accent-color: var(--bar); }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- card sections (spec §6.5) ------------------------------------ */

.card-section {
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-left-color: var(--line);
  background: var(--white);
  border-radius: 2px;
  margin-bottom: 10px;
}
.card-section--warn { border-left-color: var(--warn); }
.card-section--crit { border-left-color: var(--crit); }
.card-section__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
}
.card-section__head:hover { background: var(--panel); }
.card-section__head h3 { flex: 1; font-size: 13px; }
.card-section__num { font-size: 11px; color: var(--ink-2); font-weight: 600; }
.card-section__chev { font-size: 10px; color: var(--ink-2); flex: none; width: 12px; }
.card-section.is-collapsed .card-section__body { display: none; }
.card-section.is-collapsed .card-section__head { border-bottom: 0; }
.card-section__body { padding: 14px; display: grid; gap: 12px; }
.card-section__body--cols { grid-template-columns: 1fr 1fr; }

/* Dwie kolumny karty: szerokości w klasach, nie inline — media queries muszą wygrywać. */
.card-column {
  flex: 1 1 620px;
  min-width: 0;
  max-width: 880px;
  /* Wolna przestrzeń na bardzo szerokich ekranach zostaje między kolumną
     a panelem — panel trzyma się prawej krawędzi. */
  margin-right: auto;
  overflow-y: auto;
  padding: 20px;
}
.panel--card { width: 520px; flex: 0 1 520px; min-width: 320px; }

/* Suwaki oceny eksperckiej */
.score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.score-crit { display: grid; gap: 4px; }
.score-crit__head { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.score-crit__head b { font-weight: 600; }
.score-crit__val { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.score-crit input[type='range'] { width: 100%; accent-color: var(--ok); }
.score-box {
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 10px 14px;
  border-radius: 2px;
}
.score-box__formula { font-family: var(--mono, monospace); font-size: 11px; color: var(--ink-2); }
.score-box__value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
.score-badge {
  display: inline-block;
  min-width: 34px;
  text-align: center;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 2px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.score-badge--ok { color: var(--ok); border-color: var(--ok); }
.score-badge--warn { color: #a97a10; border-color: var(--warn); }
.score-badge--crit { color: var(--crit); border-color: var(--crit); }

/* ---------- photo slots (spec §7) ---------------------------------------- */

.photo-slots { display: flex; flex-wrap: wrap; gap: 8px; }
.photo-slot {
  width: 106px;
  height: 106px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--section);
  display: grid;
  place-items: center;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  padding: 6px;
}
.photo-slot:hover { border-color: var(--bar); }
.photo-slot.is-required-missing { border-color: var(--warn); border-width: 2px; }
.photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-slot__label { font-size: 10.5px; color: var(--ink-2); line-height: 1.25; z-index: 1; }
.photo-slot__icon { font-size: 16px; display: block; margin-bottom: 3px; }
.photo-slot__badge {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: rgba(30, 30, 30, 0.72);
  color: var(--white);
  font-size: 10px;
  padding: 2px 4px;
  z-index: 2;
}
.photo-slot__req { position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--warn); font-weight: 700; z-index: 2; }

/* ---------- map ----------------------------------------------------------- */

.map-wrap { flex: 1; position: relative; min-width: 0; background: #e9e9e6; }
.map-canvas { position: absolute; inset: 0; }
.map-fallback { position: absolute; inset: 0; }
.map-fallback svg { width: 100%; height: 100%; display: block; }
.map-notice {
  position: absolute;
  left: 12px;
  top: 12px;
  z-index: 5;
  background: var(--warn-wash);
  border: 1px solid #e8d5a2;
  color: #7a5a10;
  font-size: 11.5px;
  padding: 6px 10px;
  border-radius: 2px;
  max-width: 340px;
}
.map-legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 5;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 8px 10px;
  font-size: 11.5px;
}
.map-legend__row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.map-legend b { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.map-toolbar { position: absolute; right: 12px; top: 12px; z-index: 5; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
/* Prawy dolny róg, przesunięty tak, by ominąć kontrolkę zoomu Mapboksa. */
.map-corner-note {
  position: absolute; right: 56px; bottom: 12px; z-index: 5;
  max-width: 250px; text-align: right;
}
.map-corner-note .pill { padding: 5px 10px; line-height: 1.35; white-space: normal; display: inline-block; }
.map-hint {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  z-index: 6; background: var(--bar); color: var(--white);
  font-size: 12px; padding: 6px 12px; border-radius: 2px;
}
/* Mapa zapasowa dokłada u góry po lewej swój komunikat (do trzech wierszy) —
   wyśrodkowana podpowiedź schodzi pod niego, zamiast wchodzić mu na róg. */
.map-notice ~ .map-hint { top: 84px; }

.pin {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--white);
  background: var(--ink-2);
  cursor: pointer;
  box-sizing: border-box;
}
.pin--ok { background: var(--ok); }
.pin--warn { background: var(--warn); }
.pin--crit { background: var(--crit); }
.pin--proposed { border-radius: 2px; background: var(--phase-3); }
.pin.is-selected { outline: 2px solid var(--bar); outline-offset: 2px; }
.pin--district-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: #8d8d8d; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
}
.gap-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
  color: #a5322e; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
}

.map-popup { min-width: 210px; font-size: 12.5px; }
.map-popup h4 { font-size: 13px; margin-bottom: 2px; }
.map-popup__meta { color: var(--ink-2); font-size: 11.5px; margin-bottom: 8px; }
.map-popup__flags { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.map-popup__flag { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.mapboxgl-popup-content { border-radius: 2px; padding: 12px; font-family: var(--font); }

/* ---------- dashboard ----------------------------------------------------- */

.dash { max-width: 1180px; margin: 0 auto; }
.dash__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
.project-card {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 186px;
}
.project-card__head { display: flex; align-items: flex-start; gap: 8px; }
.project-card__head h3 { flex: 1; }
.project-card__steps { display: flex; gap: 3px; }
.project-card__step { flex: 1; height: 5px; background: #e7e7e7; }
.project-card__step.is-done { background: var(--bar); }
.project-card__kpi { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.project-card__kpi small { font-size: 11.5px; font-weight: 400; color: var(--ink-2); display: block; }
.project-card__foot { margin-top: auto; display: flex; gap: 8px; align-items: center; }
.project-card--new {
  border-style: dashed;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink-2);
}
.project-card--new:hover { border-color: var(--bar); color: var(--ink); }

.dash__section { margin-top: 28px; }
.dash__section > h2 { margin-bottom: 10px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.preset-card { border: 1px solid var(--line); background: var(--white); padding: 10px 12px; border-radius: 2px; }
.preset-card__id { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.preset-card__cost { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }

/* ---------- kanban -------------------------------------------------------- */

.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
.kanban__col { border: 1px solid var(--line); background: var(--white); border-radius: 2px; min-height: 220px; display: flex; flex-direction: column; }
.kanban__stripe { height: 3px; }
.kanban__stripe--1 { background: var(--phase-1); }
.kanban__stripe--2 { background: var(--phase-2); }
.kanban__stripe--3 { background: var(--phase-3); }
.kanban__head { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.kanban__head h3 { font-size: 13px; }
.kanban__head .muted { font-size: 11.5px; }
.kanban__body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.kanban__body.is-dropzone { background: #eef1f5; outline: 1px dashed var(--bar); outline-offset: -4px; }
.kanban__card {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 8px 10px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  cursor: grab;
}
.kanban__card.is-dragging { opacity: 0.4; }
.kanban__grip { color: var(--line); font-size: 12px; line-height: 1.1; cursor: grab; user-select: none; }
.kanban__card h4 { font-size: 12.5px; font-weight: 500; }
.kanban__meta { font-size: 11px; color: var(--ink-2); }
.kanban__effect { font-size: 11px; font-weight: 600; color: #1f7a52; }

/* ---------- gantt --------------------------------------------------------- */

.gantt { border: 1px solid var(--line); background: var(--white); border-radius: 2px; overflow-x: auto; }
.gantt__grid { display: grid; grid-template-columns: 430px 1fr; min-width: 900px; }
.gantt__tasks { border-right: 1px solid var(--line); }
.gantt__row { height: 30px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid #ececec; font-size: 12px; gap: 8px; }
.gantt__row--head { height: 34px; background: var(--section); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.gantt__row--group { background: var(--section); font-weight: 600; }
.gantt__lane { position: relative; height: 30px; border-bottom: 1px solid #ececec; }
.gantt__quarters { display: flex; height: 34px; background: var(--section); border-bottom: 1px solid var(--line); }
.gantt__quarter { flex: 1; border-right: 1px solid #ececec; font-size: 10.5px; color: var(--ink-2); display: grid; place-items: center; }
.gantt__bar {
  position: absolute; top: 6px; height: 18px;
  border-radius: 2px; cursor: grab;
  display: flex; align-items: center; padding: 0 6px;
  font-size: 10.5px; color: #fff; overflow: hidden; white-space: nowrap;
}
.gantt__bar--1 { background: var(--phase-1); }
.gantt__bar--2 { background: var(--phase-2); color: #4a3a08; }
.gantt__bar--3 { background: var(--phase-3); }
.gantt__handle { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; background: rgba(0,0,0,0.12); }
.gantt__milestones { position: relative; height: 34px; border-bottom: 1px solid var(--line); }
.gantt__milestone { position: absolute; top: 4px; transform: translateX(-50%); text-align: center; font-size: 10px; color: var(--ink-2); }
.gantt__milestone::before { content: '▲'; display: block; color: var(--bar); font-size: 9px; }
.gantt__curve { height: 74px; position: relative; }
.gantt__curve svg { width: 100%; height: 100%; display: block; }

/* ---------- report -------------------------------------------------------- */

.report-layout { display: grid; grid-template-columns: 170px 620px 1fr; gap: 16px; height: 100%; min-height: 0; }
.report-thumbs { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.report-thumb {
  border: 1px solid var(--line);
  background: var(--white);
  border-radius: 2px;
  padding: 8px;
  font-size: 11.5px;
  cursor: pointer;
  text-align: left;
}
.report-thumb.is-on { border-color: var(--bar); border-width: 2px; }
.report-thumb__no { font-size: 10px; color: var(--ink-2); font-weight: 700; }
.report-preview { overflow-y: auto; background: #e4e4e1; padding: 14px; }
.report-config { overflow-y: auto; }

.report-page {
  background: var(--white);
  border: 1px solid var(--line);
  width: 100%;
  min-height: 820px;
  padding: 34px 38px;
  margin-bottom: 14px;
}
.report-page__head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--bar); padding-bottom: 8px; margin-bottom: 18px; }
.report-page__head b { font-size: 14px; letter-spacing: 0.02em; }
.report-page__head span { font-size: 11px; color: var(--ink-2); margin-left: auto; }
.report-page h2 { font-size: 19px; margin-bottom: 6px; }
.report-page h3 { margin: 16px 0 6px; }
.report-page p { font-size: 12.5px; }
.report-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.report-kpi { border: 1px solid var(--line); padding: 8px; }
.report-kpi__v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.report-kpi__l { font-size: 10px; color: var(--ink-2); line-height: 1.25; }
.report-maps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.report-map { border: 1px solid var(--line); height: 220px; position: relative; background: var(--section); }
.report-map svg { width: 100%; height: 100%; display: block; }
.report-map__cap { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.report-quote { border-left: 3px solid var(--bar); padding: 8px 12px; background: var(--section); font-size: 12.5px; margin: 14px 0; }

/* ---------- field form (mobile, spec §6.8) ------------------------------- */

.field-form { max-width: 420px; margin: 0 auto; padding: 16px; background: var(--white); min-height: 100vh; }
.field-form h2 { margin-bottom: 4px; }
.field-form .form { max-width: none; }

/* ---------- misc ---------------------------------------------------------- */

.empty-state { padding: 26px 16px; text-align: center; color: var(--ink-2); font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; }
.row--wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.note { font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }

[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: var(--bar);
  color: var(--white);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 2px;
  white-space: nowrap;
  z-index: 40;
  pointer-events: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: var(--bar);
  color: var(--white);
  font-size: 12.5px;
  padding: 8px 16px;
  border-radius: 2px;
  z-index: 100;
}

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(30,30,30,0.4);
  display: grid; place-items: center; z-index: 60;
}
.modal {
  background: var(--white); border: 1px solid var(--line); border-radius: 2px;
  width: 420px; max-width: calc(100vw - 32px); max-height: 86vh; overflow-y: auto;
}
.modal__head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal__body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal__foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ==========================================================================
   Responsywność

   Widths that used to sit in inline styles live here as classes, so the
   breakpoints below can actually override them. Three steps:
     ≤1200px — chrome tightens, side panels shrink
     ≤900px  — split views stack (map over panel), stepper turns horizontal
     ≤620px  — single-column everything, top bar reduced to essentials
   ========================================================================== */

.panel--side { width: 480px; flex: 0 0 480px; }
.panel--metrics { width: 380px; flex: 0 0 380px; }
.form-col { width: 560px; flex: 0 0 560px; }

@media (max-width: 1400px) {
  .report-layout { grid-template-columns: 150px minmax(420px, 560px) 1fr; }
}

@media (max-width: 1200px) {
  :root { --stepper-w: 176px; }
  .panel--side { width: 400px; flex: 0 0 400px; }
  .panel--metrics { width: 336px; flex: 0 0 336px; }
  .panel--card { width: 400px; flex-basis: 400px; }
  .score-grid { grid-template-columns: 1fr; }
  .form-col { width: 460px; flex: 0 0 460px; }
  .stepper__label small { display: none; }
  .report-layout { grid-template-columns: minmax(380px, 620px) 1fr; }
  .report-thumbs { display: none; }
  .report-kpis { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 900px) {
  /* Stepper becomes a scrollable strip above the workspace. */
  .layout { flex-direction: column; min-height: 0; }
  .stepper {
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    -webkit-overflow-scrolling: touch;
  }
  .stepper__item { width: auto; flex: 0 0 auto; margin: 0; padding: 6px 10px; }
  .stepper__label { white-space: nowrap; font-size: 12px; }
  .stepper__sep { display: none; }

  /* Split views stack: map on top, panel below. */
  .workspace { flex-direction: column; overflow-y: auto; }
  .map-wrap { flex: 0 0 auto; height: 48vh; min-height: 300px; width: 100%; }
  .panel,
  .panel--side,
  .panel--metrics,
  .panel--card {
    width: 100%;
    flex: 1 1 auto;
    min-width: 0;
    border-left: 0;
    border-top: 1px solid var(--line);
    min-height: 0;
  }
  .panel__body { overflow-y: visible; }
  .form-col { width: 100%; flex: 1 1 auto; }
  .card-column { max-width: none; flex: 0 0 auto; width: 100%; overflow-y: visible; }

  .kanban { grid-template-columns: 1fr; }
  .kpi-grid--3 { grid-template-columns: 1fr 1fr; }
  .report-layout { grid-template-columns: 1fr; height: auto; }
  .report-preview { padding: 0; background: transparent; }
  .report-page { padding: 22px; min-height: 0; }
  .report-kpis { grid-template-columns: repeat(2, 1fr); }
  .report-maps { grid-template-columns: 1fr; }
  .card-section__body--cols { grid-template-columns: 1fr; }

  /* Wide tables scroll instead of squeezing the page. */
  .workspace--scroll { overflow-x: auto; }
  .table { min-width: 720px; }
}

@media (max-width: 620px) {
  body { font-size: 12.5px; }
  .topbar { gap: 10px; padding: 0 10px; }
  .topbar__project { display: none; }
  .topbar__brand { font-size: 12.5px; }
  .subbar {
    height: auto;
    flex: 0 0 auto;
    min-height: var(--subbar-h);
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 8px 10px;
  }
  .subbar__spacer { display: none; }
  .subbar__controls { width: 100%; }
  .seg { width: 100%; }
  .seg__btn { flex: 1; text-align: center; }
  .kpi-grid, .kpi-grid--3 { grid-template-columns: 1fr; }
  .dash__grid { grid-template-columns: 1fr; }
  .preset-grid { grid-template-columns: 1fr; }
  .report-kpis { grid-template-columns: 1fr; }
  .map-wrap { height: 42vh; min-height: 240px; }
  .map-legend { display: none; }
  /* Na telefonie etykieta iteracji zabrałaby połowę mapy — zostaje w panelu. */
  .map-corner-note { display: none; }
  /* Keep the notice clear of the toolbar buttons on the right. */
  .map-notice { max-width: calc(100% - 168px); font-size: 10.5px; padding: 5px 8px; }
  /* District captions collide at this scale and add nothing — the panel lists them. */
  .pin--district-label { display: none; }
  .photo-slot { width: 92px; height: 92px; }
  .workspace--scroll { padding: 12px; }
  .modal { width: calc(100vw - 20px); }
}

/* Coarse pointers get bigger hit targets. */
@media (pointer: coarse) {
  .btn { padding: 9px 14px; }
  .stepper__item { padding: 9px 12px; }
  .pin { width: 24px; height: 24px; }
  .list-row { padding: 12px 4px; }
}

/* ---------- print (spec §6.7) -------------------------------------------- */

@media print {
  @page { size: A4; margin: 14mm; }
  body { background: var(--white); }
  .topbar, .subbar, .stepper, .report-thumbs, .report-config, .no-print { display: none !important; }
  .app, .layout, .workspace { display: block; height: auto; overflow: visible; }
  .report-layout { display: block; }
  .report-preview { background: var(--white); padding: 0; overflow: visible; }
  .report-page { border: 0; margin: 0; padding: 0 0 10mm; min-height: 0; break-after: page; }
  .report-page:last-child { break-after: auto; }
  .report-kpis, .report-maps, .card-section, .kanban__col { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- roadmapa: nowy montaż vs modernizacja ------------------------- */

/* Kwadrat = nowe urządzenie, kółko = poprawa punktu, który już stoi.
   Te same kształty co na mapie, żeby nie uczyć się drugiego alfabetu. */
.rec-kind { width: 9px; height: 9px; flex: none; margin-top: 3px; }
.rec-kind--new { background: var(--phase-3); }
.rec-kind--update { background: var(--ink-2); border-radius: 50%; }

</style>

__defs['js/model.js'] = function () {
/**
 * model.js — all analytical computation for the AED planner.
 *
 * Pure functions only: no DOM, no state import, no side effects.
 * This module is imported both by the browser app and by tools/generate-demo.mjs,
 * so demo-data tuning uses exactly the same math the UI shows.
 *
 * Spec reference: ITERACJA2_SPEC.md §5.
 */

/* ------------------------------------------------------------------ *
 * Constants (spec §5)
 * ------------------------------------------------------------------ */

/** Walking speed of a bystander fetching an AED, metres per minute. */
const WALK_SPEED = 100;

/** Straight-line -> street-network correction factor. */
const DETOUR = 1.35;

/** Golden angle, used for deterministic demand-point scatter. */
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

/**
 * Radial density exponent for demand scatter. 0.5 spreads people evenly by
 * area; higher values pull them towards the centre of the built-up area,
 * which is how residential density actually behaves inside an estate.
 */
const DENSITY_FALLOFF = 0.68;

const M_PER_DEG_LAT = 111320;

/* ------------------------------------------------------------------ *
 * Geometry
 * ------------------------------------------------------------------ */

function metresPerDegLon(lat) {
  return M_PER_DEG_LAT * Math.cos((lat * Math.PI) / 180);
}

/** Equirectangular approximation — accurate enough at city scale. */
function distanceM(a, b) {
  const dy = (a.lat - b.lat) * M_PER_DEG_LAT;
  const dx = (a.lon - b.lon) * metresPerDegLon((a.lat + b.lat) / 2);
  return Math.hypot(dx, dy);
}

/** One-way walking time in minutes for a straight-line distance. */
function walkTimeMin(distM) {
  return (distM * DETOUR) / WALK_SPEED;
}

/** Coverage radius for a standard expressed as one-way minutes. */
function coverageRadiusM(standardMinutes) {
  return (standardMinutes * WALK_SPEED) / DETOUR;
}

/** Offset a lat/lon by a metric vector. */
function offsetLatLon(origin, dxM, dyM) {
  return {
    lat: origin.lat + dyM / M_PER_DEG_LAT,
    lon: origin.lon + dxM / metresPerDegLon(origin.lat),
  };
}

/* ------------------------------------------------------------------ *
 * Polygons
 * ------------------------------------------------------------------ */

/** Area-weighted centroid of a GeoJSON linear ring ([lon,lat] pairs). */
function ringCentroid(ring) {
  let area = 0;
  let cx = 0;
  let cy = 0;
  for (let i = 0, n = ring.length - 1; i < n; i++) {
    const [x0, y0] = ring[i];
    const [x1, y1] = ring[i + 1];
    const cross = x0 * y1 - x1 * y0;
    area += cross;
    cx += (x0 + x1) * cross;
    cy += (y0 + y1) * cross;
  }
  if (Math.abs(area) < 1e-12) {
    const [x, y] = ring[0];
    return { lat: y, lon: x };
  }
  area *= 0.5;
  return { lat: cy / (6 * area), lon: cx / (6 * area) };
}

function pointInRing(point, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    const intersects =
      yi > point.lat !== yj > point.lat &&
      point.lon < ((xj - xi) * (point.lat - yi)) / (yj - yi) + xi;
    if (intersects) inside = !inside;
  }
  return inside;
}

/**
 * Distance in metres from `centre` to the ring boundary along `theta`
 * (radians, 0 = east). Works for star-shaped polygons, which is what the
 * district blobs are. Returns 0 when the ray misses (degenerate geometry).
 */
function ringRadiusAtAngle(centre, ring, theta) {
  const kx = metresPerDegLon(centre.lat);
  const dirX = Math.cos(theta);
  const dirY = Math.sin(theta);
  let best = 0;

  for (let i = 0, n = ring.length - 1; i < n; i++) {
    const ax = (ring[i][0] - centre.lon) * kx;
    const ay = (ring[i][1] - centre.lat) * M_PER_DEG_LAT;
    const bx = (ring[i + 1][0] - centre.lon) * kx;
    const by = (ring[i + 1][1] - centre.lat) * M_PER_DEG_LAT;

    const ex = bx - ax;
    const ey = by - ay;
    const denom = dirX * ey - dirY * ex;
    if (Math.abs(denom) < 1e-9) continue;

    const t = (ax * ey - ay * ex) / denom; // distance along ray
    const u = (ax * dirY - ay * dirX) / denom; // position along edge
    if (t > 0 && u >= 0 && u <= 1 && t > best) best = t;
  }
  return best;
}

/* ------------------------------------------------------------------ *
 * Demand points (spec §5)
 * ------------------------------------------------------------------ */

/**
 * Scatter deterministic, population-weighted demand points inside district
 * polygons. Same input always yields the same output.
 *
 * @param {Array} features GeoJSON Features (Polygon) with
 *                properties {id, name, population}
 * @returns {Array<{lat,lon,weight,districtId}>}
 */
function buildDemandPoints(features) {
  const out = [];
  for (const feature of features) {
    const props = feature.properties || {};
    const population = props.population || 0;
    if (population <= 0) continue;

    const ring = feature.geometry.coordinates[0];
    const centre = ringCentroid(ring);
    const count = Math.max(20, Math.round(population / 200));
    const weight = population / count;

    for (let i = 0; i < count; i++) {
      const theta = i * GOLDEN_ANGLE;
      const frac = Math.pow((i + 0.5) / count, DENSITY_FALLOFF); // denser core
      const edge = ringRadiusAtAngle(centre, ring, theta);
      if (edge <= 0) continue;
      const r = frac * edge;
      const p = offsetLatLon(centre, r * Math.cos(theta), r * Math.sin(theta));
      out.push({ lat: p.lat, lon: p.lon, weight, districtId: props.id });
    }
  }
  return out;
}

/* ------------------------------------------------------------------ *
 * Point selection
 * ------------------------------------------------------------------ */

/**
 * Which AED points count towards coverage.
 * @param {Array} points  state.points
 * @param {'now'|'plan'} scenario
 * @param {'day'|'night'} mode
 */
function activePoints(points, scenario = 'now', mode = 'day') {
  return points.filter((p) => {
    if (p.kind === 'existing') {
      if (p.status === 'rejected') return false;
    } else {
      // proposed points only count in the plan scenario, once accepted
      if (scenario !== 'plan') return false;
      if (p.status !== 'accepted') return false;
    }
    if (mode === 'night' && !(p.access && p.access.always === true)) return false;
    return true;
  });
}

/* ------------------------------------------------------------------ *
 * Zasięg dojścia: wielokąt izochrony albo okrąg
 * ------------------------------------------------------------------ */

/**
 * Klucz zasięgu w cache — zaokrąglona współrzędna, 5 miejsc ≈ 1 m.
 * Ta jedna definicja obowiązuje model, moduł reach.js i narzędzie
 * tools/fetch-reach.mjs; rozjazd oznaczałby cichy brak trafień w cache.
 */
function reachKey(lat, lon) {
  const r5 = (v) => (Math.round(v * 1e5) / 1e5).toFixed(5);
  return `${r5(lat)},${r5(lon)}`;
}

function ringBbox(ring) {
  let w = 180;
  let s = 90;
  let e = -180;
  let n = -90;
  for (const [lon, lat] of ring) {
    if (lon < w) w = lon;
    if (lon > e) e = lon;
    if (lat < s) s = lat;
    if (lat > n) n = lat;
  }
  return [w, s, e, n];
}

function inRing(lat, lon, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/**
 * Sonda zasięgu jednego AED.
 *
 * Z izochroną: „w zasięgu" znaczy „wewnątrz konturu standardu", a czas dojścia
 * wypada w paśmie między sąsiednimi konturami. Wewnątrz pasma porządkuje punkty
 * odległość w linii prostej — sieć daje pasmo, geometria kolejność w nim.
 * Bez izochrony: stary okrąg, oznaczony jako przybliżenie.
 *
 * @param {{lat:number, lon:number}} site
 * @param {object|null} contours {2: ring, 3: ring, …} — pierścienie [lon,lat]
 */
function makeProbe(site, contours, standardMinutes, radiusM) {
  const ladder = contours
    ? Object.keys(contours)
        .map(Number)
        .filter((m) => Number.isFinite(m) && Array.isArray(contours[m]) && contours[m].length > 2)
        .sort((a, b) => a - b)
    : [];

  const standardRing = contours ? contours[standardMinutes] : null;
  if (!ladder.length || !standardRing) {
    return {
      network: false,
      covers: (dp) => distanceM(dp, site) <= radiusM,
      minutes: (dp) => walkTimeMin(distanceM(dp, site)),
    };
  }

  const bands = ladder.map((m) => ({ minutes: m, ring: contours[m], bbox: ringBbox(contours[m]) }));
  const outerMinutes = ladder[ladder.length - 1];
  const stdBand = bands.find((b) => b.minutes === standardMinutes);

  const hit = (band, dp) => {
    const [w, s, e, n] = band.bbox;
    if (dp.lon < w || dp.lon > e || dp.lat < s || dp.lat > n) return false;
    return inRing(dp.lat, dp.lon, band.ring);
  };

  return {
    network: true,
    covers: (dp) => hit(stdBand, dp),
    minutes: (dp) => {
      const straight = walkTimeMin(distanceM(dp, site));
      let prev = 0;
      for (const band of bands) {
        if (hit(band, dp)) {
          // czas mieści się w (prev, band.minutes]
          return Math.min(band.minutes, Math.max(prev + 0.05, straight));
        }
        prev = band.minutes;
      }
      // poza całą drabiną — realny czas jest co najmniej tak duży jak ostatni kontur
      return Math.max(straight, outerMinutes + 0.1);
    },
  };
}

/** Sondy dla listy AED; `reach` to mapa klucz → kontury (może być pusta). */
function makeProbes(sites, reach, standardMinutes, radiusM) {
  return sites.map((p) => makeProbe(p, reach ? reach[reachKey(p.lat, p.lon)] : null, standardMinutes, radiusM));
}

/* ------------------------------------------------------------------ *
 * Coverage + KPIs
 * ------------------------------------------------------------------ */

function median(sortedValues, weights) {
  const total = weights.reduce((s, w) => s + w, 0);
  if (!total) return 0;
  let acc = 0;
  for (let i = 0; i < sortedValues.length; i++) {
    acc += weights[i];
    if (acc >= total / 2) return sortedValues[i];
  }
  return sortedValues[sortedValues.length - 1] || 0;
}

/**
 * Full analysis for one scenario/mode combination.
 *
 * @param {object} args
 * @param {Array}  args.demandPoints  from buildDemandPoints()
 * @param {Array}  args.points        state.points
 * @param {Array}  args.districts     [{id, name, population}]
 * @param {number} args.standardMinutes
 * @param {number} args.population    project population (for per-10k)
 * @param {'now'|'plan'} args.scenario
 * @param {'day'|'night'} args.mode
 * @param {object|null} args.reach  mapa reachKey → kontury izochron; brak wpisu
 *                                  dla punktu = liczenie okręgiem
 */
function analyze({
  demandPoints,
  points,
  districts = [],
  standardMinutes = 2,
  population = 0,
  scenario = 'now',
  mode = 'day',
  reach = null,
}) {
  const radiusM = coverageRadiusM(standardMinutes);
  const active = activePoints(points, scenario, mode);
  const probes = makeProbes(active, reach, standardMinutes, radiusM);
  const networkCount = probes.filter((p) => p.network).length;

  const perDistrict = new Map();
  for (const d of districts) {
    perDistrict.set(d.id, {
      districtId: d.id,
      name: d.name,
      population: d.population || 0,
      totalWeight: 0,
      uncoveredWeight: 0,
      maxMin: 0,
    });
  }

  const status = new Array(demandPoints.length);
  let totalWeight = 0;
  let coveredWeight = 0;
  const times = [];
  const timeWeights = [];

  for (let i = 0; i < demandPoints.length; i++) {
    const dp = demandPoints[i];
    let nearestMin = Infinity;
    let covered = false;
    for (const probe of probes) {
      if (!covered && probe.covers(dp)) covered = true;
      const m = probe.minutes(dp);
      if (m < nearestMin) nearestMin = m;
    }

    status[i] = {
      lat: dp.lat,
      lon: dp.lon,
      weight: dp.weight,
      districtId: dp.districtId,
      nearestMin,
      covered,
    };

    totalWeight += dp.weight;
    if (covered) coveredWeight += dp.weight;
    times.push(nearestMin);
    timeWeights.push(dp.weight);

    let bucket = perDistrict.get(dp.districtId);
    if (!bucket) {
      bucket = {
        districtId: dp.districtId,
        name: dp.districtId,
        population: 0,
        totalWeight: 0,
        uncoveredWeight: 0,
        maxMin: 0,
      };
      perDistrict.set(dp.districtId, bucket);
    }
    bucket.totalWeight += dp.weight;
    if (!covered) bucket.uncoveredWeight += dp.weight;
    if (Number.isFinite(nearestMin) && nearestMin > bucket.maxMin) {
      bucket.maxMin = nearestMin;
    }
  }

  // weighted median of walking time
  const order = times.map((t, i) => i).sort((a, b) => times[a] - times[b]);
  const medianMin = median(
    order.map((i) => times[i]),
    order.map((i) => timeWeights[i])
  );

  const finiteTimes = times.filter(Number.isFinite);
  const meanMin = finiteTimes.length
    ? finiteTimes.reduce((s, t, i) => s + t * timeWeights[i], 0) / (totalWeight || 1)
    : 0;

  const always = points.filter(
    (p) => p.kind === 'existing' && p.access && p.access.always === true
  ).length;
  const existingCount = points.filter((p) => p.kind === 'existing').length;

  const gaps = [...perDistrict.values()]
    .filter((d) => d.uncoveredWeight > 0)
    .map((d) => ({
      districtId: d.districtId,
      name: d.name,
      uncoveredPeople: Math.round(d.uncoveredWeight),
      population: Math.round(d.totalWeight),
      maxMin: d.maxMin,
      uncoveredPct: d.totalWeight ? (100 * d.uncoveredWeight) / d.totalWeight : 0,
    }))
    .sort((a, b) => b.uncoveredPeople - a.uncoveredPeople);

  return {
    radiusM,
    scenario,
    mode,
    /** 'network' — wszystkie czynne AED mają izochronę; 'mixed' / 'radius' — reszta liczona okręgiem. */
    reachMode: networkCount === active.length && active.length ? 'network' : networkCount ? 'mixed' : 'radius',
    reachStats: { network: networkCount, total: active.length },
    activeCount: active.length,
    activePoints: active,
    coveragePct: totalWeight ? (100 * coveredWeight) / totalWeight : 0,
    coveredPeople: Math.round(coveredWeight),
    totalPeople: Math.round(totalWeight),
    medianMin,
    meanMin,
    aedPer10k: population ? active.length / (population / 10000) : 0,
    always247Pct: existingCount ? (100 * always) / existingCount : 0,
    gaps,
    demandStatus: status,
  };
}

/* ------------------------------------------------------------------ *
 * Greedy maximum coverage (spec §5)
 * ------------------------------------------------------------------ */

/**
 * Pick `count` candidate sites that add the most uncovered population.
 *
 * @returns {Array<{candidateId,name,lat,lon,presetId,gainWeight,gainPct}>}
 */
function proposeNewPoints({
  demandPoints,
  points,
  candidates,
  standardMinutes = 2,
  count = 2,
  mode = 'day',
  reach = null,
}) {
  const radiusM = coverageRadiusM(standardMinutes);
  const base = activePoints(points, 'plan', mode);
  const usedIds = new Set(
    points.filter((p) => p.candidateId).map((p) => p.candidateId)
  );

  const baseProbes = makeProbes(base, reach, standardMinutes, radiusM);
  const covered = demandPoints.map((dp) => baseProbes.some((probe) => probe.covers(dp)));
  const totalWeight = demandPoints.reduce((s, dp) => s + dp.weight, 0) || 1;

  // Sonda kandydata liczona raz — greedy przechodzi listę tyle razy, ile
  // punktów wybiera, a budowa bboxów konturu nie jest darmowa.
  const candProbes = new Map(
    candidates.map((c) => [c.id, makeProbe(c, reach ? reach[reachKey(c.lat, c.lon)] : null, standardMinutes, radiusM)])
  );

  const chosen = [];
  const taken = new Set(usedIds);

  for (let k = 0; k < count; k++) {
    let best = null;
    let bestGain = 0;

    for (const cand of candidates) {
      if (taken.has(cand.id)) continue;
      const probe = candProbes.get(cand.id);
      let gain = 0;
      for (let i = 0; i < demandPoints.length; i++) {
        if (covered[i]) continue;
        if (probe.covers(demandPoints[i])) gain += demandPoints[i].weight;
      }
      if (gain > bestGain) {
        bestGain = gain;
        best = cand;
      }
    }

    if (!best || bestGain <= 0) break;

    taken.add(best.id);
    const bestProbe = candProbes.get(best.id);
    for (let i = 0; i < demandPoints.length; i++) {
      if (!covered[i] && bestProbe.covers(demandPoints[i])) covered[i] = true;
    }

    chosen.push({
      candidateId: best.id,
      name: best.name,
      lat: best.lat,
      lon: best.lon,
      presetId: best.presetId || 'P1',
      districtId: best.districtId || null,
      gainWeight: Math.round(bestGain),
      gainPct: (100 * bestGain) / totalWeight,
    });
  }

  return chosen;
}

/**
 * Coverage gain of a single site given the current plan — used for live
 * recalculation while a proposed pin is being dragged.
 */
function coverageGainFor(
  site,
  { demandPoints, points, standardMinutes, mode = 'day', excludeId = null, reach = null }
) {
  const radiusM = coverageRadiusM(standardMinutes);
  const base = activePoints(points, 'plan', mode).filter((p) => p.id !== excludeId);
  const totalWeight = demandPoints.reduce((s, dp) => s + dp.weight, 0) || 1;

  const siteProbe = makeProbe(site, reach ? reach[reachKey(site.lat, site.lon)] : null, standardMinutes, radiusM);
  const baseProbes = makeProbes(base, reach, standardMinutes, radiusM);

  let gain = 0;
  for (const dp of demandPoints) {
    if (!siteProbe.covers(dp)) continue;
    if (baseProbes.some((probe) => probe.covers(dp))) continue;
    gain += dp.weight;
  }
  return { gainWeight: Math.round(gain), gainPct: (100 * gain) / totalWeight, network: siteProbe.network };
}

/* ------------------------------------------------------------------ *
 * Card completeness (spec §5)
 * ------------------------------------------------------------------ */

function readPath(obj, path) {
  return path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), obj);
}

function isFilled(value) {
  if (value === null || value === undefined) return false;
  if (typeof value === 'string') return value.trim() !== '';
  if (typeof value === 'boolean') return true; // an explicit false is an answer
  if (Array.isArray(value)) return value.length > 0;
  if (typeof value === 'object') return Object.values(value).some(isFilled);
  return true;
}

/**
 * Baseline requirements for a point that has no preset assigned yet — usually
 * an unverified import from OSM. Without this such a card would report 100%
 * complete simply because nothing is required of it, which is the opposite of
 * the truth.
 */
const FALLBACK_PRESET = {
  id: null,
  name: 'Bez presetu — wymaga wizyty',
  requiredFields: [
    'name', 'address', 'placement', 'access', 'keeper',
    'signage.atDevice', 'signage.route', 'device.model', 'dispatcherRegistered',
  ],
  requiredPhotos: ['device'],
  checklist: [],
};

/**
 * @returns {{pct:number, filled:number, required:number,
 *            missingFields:string[], missingPhotos:string[]}}
 */
function completeness(point, preset, photos = []) {
  const effective = preset || FALLBACK_PRESET;
  const requiredFields = effective.requiredFields || [];
  const requiredPhotos = effective.requiredPhotos || [];

  const missingFields = requiredFields.filter((path) => !isFilled(readPath(point, path)));
  const roles = new Set(
    photos.filter((ph) => ph.pointId === point.id).map((ph) => ph.role)
  );
  const missingPhotos = requiredPhotos.filter((role) => !roles.has(role));

  const required = requiredFields.length + requiredPhotos.length;
  const filled = required - missingFields.length - missingPhotos.length;

  return {
    pct: required ? Math.round((100 * filled) / required) : 100,
    filled,
    required,
    missingFields,
    missingPhotos,
  };
}

/** Pin colour class driven by completeness + verification status (spec §5). */
function pointStatusLevel(point, pct) {
  if (point.kind === 'proposed') return 'proposed';
  if (point.status === 'unverified') return 'crit';
  if (pct >= 100) return 'ok';
  return 'warn';
}

/* ------------------------------------------------------------------ *
 * Auto-recommendation rules (spec §5)
 * ------------------------------------------------------------------ */

const TODAY_FALLBACK = '2026-07-29';

function isOverdue(yearMonth, today = TODAY_FALLBACK) {
  if (!yearMonth) return false;
  return String(yearMonth).slice(0, 7) < String(today).slice(0, 7);
}

/**
 * Deterministic rule engine. Ids are stable (`auto-<pointId>-<rule>`) so
 * re-running after a card save updates in place instead of duplicating.
 */
function autoRecommendations(point, preset, photos = [], today = TODAY_FALLBACK) {
  const recs = [];
