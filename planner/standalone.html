  const project = state.project;
  if (!project || !state.demandPoints.length) return null;
  return analyze({
    demandPoints: state.demandPoints,
    points: state.points,
    districts: project.districts || [],
    standardMinutes: project.standardMinutes,
    population: project.population,
    scenario: 'now',
    mode: 'day',
  });
}

 * Pomocniki lokalne (rdzenia nie ruszamy — brakujące rzeczy są tutaj)
 * ------------------------------------------------------------------ */

}

function hint(text) {

const PL_MAP = { ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z' };

function slug(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[ąćęłńóśźż]/g, (c) => PL_MAP[c] || c)
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function pick(row, keys) {
  for (const key of keys) {
    const value = row[key];
    if (value !== undefined && String(value).trim() !== '') return String(value).trim();
  }
  return '';
}

function toInt(value) {
  const digits = String(value || '').replace(/[^\d]/g, '');
  return digits ? parseInt(digits, 10) : 0;
}

function toFloat(value) {
  const num = parseFloat(String(value || '').replace(',', '.').replace(/[^\d.\-]/g, ''));
  return Number.isFinite(num) ? num : NaN;
}

function sumPopulation(districts) {
  return (districts || []).reduce((sum, d) => sum + (Number(d.population) || 0), 0);
}

/** „Tychy" → „TYCHY — Audyt 2026" (zachowuje istniejący dopisek etykiety). */
function deriveLabel(name, previousLabel) {
  const suffix =
    previousLabel && previousLabel.includes('—')
      ? previousLabel.split('—').slice(1).join('—').trim()
      : `Audyt ${String(TODAY).slice(0, 4)}`;
  const base = String(name || '').trim() || 'Projekt';

}

/* ------------------------------------------------------------------ *
 * Parsowanie plików
 * ------------------------------------------------------------------ */

/** CSV dzielnic: kolumny id;nazwa;ludnosc. */
function parseDistrictsCsv(text) {
  const out = [];
  for (const row of parseCsv(text)) {
    const name = pick(row, ['nazwa', 'name', 'dzielnica']);
    const population = toInt(pick(row, ['ludnosc', 'ludność', 'population', 'mieszkancy', 'mieszkańcy']));
    const id = slug(pick(row, ['id']) || name);
    if (!id || (!name && !population)) continue;
    out.push({ id, name: name || id, population });
  }
  return out;
}

/** CSV punktów: nazwa;adres;lat;lon;preset. */
function parsePointsCsv(text) {
  const out = [];
  for (const row of parseCsv(text)) {
    const lat = toFloat(pick(row, ['lat', 'latitude', 'szerokosc', 'szerokość', 'y']));
    const lon = toFloat(pick(row, ['lon', 'lng', 'longitude', 'dlugosc', 'długość', 'x']));
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    out.push({
      name: pick(row, ['nazwa', 'name', 'punkt', 'obiekt']),
      address: pick(row, ['adres', 'address', 'ulica']),
      presetId: pick(row, ['preset', 'presetid', 'preset_id']).toUpperCase(),
      lat,
      lon,
    });
  }
  return out;
}

/** GeoJSON punktów: FeatureCollection / Feature / geometry Point. */
function parsePointsGeoJson(text) {
  const data = JSON.parse(text);
  const features =
    data.type === 'FeatureCollection'
      ? data.features || []
      : data.type === 'Feature'
      ? [data]
      : [{ type: 'Feature', properties: {}, geometry: data }];

  const out = [];
  for (const feature of features) {
    const geometry = feature && feature.geometry;
    if (!geometry || geometry.type !== 'Point') continue;
    const [lon, lat] = geometry.coordinates || [];
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    const props = feature.properties || {};
    out.push({
      name: props.name || props.nazwa || props.title || '',
      address: props.address || props.adres || props['addr:street'] || '',
      presetId: String(props.preset || props.presetId || '').toUpperCase(),
      lat,
      lon,
    });
  }
  return out;
}

      map.destroy();
    } catch (err) {
      console.warn('map.destroy() failed', err);
    }

  }

      const presetRaw = pick(row, ['preset', 'presetid', 'preset_id']).toUpperCase();

      const districtId = resolveDistrict(pick(row, ['dzielnica', 'district', 'districtid']), lat, lon);

      const route = parseBool(pick(row, ['oznakowanie_dojscia', 'oznakowanie_dojścia', 'signage_route']));
      const inspection = pick(row, ['przeglad', 'przegląd', 'inspectiondue', 'przeglad_do']);
      const statusRaw = pick(row, ['status']).toLowerCase();
      const status = EXISTING_STATUSES.includes(statusRaw) ? statusRaw : null;

      const existing = id ? state.points.find((p) => p.id === id) : null;

      if (existing) {

        existing.address = address || existing.address;
        existing.districtId = districtId || existing.districtId;
        existing.presetId = presetId;
        existing.lat = lat;
        existing.lon = lon;
        // pusta komórka nie kasuje danych, które punkt już ma
        const prevAccess = existing.access || {};
        const prevSignage = existing.signage || {};
        const prevDevice = existing.device || {};
        existing.access = { ...prevAccess, always: always === null ? prevAccess.always ?? null : always };
        existing.signage = { ...prevSignage, route: route === null ? prevSignage.route ?? null : route };
        existing.device = { ...prevDevice, inspectionDue: inspection || prevDevice.inspectionDue || null };
        if (status) existing.status = status;
        upsertPoint(existing);
        updated += 1;
        continue;
      }

      const point = makePoint({
        id: id && !state.points.some((p) => p.id === id) ? id : nextId('AED'),
        name: name || 'Punkt AED z importu',
        lat,
        lon,
        presetId,
        districtId,
        kind: 'existing',
      });
      point.address = address;
      point.access = { ...point.access, always };
      point.signage = { ...point.signage, route };
      point.device = { ...point.device, inspectionDue: inspection || null };

      point.verification = { date: null, by: null, source: 'import' };

    };
    return {
      now: analyze({ ...base, scenario: 'now' }),
      plan: analyze({ ...base, scenario: 'plan' }),
    };
  };

  const gainFor = (site, points, excludeId = null) =>
    coverageGainFor(site, {
      demandPoints: state.demandPoints,
      points,
      standardMinutes,
      mode,
      excludeId,
    });

  /* ---------------- Sub bar: dwa przełączniki ---------------- */

  if (ctx.subbar && ctx.subbar.controls) {
    mount(
      ctx.subbar.controls,
      segControl(
        [
          { value: 'now', label: 'Stan obecny' },
          { value: 'plan', label: 'Plan' },
        ],
        scenario,
        async (value) => {
          state.ui.scenario = value;
          await save();
        }
      ),
      segControl(
        [
          { value: 'day', label: 'Dzień' },
          { value: 'night', label: 'Noc (24/7)' },
        ],
        mode,
        async (value) => {
          state.ui.mode = value;
          await save();
        }
      )
    );
  }

  /* ---------------- Szkielet: mapa + panel ---------------- */

  const mapEl = h('div', { class: 'map-wrap' });

  const kpiBox = h('div', { class: 'kpi-grid' });
  const gapsBox = h('div');
  const proposalsBox = h('div');

  const countInput = h('input', {
    class: 'input num',
    type: 'number',
    min: '1',
    max: '8',
    step: '1',
    value: String(Math.max(1, Math.min(8, Number(state.ui.proposeCount) || 2))),
    title: 'Ile punktów ma wybrać optymalizator',
    style: { width: '68px', flex: '0 0 68px' },
    // Bez save() przy każdym znaku: przerysowanie zabrałoby focus (i zjadło klik
    // w przycisk obok). Wartość trafia do IndexedDB przy najbliższym save().
    oninput: (e) => {
      const value = Math.max(1, Math.min(8, parseInt(e.target.value, 10) || 1));
      state.ui.proposeCount = value;
    },
  });

  const proposeBtn = h(
    'button',
    {
      class: 'btn btn--primary',
      style: { flex: '1' },
      onclick: async () => {
        const count = Math.max(1, Math.min(8, Number(state.ui.proposeCount) || 2));
        const takenByPending = new Set(state.pendingProposals.map((p) => p.candidateId));
        // proposeNewPoints() sam pomija kandydatów użytych w state.points;
        // tu dokładamy tych, którzy czekają już w pendingProposals.
        const free = (state.candidates || []).filter((c) => !takenByPending.has(c.id));

        if (!free.length) {
          toast('Brak wolnych kandydatów — wszyscy są już propozycją albo punktem.');
          return;
        }

        const picks = proposeNewPoints({
          demandPoints: state.demandPoints,
          points: state.points,
          candidates: free,
          standardMinutes,
          count,
          mode,
        });

        if (!picks.length) {
          toast('Żaden z wolnych kandydatów nie poprawia już pokrycia w tym trybie.');
          return;
        }

        state.pendingProposals = [...state.pendingProposals, ...picks];
        await save();
        toast(
          `Nowe propozycje: ${fmtNum(picks.length)} · łączny zysk ${fmtPct(
            picks.reduce((sum, p) => sum + p.gainPct, 0),
            1
          )} pokrycia.`
        );
      },
    },
    'ZAPROPONUJ NOWE PUNKTY'
  );

  const panel = h(
    'aside',
    { class: 'panel panel--metrics' },
    h(
      'div',
      { class: 'panel__head' },
      h('h3', { text: 'Wskaźniki — na żywo' }),
      h('span', { html: pillHtml(scenario === 'plan' ? 'PLAN' : 'STAN OBECNY') }),
      h('span', { html: pillHtml(mode === 'night' ? 'NOC' : 'DZIEŃ') })
    ),
    h(
      'div',
      { class: 'panel__body' },
      section('Wskaźniki — teraz → po planie', kpiBox),
      section('Luki wg dzielnic', gapsBox),
      section('Propozycje nowych punktów', proposalsBox),
      section(
        'Optymalizator pokrycia',
        h('div', { class: 'row' }, countInput, proposeBtn),
        h('p', {
          class: 'note',
          text:
            'Greedy max coverage: dla każdego kandydata liczony jest zysk z jeszcze ' +
            'niepokrytych punktów popytu, wybierany najlepszy, potem powtórka. ' +
            'Propozycje czekają na akceptację i nie wchodzą do planu przed ✓.',
        })
      ),
      h('div', { class: 'divider' }),
      h('p', {
        class: 'note',
        text:
          `Model uproszczony (SPEC §5): prędkość marszu ${fmtNum(WALK_SPEED, 0)} m/min, ` +
          `współczynnik drogi ${fmtNum(DETOUR, 2)}, promień strefy ${fmtNum(
            coverageRadiusM(standardMinutes),
            0
          )} m dla standardu ${fmtMin(standardMinutes, 0)} w jedną stronę. ` +
          'Czas liczymy dla świadka, który biegnie po AED i wraca do poszkodowanego. ' +
          'W iteracji 3 zastąpią to izochrony po sieci pieszej — wtedy strefy przestaną być okręgami.',
      })
    )
  );

  mount(root, mapEl, panel);

  /* ---------------- Malowanie panelu ---------------- */

  const paintKpis = (nowAnalysis, planAnalysis, currentAnalysis) => {
    mount(
      kpiBox,
      ...defs.map((def) => {
        const delta = kpiDelta(def, def.read(nowAnalysis), def.read(planAnalysis));
        return h(
          'div',
          { class: 'kpi' },
          h('div', { class: 'kpi__label', text: def.label }),
          h('div', { class: 'kpi__value', text: def.fmt(def.read(currentAnalysis)) }),
          h('div', { class: `kpi__delta${delta.cls}`, html: delta.html })
        );
      })
    );
  };

  const paintGaps = (currentAnalysis) => {
    const gaps = currentAnalysis.gaps;
    if (!gaps.length) {
      mount(
        gapsBox,
        h('div', {
          class: 'empty-state',
          text: 'Brak dzielnic z ludnością poza zasięgiem w tym scenariuszu.',
        })
      );
      return;
    }

    const uncoveredTotal = gaps.reduce((sum, g) => sum + g.uncoveredPeople, 0);
    mount(
      gapsBox,
      h('div', {
        class: 'note num',
        style: { marginBottom: '6px' },
        text: `${fmtNum(gaps.length)} dzielnic z luką · razem ${fmtNum(uncoveredTotal)} os. poza zasięgiem.`,
      }),
      ...gaps.map((gap, index) =>
        h(
          'div',
          { style: { padding: '8px 0', borderBottom: '1px solid var(--line)' } },
          h(
            'div',
            { class: 'row' },
            h('span', { style: { fontWeight: '500' }, text: gap.name }),
            h('span', { class: 'spacer' }),
            h('span', { class: 'muted num', text: fmtPct(gap.uncoveredPct, 0) })
          ),
          h('div', {
            class: 'muted num',
            style: { fontSize: '11.5px' },
            text:
              `${fmtNum(gap.uncoveredPeople)} os. poza · max ${fmtMin(gap.maxMin, 1)}` +
              (index < GAP_LABELS_ON_MAP ? ' · etykieta na mapie' : ''),
          }),
          h('div', { style: { marginTop: '5px' }, html: barHtml(gap.uncoveredPct, gapVariant(gap.uncoveredPct)) })
        )
      )
    );
  };

  /* ---------------- Akcje na propozycjach ---------------- */

  const acceptPending = async (candidateId) => {
    const proposal = state.pendingProposals.find((p) => p.candidateId === candidateId);
    if (!proposal) return;

    const presetId = getPreset(proposal.presetId) ? proposal.presetId : 'P1';
    const point = makePoint({
      id: nextId('NEW'),
      name: proposal.name,
      lat: proposal.lat,
      lon: proposal.lon,
      presetId,
      districtId: proposal.districtId || districtAt(proposal.lat, proposal.lon),
      kind: 'proposed',
    });
    point.status = 'accepted';
    point.candidateId = proposal.candidateId;
    point.gainPct = proposal.gainPct;
    point.gainWeight = proposal.gainWeight;
    // Szafka na elewacji i totem są z definicji dostępne całodobowo, punkt
    // w budynku publicznym — nie. Tak samo jest w danych demo.
    point.access.always = OUTDOOR_PRESETS.has(presetId);
    point.phase = OUTDOOR_PRESETS.has(presetId) ? 3 : 2;

    upsertPoint(point);
    state.pendingProposals = state.pendingProposals.filter((p) => p.candidateId !== candidateId);
    await save();
    toast(`Zaakceptowano: ${point.name} → ${point.id}. Punkt jest już w krokach 3 i 4.`);
  };

  const rejectPending = async (candidateId) => {
    const proposal = state.pendingProposals.find((p) => p.candidateId === candidateId);
    if (!proposal) return;
    state.pendingProposals = state.pendingProposals.filter((p) => p.candidateId !== candidateId);
    await save();
    toast(`Odrzucono propozycję: ${proposal.name}.`);
  };

  const setPointStatus = async (pointId, status, message) => {
    const point = getPoint(pointId);
    if (!point) return;
    point.status = status;
    upsertPoint(point);
    await save();
    toast(message.replace('%s', point.name));
  };

  /* ---------------- Karty propozycji ---------------- */

  const proposalCard = (item) => {
    const preset = getPreset(item.presetId);
    const gain = item.gain;
    const buttons = [];

    if (item.type === 'pending') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Akceptuj — punkt trafi do planu, kart i roadmapy',
            'aria-label': 'Akceptuj propozycję',
            onclick: () => acceptPending(item.candidateId),
          },
          '✓'
        ),
        h(
          'button',
          {
            class: 'btn btn--sm btn--danger',
            title: 'Odrzuć — propozycja znika z listy',
            'aria-label': 'Odrzuć propozycję',
            onclick: () => rejectPending(item.candidateId),
          },
          '✕'
        )
      );
    } else if (item.status === 'proposed') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Akceptuj — punkt wejdzie do scenariusza Plan',
            'aria-label': 'Akceptuj propozycję',
            onclick: () => setPointStatus(item.id, 'accepted', 'Zaakceptowano: %s.'),
          },
          '✓'
        ),
        h(
          'button',
          {
            class: 'btn btn--sm btn--danger',
            title: 'Odrzuć — punkt zostanie oznaczony jako odrzucony',
            'aria-label': 'Odrzuć propozycję',
            onclick: () => setPointStatus(item.id, 'rejected', 'Odrzucono: %s.'),
          },
          '✕'
        )
      );
    } else if (item.status === 'accepted') {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Cofnij akceptację — punkt wróci do propozycji',
            onclick: () => setPointStatus(item.id, 'proposed', 'Cofnięto akceptację: %s.'),
          },
          'Cofnij'
        )
      );
    } else {
      buttons.push(
        h(
          'button',
          {
            class: 'btn btn--sm',
            title: 'Przywróć propozycję do rozpatrzenia',
            onclick: () => setPointStatus(item.id, 'proposed', 'Przywrócono propozycję: %s.'),
          },
          'Przywróć'
        )
      );
    }

    return h(
      'div',
      { class: 'card', style: { marginBottom: '8px' } },
      h(
        'div',
        { class: 'row' },
        h('span', { html: dotHtml('proposed') }),
        h('span', { style: { fontWeight: '500' }, text: item.name }),
        h('span', { class: 'spacer' }),
        h('span', { html: pillHtml(item.statusLabel, item.statusVariant) })
      ),
      h('div', {
        class: 'muted',
        style: { fontSize: '11.5px', marginTop: '3px' },
        text:
          `${preset ? `${preset.id} · ${preset.name} · ${fmtCost(preset.cost)}` : 'brak presetu'} · ` +
          `${districtName(item.districtId)}`,
      }),
      h(
        'div',
        { class: 'row', style: { marginTop: '8px' } },
        h('span', {
          class: 'num',
          style: { fontWeight: '600' },
          text: `+${fmtPct(gain.gainPct, 1)} pokrycia`,
        }),
        h('span', { class: 'muted num', style: { fontSize: '11.5px' }, text: `(${fmtNum(gain.gainWeight)} os.)` }),
        h('span', { class: 'spacer' }),
        ...buttons
      ),
      item.type === 'pending'
        ? h('div', {
            class: 'note',
            style: { marginTop: '6px' },
            text: 'Czeka na decyzję — nie jest jeszcze punktem projektu. Pin przeciągasz na mapie.',
          })
        : null
    );
  };

  const paintProposals = (points, pending) => {
    const items = [];

    for (const proposal of pending) {
      const meta0 = statusMeta({ kind: 'proposed', status: 'proposed' });
      items.push({
        type: 'pending',
        candidateId: proposal.candidateId,
        name: proposal.name,
        presetId: proposal.presetId,
        districtId: proposal.districtId,
        statusLabel: meta0.label,
        statusVariant: meta0.variant,
        gain: gainFor({ lat: proposal.lat, lon: proposal.lon }, points),
      });
    }

    const order = { proposed: 0, accepted: 1, rejected: 2 };
    const proposedPoints = points
      .filter((p) => p.kind === 'proposed' && order[p.status] !== undefined)
      .sort((a, b) => order[a.status] - order[b.status]);

    for (const point of proposedPoints) {
      const meta0 = statusMeta(point);
      items.push({
        type: 'point',
        id: point.id,
        status: point.status,
        name: point.name,
        presetId: point.presetId,
        districtId: point.districtId,
        statusLabel: meta0.label,
        statusVariant: meta0.variant,
        // Zysk liczony na żywo: ile ten punkt dokłada ponad resztę planu.
        gain: gainFor({ lat: point.lat, lon: point.lon }, points, point.id),
      });
    }

    if (!items.length) {
      mount(
        proposalsBox,
        h('div', {
          class: 'empty-state',
          text: 'Brak propozycji — użyj przycisku „ZAPROPONUJ NOWE PUNKTY" poniżej.',
        })
      );
      return;
    }

    mount(proposalsBox, ...items.map(proposalCard));
  };

  /**
   * Przemalowanie całego panelu dla podanej (być może tymczasowej) listy punktów.
   * Zwraca analizę bieżącego scenariusza — mapa korzysta z niej przy pierwszym renderze.
   */
  const paintPanel = (points, pending) => {
    const { now, plan } = analysesFor(points);
    const current = scenario === 'plan' ? plan : now;
    paintKpis(now, plan, current);
    paintGaps(current);
    paintProposals(points, pending);
    return current;
  };

  const analysis = paintPanel(state.points, state.pendingProposals);

  if (ctx.setMeta) {
    ctx.setMeta(
      `${fmtNum(analysis.activeCount)} czynnych AED · pokrycie ${fmtPct(analysis.coveragePct, 0)} · ` +
        `luki w ${fmtNum(analysis.gaps.length)} dzielnicach · promień ${fmtNum(analysis.radiusM, 0)} m`
    );
  }

  /* ---------------- Mapa ---------------- */

  if (map) {
    map.destroy();
    map = null;
  }

  map = createMap(mapEl, { center: project.center || undefined, zoom: project.zoom || undefined });

  mapEl.appendChild(
    h('div', {
      class: 'map-hint',
      text: 'Przeciągnij kwadratowy pin propozycji — wskaźniki liczą się na żywo.',
    })
  );

  mapEl.appendChild(
    h(
      'div',
      { class: 'map-legend' },
      h('b', { text: 'Analiza dostępności' }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('ok')}<span>punkt popytu w zasięgu</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('warn')}<span>blisko granicy standardu</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('crit')}<span>poza zasięgiem</span>` }),
      h('div', { class: 'map-legend__row', html: `${dotHtml('proposed')}<span>propozycja (przeciągalna)</span>` }),
      h('div', {
        class: 'note',
        style: { marginTop: '4px' },
        text:
          `Kryterium: ${fmtNum(analysis.radiusM, 0)} m od czynnego AED ` +
          `(${fmtMin(standardMinutes, 0)} dojścia w jedną stronę).`,
      })
    )
  );

  mapEl.appendChild(
    h(
      'div',
      { class: 'map-toolbar' },
      h('span', {
        class: 'pill pill--warn',
        style: { padding: '5px 10px', lineHeight: '1.35', maxWidth: '260px', whiteSpace: 'normal', textAlign: 'right' },
        text: 'DO OPRACOWANIA W ITERACJI 3 — izochrony po rzeczywistej sieci pieszej',
      }),
      disabledControl(
        h('button', { class: 'btn btn--sm' }, 'IZOCHRONY — SIEĆ PIESZA'),
        'poza zakresem iteracji 2'
      )
    )
  );

  /** Piny: istniejące (statyczne) + propozycje (przeciągalne). */
  const buildPins = () => {
    const pins = state.points
      .filter((p) => p.kind === 'existing' && p.status !== 'rejected')
      .map((p) => ({
        id: p.id,
        lat: p.lat,
        lon: p.lon,
        level: pointStatusLevel(p, completeness(p, getPreset(p.presetId), state.photos).pct),
        name: p.name,
        draggable: false,
      }));

    for (const p of state.points) {
      if (p.kind !== 'proposed' || p.status === 'rejected') continue;
      pins.push({
        id: p.id,
        lat: p.lat,
        lon: p.lon,
        level: 'proposed',
        name: `${p.name} — propozycja`,
        draggable: true,
      });
    }

    for (const proposal of state.pendingProposals) {
      pins.push({
        id: pendingPinId(proposal),
        lat: proposal.lat,
        lon: proposal.lon,
        level: 'proposed',
        name: `${proposal.name} — propozycja (czeka na decyzję)`,
        draggable: true,
      });
    }

    return pins;
  };

  /** Etykiety „LUKA: …" w centroidach trzech najgorszych dzielnic. */
  const buildGapLabels = (currentAnalysis) => {
    const features = (state.districtsGeo && state.districtsGeo.features) || [];
    return currentAnalysis.gaps
      .slice(0, GAP_LABELS_ON_MAP)
      .map((gap) => {
        const feature = features.find((f) => f.properties.id === gap.districtId);
        if (!feature) return null;
        const centre = ringCentroid(feature.geometry.coordinates[0]);
        return { lat: centre.lat, lon: centre.lon, text: `LUKA: ${gap.name}`, kind: 'gap' };
      })
      .filter(Boolean);
  };

  map.setScene({
    boundary: state.boundary,
    districts: state.districtsGeo,
    showDistricts: true,
    // Okręgi stref wyłączone na życzenie: przy kilkunastu punktach zlewały się
    // w plamę i zasłaniały punkty popytu, które niosą tę samą informację
    // dokładniej (kolor = w zasięgu / blisko granicy / poza). Dane zostają —
    // wystarczy przywrócić showCoverage: true, żeby wrócić do okręgów.
    coverage: [],
    showCoverage: false,
    demand: analysis.demandStatus,
    showDemand: true,
    targetMinutes: standardMinutes,
    points: buildPins(),
    labels: buildGapLabels(analysis),
    selectedId: state.ui.selectedPointId,
  });
  map.fit();

  /* ---------------- Interakcje mapy ---------------- */

  map.on('pointclick', (pin) => {
    if (isPendingPin(pin.id)) {
      toast('Propozycja czeka na decyzję — po ✓ dostanie własną kartę punktu.');
      return;
    }
    ctx.navigate(`#/card/${encodeURIComponent(pin.id)}`);
  });

  // Przeciąganie na żywo: liczymy na tymczasowej kopii i przemalowujemy panel.
  // Nic nie trafia do IndexedDB — zapis dopiero w pointdragend.
  let lastDrag = null;
  map.on('pointdrag', (pin) => {
    lastDrag = pin;
    if (dragTimer) return;
    dragTimer = setTimeout(() => {
      dragTimer = null;
      const moved = lastDrag;
      lastDrag = null;
      if (!moved) return;
      const points = state.points.map((p) =>
        p.id === moved.id ? { ...p, lat: moved.lat, lon: moved.lon } : p
      );
      const pending = state.pendingProposals.map((p) =>
        pendingPinId(p) === moved.id ? { ...p, lat: moved.lat, lon: moved.lon } : p
      );
      paintPanel(points, pending);
    }, DRAG_THROTTLE_MS);
  });

  map.on('pointdragend', async (pin) => {
    if (dragTimer) {
      clearTimeout(dragTimer);
      dragTimer = null;
    }
    lastDrag = null;

    if (isPendingPin(pin.id)) {
      const proposal = state.pendingProposals.find((p) => pendingPinId(p) === pin.id);
      if (!proposal) return;
      proposal.lat = pin.lat;
      proposal.lon = pin.lon;
      proposal.districtId = districtAt(pin.lat, pin.lon) || proposal.districtId;
      const gain = gainFor({ lat: proposal.lat, lon: proposal.lon }, state.points);
      proposal.gainPct = gain.gainPct;
      proposal.gainWeight = gain.gainWeight;
      await save();
      toast(`${proposal.name}: +${fmtPct(gain.gainPct, 1)} pokrycia w nowym miejscu.`);
      return;
    }

    const point = getPoint(pin.id);
    if (!point) return;
    point.lat = pin.lat;
    point.lon = pin.lon;
    point.districtId = districtAt(pin.lat, pin.lon) || point.districtId;
    if (point.kind === 'proposed') {
      const gain = gainFor({ lat: point.lat, lon: point.lon }, state.points, point.id);
      point.gainPct = gain.gainPct;
      point.gainWeight = gain.gainWeight;
    }
    upsertPoint(point);
    await save();
    toast(`Przesunięto: ${point.name} · ${districtName(point.districtId)}.`);
  });
}

function destroy() {
  if (dragTimer) {
    clearTimeout(dragTimer);
    dragTimer = null;
  }
  if (map) {
    try {
      map.destroy();
    } catch (err) {
      console.warn('map.destroy() failed', err);
    }
    map = null;
  }
}

return { destroy, meta, render };
};

__defs['js/views/cards.js'] = function () {
/**
 * views/cards.js — Krok 3: Lista kart punktów (SPEC §6.4, trasa '#/cards').
 *
 * Jedna tabela pełnej szerokości ze wszystkimi kartami audytu: kompletność,
 * liczba rekomendacji i status każdego punktu obok siebie. Stąd operator wchodzi
 * w konkretną kartę (`#/card/:id`) — klikiem w wiersz albo przyciskiem OTWÓRZ.
 *
 * Wszystkie liczby pochodzą z modelu (`completeness`) i ze stanu
 * (`recommendationsForPoint`) — w HTML nie ma ani jednej wpisanej na sztywno.
 * Formatowanie wyłącznie przez fmtPct/fmtNum.
 *

  step: 3,
  title: 'Karty punktów',
  subtitle: 'co zrobić',
  layout: 'scroll',
  chrome: 'full',
};

/* ------------------------------------------------------------------ *
 * Stałe widoku
 * ------------------------------------------------------------------ */

/** Kolumny eksportu CSV (wartości surowe — plik ma być czytany maszynowo). */
const CSV_HEADERS = [
  'id',
  'nazwa',
  'preset',
  'dzielnica',
  'kompletnosc_pct',
  'rekomendacje',
  'status',
];

/** Segmented control [Wszystkie | Istniejące | Nowe] — id trafia do state.ui.cardsFilter. */
const KIND_FILTERS = [
  { id: 'all', label: 'Wszystkie', test: () => true },
  { id: 'existing', label: 'Istniejące', test: (row) => row.point.kind === 'existing' },
  { id: 'proposed', label: 'Nowe', test: (row) => row.point.kind === 'proposed' },
];

const KIND_LABEL = { existing: 'istniejący', proposed: 'nowy' };

const SORTS = [
  { id: 'completeness', label: 'Sortuj: kompletność rosnąco' },
  { id: 'recommendations', label: 'Sortuj: rekomendacje malejąco' },
  { id: 'name', label: 'Sortuj: alfabetycznie (A–Z)' },
];

const PRIORITY_ORDER = { high: 3, medium: 2, low: 1 };

/** Progi paska kompletności. Kolor niesie wyłącznie informację o danych. */
const PCT_OK = 100;
const PCT_WARN = 60;

const REASON_FIELD_FORM = 'opcja poza MVP';

/* ------------------------------------------------------------------ *
 * Stan lokalny widoku (to nie są dane projektu — nie trafia do state)
 * ------------------------------------------------------------------ */

let presetFilter = 'all';
let districtFilter = 'all';
let onlyGaps = false;
let sortKey = SORTS[0].id;

/** Zaznaczone wiersze; zawsze przycinane do aktualnie widocznych. */
const selected = new Set();

/** Uchwyty DOM potrzebne do przerysowania samego <tbody>. */
let refs = null;

/* ------------------------------------------------------------------ *
 * Pomocniki lokalne (rdzenia nie ruszamy — brakujące rzeczy są tutaj)
 * ------------------------------------------------------------------ */

/** Polska odmiana rzeczownika po liczebniku. */
function plural(n, [one, few, many]) {
  const abs = Math.abs(n);
  if (abs === 1) return one;
  const rest100 = abs % 100;
  const rest10 = abs % 10;
  if (rest100 > 10 && rest100 < 20) return many;
  return rest10 >= 2 && rest10 <= 4 ? few : many;
}

/** Mianownik: „1 karta · 3 karty · 19 kart". */

/** Biernik po „wyeksportowano": „1 kartę · 3 karty · 19 kart". */
const cardsAcc = (n) => plural(n, ['kartę', 'karty', 'kart']);

function byName(a, b) {

}

function barVariant(pct) {

  if (pct >= PCT_WARN) return 'warn';

/** Aktualny wariant segmentu — z odpornością na nieznaną wartość w stanie. */

/**
 * Wiersz tabeli policzony z modelu.

 * pustej listy wymagań 100%, co pokazywałoby niezweryfikowany punkt z OSM jako

    pct,

}

      (row) =>

 * Widok
 * ------------------------------------------------------------------ */

async function render(root, ctx) {

      root,
      h('div', { class: 'empty-state', text: 'Brak aktywnego projektu — wróć do pulpitu i otwórz audyt.' })

    return;
  }

      root,
      h(
        'div',
        { class: 'empty-state' },
        h('p', { text: 'Rejestr punktów jest pusty — nie ma jeszcze żadnej karty do uzupełnienia.' }),
        h('button', { class: 'btn', onclick: () => ctx.navigate('#/inventory') }, 'PRZEJDŹ DO INWENTARYZACJI')

    ],

      redrawBody();
    }
  );

    'div',

  );

    type: 'checkbox',

        position: 'sticky',
        bottom: '20px',

        background: 'var(--white)',

  );

        h(
          'tr',
          {},

            'td',
            { colspan: '7' },

        onclick: () => openCard(point.id),
      },
      h('td', { onclick: (e) => e.stopPropagation() }, check),
      h(
        'td',
        {},
        h('div', {
          class: 'row',
          html: `${dotHtml(row.status.level)}<span class="table__main">${escapeHtml(point.name)}</span>`,
        }),
        h('div', { class: 'table__sub', text: subParts.join(' · ') })
      ),
      row.preset
        ? h(
            'td',
            {},
            h('div', { text: row.preset.name }),
            h('div', { class: 'table__sub', text: row.preset.id })
          )
        : h('td', { class: 'muted', text: '—' }),
      completenessCell(row),
      recommendationsCell(row),
      h('td', { html: pillHtml(row.status.label, row.status.variant) }),
      h('td', { style: { textAlign: 'right' } }, openBtn)
    );
  }

    if (row.pct === null) {
      return h(
        'td',
        {},
        h('div', { class: 'muted', text: '—' }),
        h('div', { class: 'table__sub', text: 'brak presetu — nie ma czego mierzyć' })
      );

      'td',
      {},
      h('div', { style: { marginBottom: '4px' }, html: barHtml(row.pct, barVariant(row.pct)) }),

        class: 'table__sub num',
        text: `${fmtPct(row.pct)} · ${fmtNum(row.score.filled)}/${fmtNum(row.score.required)}`,

    );
  }

  function recommendationsCell(row) {
    if (!row.recs.length) return h('td', { class: 'muted', text: '—' });

      'td',
      {},
      h('div', {
        class: 'row',
        html:

            class: 'table__sub',
            text: `${fmtNum(row.doneCount)} już ${plural(row.doneCount, ['zrobiona', 'zrobione', 'zrobionych'])}`,

    );

    if (on) selected.add(id);

    const tr = tbody.querySelector(`tr[data-point-id="${CSS.escape(id)}"]`);

    counter.textContent = count
      ? `Zaznaczono: ${fmtNum(count)} z ${fmtNum(total)} kart`
      : `Zaznaczono: 0 · eksport obejmie wszystkie widoczne (${fmtNum(total)} ${cards(total)})`;

    exportBtn.disabled = total === 0;
    exportBtn.classList.toggle('is-disabled', total === 0);
    exportBtn.title = total
      ? 'Eksportuje zaznaczone wiersze, a bez zaznaczenia — wszystkie widoczne'
      : 'Brak wierszy do eksportu przy tych filtrach';
  }

  /* ---------------- sub bar ---------------- */

  function updateSubbarMeta(visible) {
    if (!ctx.setMeta) return;
    const measured = visible.filter((row) => row.pct !== null);
    const avg = measured.length ? measured.reduce((sum, row) => sum + row.pct, 0) / measured.length : 0;
    const scope =
      visible.length === allRows.length
        ? `${fmtNum(visible.length)} ${cards(visible.length)}`
        : `${fmtNum(visible.length)} z ${fmtNum(allRows.length)} kart`;
    ctx.setMeta(`${scope} · średnia kompletność ${fmtPct(avg)}`);

    const chosen = view.visible.filter((row) => selected.has(row.point.id));
    const rows = chosen.length ? chosen : view.visible;
    if (!rows.length) {

      row.point.id,
      row.point.name,
      row.preset ? row.preset.name : '',
      row.point.districtId ? row.district : '',
      row.pct === null ? '' : row.pct,
      row.recs.length,
      row.status.label,
    ]);

      `karty-punktow-${state.project.id}-${TODAY}.csv`,
      toCsv(CSV_HEADERS, body),
      'text/csv;charset=utf-8'
    );

      `Wyeksportowano ${fmtNum(rows.length)} ${cardsAcc(rows.length)} do CSV ` +
        `(${chosen.length ? 'zaznaczone' : 'wszystkie widoczne'}).`
    );
  }
}

 * Sprzątanie
 * ------------------------------------------------------------------ */

  // węzłów. Zaznaczenie zostaje — powrót z karty punktu zastaje tę samą listę.

/** Które sekcje karty nie dotyczą punktu, który jeszcze nie istnieje w terenie. */

/** Pola wymagane presetu → sekcja, która za nie odpowiada. */

  3: ['access'],
  4: ['keeper'],
  5: ['signage'],
  6: ['device', 'technical'],
  7: ['dispatcherRegistered'],

  access: 3,
  keeper: 4,
  signage_route: 5,
  signage_device: 5,
  inspection: 6,
  dispatcher: 7,
};

];

const PRIORITY_OPTIONS = ['high', 'medium', 'low'];

const MONTHS_PL = [
  'styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec',
  'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień',

/* ------------------------------------------------------------------ *
 * Stan lokalny modułu (przeżywa przerysowania widoku)
 * ------------------------------------------------------------------ */

let saveTimer = null;
let focusMemo = null;
let scrollMemo = null;
let photosModulePromise = null;

/**
 * js/photos.js powstaje równolegle. Import jest dynamiczny i buforowany, żeby
 * przy każdym przerysowaniu karty nie dobijać się o plik, którego może nie być.
 * Brak modułu = komunikat w sekcji zdjęć, reszta karty działa normalnie.
 */
function loadPhotosModule() {
  if (!photosModulePromise) {
    photosModulePromise = Promise.resolve(__req('js/photos.js')).catch(() => null);
  }
  return photosModulePromise;
}

/* ------------------------------------------------------------------ *
 * Pomocniki lokalne (rdzenia nie ruszamy)
 * ------------------------------------------------------------------ */

function readPath(obj, path) {
  return path.split('.').reduce((acc, key) => (acc == null ? acc : acc[key]), obj);
}

/** Zapis w głąb obiektu punktu; brakujące gałęzie są dotwarzane. */
function writePath(obj, path, value) {
  const keys = path.split('.');
  let node = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (node[keys[i]] == null || typeof node[keys[i]] !== 'object') node[keys[i]] = {};
    node = node[keys[i]];
  }
  node[keys[keys.length - 1]] = value;
}

/** Puste pole trzymamy jako null — tak samo traktuje je completeness(). */
function normalizeText(raw) {
  return raw === '' ? null : raw;
}

function fieldId(key) {
  return `card-f-${String(key).replace(/[^\w-]/g, '-')}`;
}

/** '2026-03' → 'marzec 2026'; puste → '—'. */
function monthLabel(value) {
  if (!value) return '—';
  const [year, month] = String(value).slice(0, 7).split('-');
  const index = Number(month) - 1;
  if (!year || Number.isNaN(index) || !MONTHS_PL[index]) return String(value);
  return `${MONTHS_PL[index]} ${year}`;
}

/** Czy termin (YYYY-MM) minął względem TODAY z config.js. */
function isOverdueMonth(value) {
  if (!value) return false;
  return String(value).slice(0, 7) < String(TODAY).slice(0, 7);
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    save();
  }, TEXT_DEBOUNCE_MS);
}

async function saveNow() {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
  }
  await save();
}

/**
 * save() przerysowuje cały widok, więc przed zapisem zapamiętujemy, gdzie stał
 * kursor, a po przerysowaniu wracamy w to samo miejsce.
 */
function rememberFocus(node, pointId) {
  let start = null;
  let end = null;
  try {
    start = node.selectionStart;
    end = node.selectionEnd;
  } catch (err) {
    // input[type=month|number] nie wspiera zaznaczenia — to nie jest błąd
    start = null;
    end = null;
  }
  focusMemo = { pointId, key: node.dataset ? node.dataset.fkey : null, start, end, at: Date.now() };
}

/** To samo dla przewinięcia kolumny sekcji — inaczej zapis odrzucałby na górę karty. */
function rememberScroll(node, pointId) {
  scrollMemo = { pointId, top: node.scrollTop };
}

function restoreScroll(node, pointId) {
  if (!scrollMemo || scrollMemo.pointId !== pointId) return;
  node.scrollTop = scrollMemo.top;
}

function restoreFocus(root, pointId) {
  const memo = focusMemo;
  focusMemo = null;
  if (!memo || !memo.key || memo.pointId !== pointId) return;
  if (Date.now() - memo.at > FOCUS_TTL_MS) return;
  const node = root.querySelector(`[data-fkey="${memo.key}"]`);
  if (!node) return;
  node.focus();
  if (memo.start !== null && typeof node.setSelectionRange === 'function') {
    try {
      node.setSelectionRange(memo.start, memo.end);
    } catch (err) {
      /* pole bez zaznaczenia — wystarczy sam fokus */
    }
  }
}

/* ------------------------------------------------------------------ *
 * Klocki formularza
 * ------------------------------------------------------------------ */

function field(label, control, hint, forId) {
  return h(
    'div',
    { class: 'field' },
    h('label', { class: 'field__label', for: forId || null, text: label }),
    control,
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/**
 * Pole tekstowe / textarea / input[type=month] podpięte do ścieżki w punkcie.
 * Zmiana leci od razu do state, save() jest opóźniony (SPEC §6.5).
 */
function textField({
  point,
  path,
  label,
  hint,
  type = 'text',
  placeholder = '',
  textarea = false,
  disabled = false,
  readonly = false,
  display = null,
}) {
  const id = fieldId(path);
  const raw = readPath(point, path);
  const value = display !== null ? display : raw == null ? '' : String(raw);

  const props = {
    class: textarea ? 'textarea' : 'input',
    id,
    dataset: { fkey: path },
    placeholder: placeholder || null,
    disabled: disabled || null,
    readonly: readonly || null,
  };

  const control = textarea
    ? h('textarea', props, value)
    : h('input', { ...props, type, value });

  if (!disabled && !readonly) {
    control.addEventListener('input', (event) => {
      rememberFocus(event.target, point.id);
      writePath(point, path, normalizeText(event.target.value));
      upsertPoint(point);
      scheduleSave();
    });
  }

  return field(label, control, hint, id);
}

/** Select podpięty do ścieżki w punkcie — zapis natychmiastowy. */
function selectField({ point, path, label, hint, options, disabled = false, onPick = null }) {
  const id = fieldId(path);
  const value = readPath(point, path);
  const control = h(
    'select',
    { class: 'select', id, dataset: { fkey: path }, disabled: disabled || null },
    ...options.map((option) =>
      h('option', { value: option.value, selected: String(option.value) === String(value ?? '') }, option.label)
    )
  );

  if (!disabled) {
    control.addEventListener('change', async (event) => {
      rememberFocus(event.target, point.id);
      const picked = event.target.value === '' ? null : event.target.value;
      if (onPick) onPick(picked);
      else writePath(point, path, picked);
      upsertPoint(point);
      await saveNow();
    });
  }

  return field(label, control, hint, id);
}

/** Trzy stany: tak / nie / brak danych (null). Zapis natychmiastowy. */
function triStateField({ point, path, label, hint, disabled = false }) {
  const value = readPath(point, path) ?? null;
  const name = `card-${path.replace(/\./g, '-')}`;
  const options = [
    { v: true, l: 'tak' },
    { v: false, l: 'nie' },
    { v: null, l: 'brak danych' },
  ];

  const row = h(
    'div',
    { class: 'radio-row' },
    ...options.map((option) => {
      const id = `${name}-${String(option.v)}`;
      const input = h('input', {
        type: 'radio',
        name,
        id,
        dataset: { fkey: `${path}:${String(option.v)}` },
        checked: value === option.v,
        disabled: disabled || null,
      });
      if (!disabled) {
        input.addEventListener('change', async () => {
          rememberFocus(input, point.id);
          writePath(point, path, option.v);
          upsertPoint(point);
          await saveNow();
        });
      }
      return h('label', { class: 'checkline', for: id }, input, h('span', { text: option.l }));
    })
  );

  return h(
    'div',
    { class: 'field' },
    h('span', { class: 'field__label', text: label }),
    row,
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/** Checkbox z trzecim stanem „brak danych" pokazywanym jako indeterminate. */
function checkboxField({ point, path, label, hint, disabled = false }) {
  const value = readPath(point, path) ?? null;
  const id = fieldId(path);
  const input = h('input', {
    type: 'checkbox',
    id,
    dataset: { fkey: path },
    checked: value === true,
    disabled: disabled || null,
  });
  if (value === null) input.indeterminate = true;

  if (!disabled) {
    input.addEventListener('change', async () => {
      rememberFocus(input, point.id);
      writePath(point, path, input.checked);
      upsertPoint(point);
      await saveNow();
    });
  }

  return h(
    'div',
    { class: 'field' },
    h('label', { class: 'checkline', for: id }, input, h('span', { text: label })),
    hint ? h('span', { class: 'field__hint', text: hint }) : null
  );
}

/* ------------------------------------------------------------------ *
 * Rekomendacje — scalenie auto + zapisanych
 * ------------------------------------------------------------------ */

/** Kopia rekomendacji bez pól pomocniczych widoku. */
function cleanRec(rec) {
  const { persisted, stale, ...rest } = rec;
  return rest;
}

/**
 * autoRecommendations() + pozycje już zapisane w state, scalone po id.
 * Z zapisanej wersji zachowujemy `done`, `phase` i ramy czasowe roadmapy.
 * Pozycje auto, których reguła już nie obowiązuje, zostają na liście
 * oznaczone jako nieaktualne — nie kasujemy ich za plecami operatora.
 */
function mergeRecommendations(point, preset) {
  const stored = recommendationsForPoint(point.id);
  const byId = new Map(stored.map((r) => [r.id, r]));
  const autos = autoRecommendations(point, preset, state.photos);
  const autoIds = new Set(autos.map((r) => r.id));

  const merged = autos.map((auto) => {
    const prev = byId.get(auto.id);
    if (!prev) return { ...auto, persisted: false, stale: false };
    return {
      ...auto,
      done: prev.done === true,
      phase: prev.phase ?? null,
      startMonth: prev.startMonth,
      lengthMonths: prev.lengthMonths,
      persisted: true,
      stale: false,
    };
  });

  for (const rec of stored) {
    if (autoIds.has(rec.id)) continue;
    merged.push({ ...rec, persisted: true, stale: rec.auto === true });
  }

  const rank = { high: 0, medium: 1, low: 2 };
  return merged.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (rank[a.priority] ?? 3) - (rank[b.priority] ?? 3);
  });
}

/** Dopisuje do state pozycje automatyczne, których jeszcze tam nie ma. */
function persistAutoRecommendations(merged) {
  let added = 0;
  for (const rec of merged) {
    if (rec.persisted || rec.stale) continue;
    upsertRecommendation(cleanRec(rec));
    added += 1;
  }
  return added;
}

async function addManualRecommendation(point) {
  const textEl = h('textarea', { class: 'textarea', placeholder: 'Co dokładnie trzeba zrobić w tym punkcie?' });
  const priorityEl = h(
    'select',
    { class: 'select' },
    ...PRIORITY_OPTIONS.map((p) => h('option', { value: p, selected: p === 'medium' }, PRIORITY_LABEL[p]))
  );
  const costEl = h('input', { class: 'input', type: 'number', min: '0', step: '100', value: '0' });
  const ownerEl = h(
    'select',
    { class: 'select' },
    ...OWNER_OPTIONS.map((o) => h('option', { value: o.value }, o.label))
  );

  const body = h(
    'div',
    { class: 'stack' },
    field('Treść pozycji', textEl),
    field('Priorytet', priorityEl),
    field('Koszt (zł)', costEl, 'Wpisz 0, jeśli pozycja nie generuje kosztu.'),
    field('Odpowiedzialny', ownerEl)
  );

  const confirmed = await modal({
    title: 'Nowa pozycja checklisty',
    body,
    confirmLabel: 'Dodaj pozycję',
  });
  if (!confirmed) return;

  const text = textEl.value.trim();
  if (!text) {
    toast('Pozycja bez treści nie została dodana.');
    return;
  }

  upsertRecommendation({
    id: `man-${point.id}-${Date.now().toString(36)}`,
    pointId: point.id,
    text,
    priority: priorityEl.value,
    cost: Number(costEl.value) || 0,
    owner: ownerEl.value,
    phase: null,
    auto: false,
    done: false,
  });
  await saveNow();
  toast('Dodano pozycję do checklisty punktu.');
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */

async function render(root, ctx) {
  const project = state.project;
  const point = getPoint(ctx.params && ctx.params.id);

  if (!project || !point) {
    mount(
      root,
      h(
        'div',
        { style: { padding: '20px', width: '100%' } },
        h(
          'div',
          { class: 'empty-state' },
          h('p', { text: `Nie znaleziono punktu o identyfikatorze „${(ctx.params && ctx.params.id) || '—'}".` }),
          h('p', { class: 'note', text: 'Punkt mógł zostać usunięty albo link jest nieaktualny.' }),
          h(
            'button',
            { class: 'btn btn--primary', style: { marginTop: '10px' }, onclick: () => ctx.navigate('#/cards') },
            '← WRÓĆ DO LISTY KART'
          )
        )
      )
    );
    return;
  }

  if (!(project.stepsDone || []).includes(3)) {
    markStepDone(3);
    await save({ silent: true });
  }

  /* ---------------- Moduł zdjęć (budowany równolegle) ---------------- */

  const photosApi = await loadPhotosModule();

  /* ---------------- Dane wyliczone (zawsze z model.js) ---------------- */

  const preset = getPreset(point.presetId);
  const comp = completeness(point, preset, state.photos);
  const status = statusMeta(point, comp.pct);
  const isProposed = point.kind === 'proposed';
  const standardMinutes = project.standardMinutes;
  const radiusM = coverageRadiusM(standardMinutes);
  const merged = mergeRecommendations(point, preset);
  const openRecs = merged.filter((r) => !r.done);
  const pointPhotos = state.photos.filter((ph) => ph.pointId === point.id);

  state.ui.selectedPointId = point.id;

  /* ---------------- Poziom paska statusu sekcji ---------------- */

  const openRuleSections = new Set(
    openRecs.filter((r) => r.rule && RULE_SECTION[r.rule]).map((r) => RULE_SECTION[r.rule])
  );

  const missesRequired = (num) => {
    const prefixes = SECTION_PATHS[num] || [];
    return comp.missingFields.some((path) =>
      prefixes.some((prefix) => path === prefix || path.startsWith(`${prefix}.`))
    );
  };

  // Miękkie braki: pola nieobowiązkowe dla presetu i terminy po dacie TODAY.
  const softGap = {
    1: !point.address || !point.placement || !point.districtId || comp.missingPhotos.length > 0,
    3: (point.access?.always ?? null) === null || !point.access?.hours || !point.access?.weekend,
    4: !point.keeper?.person || !point.keeper?.contact,
    5: (point.signage?.atDevice ?? null) === null || (point.signage?.route ?? null) === null,
    6:
      !point.device?.padsDue ||
      isOverdueMonth(point.device?.inspectionDue) ||
      isOverdueMonth(point.device?.padsDue),
    7: point.dispatcherRegistered !== true,
  };

  const levelOf = (num) => {
    if (isProposed && INERT_FOR_PROPOSED.has(num)) return '';
    if (missesRequired(num)) return 'crit';
    if (openRuleSections.has(num) || softGap[num]) return 'warn';
    return '';
  };

  /* ---------------- Sub bar ---------------- */

  if (ctx.setMeta) {
    ctx.setMeta(
      `${point.id} · kompletność ${fmtPct(comp.pct, 0)} · ` +
        `rekomendacje otwarte: ${fmtNum(openRecs.length)} z ${fmtNum(merged.length)}`
    );
  }

  if (ctx.subbar && ctx.subbar.controls) {
    const order = state.points.map((p) => p.id);
    const index = order.indexOf(point.id);
    const goto = (offset) => {
      const target = order[index + offset];
      if (target) ctx.navigate(`#/card/${encodeURIComponent(target)}`);
    };

    const prevBtn = h('button', { class: 'btn btn--sm', onclick: () => goto(-1) }, '← Poprzedni');
    const nextBtn = h('button', { class: 'btn btn--sm', onclick: () => goto(1) }, 'Następny →');
    if (index <= 0) {
      prevBtn.setAttribute('disabled', '');
      prevBtn.setAttribute('data-tip', 'to pierwszy punkt na liście');
    }
    if (index < 0 || index >= order.length - 1) {
      nextBtn.setAttribute('disabled', '');
      nextBtn.setAttribute('data-tip', 'to ostatni punkt na liście');
    }

    mount(
      ctx.subbar.controls,
      prevBtn,
      nextBtn,
      h('button', { class: 'btn btn--sm', onclick: () => ctx.navigate('#/cards') }, 'LISTA KART')
    );
  }

  /* ================================================================ *
   * SEKCJA 1 — Identyfikacja
   * ================================================================ */

  const photoBox = h('div', { class: 'stack' });

  const paintPhotoFallback = (reason) => {
    const missingRoles = comp.missingPhotos.map(photoRoleLabel);
    mount(
      photoBox,
      h('div', { class: 'note', text: reason }),
      preset && (preset.requiredPhotos || []).length
        ? h('div', {
            class: 'note',
            text:
              `Preset ${preset.id} wymaga zdjęć: ${(preset.requiredPhotos || []).map(photoRoleLabel).join(', ')}. ` +
              `Wgranych przy tym punkcie: ${fmtNum(pointPhotos.length)}.`,
          })
        : null,
      missingRoles.length
        ? h('div', { class: 'note', text: `Brakuje: ${missingRoles.join(', ')} — kompletność karty jest o to obniżona.` })
        : null
    );
  };

  if (photosApi && typeof photosApi.renderPhotoSlots === 'function') {
    try {
      photosApi.renderPhotoSlots(photoBox, point, preset, {
        onChange: async () => {
          await saveNow();
        },
      });
    } catch (err) {
      console.warn('renderPhotoSlots() nie powiodło się', err);
      paintPhotoFallback('Moduł zdjęć niedostępny');
    }
  } else {
    paintPhotoFallback('Moduł zdjęć niedostępny');
  }

  const districtOptions = [
    { value: '', label: '— nie przypisano —' },
    ...(project.districts || []).map((d) => ({ value: d.id, label: d.name })),
  ];

  const section1 = cardSection({
    num: 1,
    title: 'Identyfikacja',
    level: levelOf(1),
    children: [
      textField({ point, path: 'name', label: 'Nazwa punktu', placeholder: 'np. SP nr 7 — hol główny' }),
      twoCols(
        textField({ point, path: 'address', label: 'Adres', placeholder: 'ul. Szkolna 3' }),
        selectField({ point, path: 'districtId', label: 'Dzielnica', options: districtOptions })
      ),
      twoCols(
        textField({
          point,
          path: 'lat',
          label: 'Szerokość geogr.',
          readonly: true,
          display: fmtNum(point.lat, 6),
          hint: 'tylko odczyt',
        }),
        textField({
          point,
          path: 'lon',
          label: 'Długość geogr.',
          readonly: true,
          display: fmtNum(point.lon, 6),
          hint: 'tylko odczyt',
        })
      ),
      textField({
        point,
        path: 'placement',
        label: 'Umiejscowienie',
        textarea: true,
        placeholder: 'np. hol główny, przy portierni, na wysokości 1,4 m',
      }),
      h('div', { class: 'divider' }),
      h('span', { class: 'label-caps', text: 'Galeria zdjęć — dowody audytu (SPEC §7)' }),
      photoBox,
    ],
  });

  /* ================================================================ *
   * SEKCJA 2 — Preset
   * ================================================================ */

  const presetOptions = state.presets.map((p) => ({
    value: p.id,
    label: `${p.id} — ${p.name} · ${fmtCost(p.cost)}`,
  }));

  const requirementRow = (label, ok) =>
    h(
      'div',
      { class: 'row', style: { fontSize: '12px' } },
      h('span', { html: pillHtml(ok ? 'jest' : 'brak', ok ? 'ok' : 'warn') }),
      h('span', { text: label })
    );

  const section2 = cardSection({
    num: 2,

  // Zaległy zapis pól tekstowych domykamy po cichu, żeby zmiana widoku

  if (saveTimer) {
    clearTimeout(saveTimer);

    save({ silent: true }).catch(() => {});
  }
}

const { renderSceneSvg } = __req('js/map.js');
const { TODAY } = __req('config.js');
const meta = {
  step: 4,
  title: 'Roadmapa',
  subtitle: 'kiedy i za ile',
  layout: 'scroll',
  chrome: 'full',
};

/* ------------------------------------------------------------------ *
 * Stałe widoku
 * ------------------------------------------------------------------ */

const PHASES = [1, 2, 3];

/** Horyzont osi czasu: 24 miesiące = 8 kwartałów (SPEC §6.6). */
const MONTHS = 24;
const QUARTERS = 8;
const MONTHS_PER_QUARTER = MONTHS / QUARTERS;

/**
 * Poziom pinu na mapie dla danej fazy. Mapowanie jest nieprzypadkowe:
 * map.js rysuje 'ok' kolorem --phase-1, 'warn' kolorem --phase-2, a 'proposed'
 * kolorem --phase-3 — dzięki temu pasek mapy pokazuje realne kolory faz
 * i nie wprowadzamy ani jednego nowego koloru.
 */
const PHASE_LEVEL = { 1: 'ok', 2: 'warn', 3: 'proposed' };

const PHASE_VARIANT = { 1: 'phase1', 2: 'phase2', 3: 'phase3' };

/** Domyślne okno na osi czasu dla pozycji przeniesionej do danej fazy. */
const PHASE_SPAN = {
  1: { start: 1, length: 6 },
  2: { start: 7, length: 12 },
  3: { start: 19, length: 6 },
};

/** Awaryjny koniec fazy, gdy żadna pozycja nie ma jeszcze terminów. */
const PHASE_END_FALLBACK = { 1: 6, 2: 18, 3: 24 };

const OWNERS = [
  { id: 'gmina', label: 'gmina' },
  { id: 'serwis', label: 'serwis' },
  { id: 'wykonawca', label: 'wykonawca' },
];

const MAP_STRIP_HEIGHT = 220;

/** Geometria krzywej pokrycia wewnątrz .gantt__curve (74 px wysokości). */
const CURVE = { height: 74, top: 26, bottom: 14, padPct: 4 };

/* ------------------------------------------------------------------ *
 * Stan lokalny widoku (nie są to dane projektu)
 * ------------------------------------------------------------------ */

let resizeObserver = null;
let releasePointer = null;
let draggedRecId = null;

/* ------------------------------------------------------------------ *
 * Pomocniki lokalne (rdzenia nie ruszamy)
 * ------------------------------------------------------------------ */

function clamp(value, lo, hi) {
  return Math.min(hi, Math.max(lo, value));
}

/** Faza pozycji jako 1|2|3 albo null (pozycje bez fazy = „Nieprzypisane"). */
function phaseOf(rec) {
  const n = Number(rec.phase);
  return PHASES.includes(n) ? n : null;
}

/** Start i długość paska Gantta, zawsze w pełnych miesiącach z zakresu 1..24. */
function barMonths(rec) {
  const start = clamp(Math.round(Number(rec.startMonth) || 1), 1, MONTHS);
  const raw = Math.round(Number(rec.lengthMonths) || 1);
  return { start, length: clamp(raw, 1, MONTHS - start + 1) };
}

function leftPct(startMonth) {
  return ((startMonth - 1) / MONTHS) * 100;
}

function widthPct(lengthMonths) {
  return (lengthMonths / MONTHS) * 100;
}

function segControl(options, activeValue, onPick) {
  return h(
    'div',
    { class: 'seg' },
    ...options.map((option) =>
      h(
        'button',
        {
          class: `seg__btn${option.value === activeValue ? ' is-on' : ''}`,
          onclick: () => {
            if (option.value === activeValue) return;
            onPick(option.value);
          },
        },
        option.label
      )
    )
  );
}

function field(label, control) {
  return h('label', { class: 'field' }, h('span', { class: 'field__label', text: label }), control);
}

/**
 * Which point a roadmap item belongs to. Phase 1 is mostly the same few
 * compliance actions repeated across points, so without this the plan reads as
 * nine identical rows.
 */
function recSource(rec) {
  if (!rec.pointId) return 'zadanie ogólne';
  const point = getPoint(rec.pointId);
  return point ? point.name : rec.pointId;
}

function ownerLabel(id) {
  const owner = OWNERS.find((o) => o.id === id);
  return owner ? owner.label : id || 'nieprzypisany';
}

/** Kolejny identyfikator pozycji dodanej ręcznie: man-001, man-002, … */
function nextManualId() {
  const used = state.recommendations
    .map((r) => /^man-(\d+)$/.exec(r.id || ''))
    .filter(Boolean)
    .map((m) => parseInt(m[1], 10));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return `man-${String(next).padStart(3, '0')}`;
}

/** Efekt pojedynczej pozycji na pokrycie — bierzemy go z powiązanego punktu. */
function pointGainPct(pointId) {
  if (!pointId) return 0;
  const point = getPoint(pointId);
  const gain = point ? Number(point.gainPct) : NaN;
  return Number.isFinite(gain) ? gain : 0;
}

/** Suma gainPct unikalnych punktów montowanych w danej fazie. */
function phaseGainPct(items) {
  const seen = new Set();
  let sum = 0;
  for (const rec of items) {
    if (!rec.pointId || seen.has(rec.pointId)) continue;
    seen.add(rec.pointId);
    sum += pointGainPct(rec.pointId);
  }
  return sum;
}

/** Ostatni miesiąc, w którym coś się dzieje w danej fazie. */
function phaseEndMonth(items, fallback) {
  let end = 0;
  for (const rec of items) {
    const bar = barMonths(rec);
    end = Math.max(end, bar.start + bar.length - 1);
  }
  return end || fallback;
}

/**
 * Koszt na mieszkańca — fmtCost() zaokrągla do pełnych złotych, a tu potrzebne
 * są grosze (SPEC §6.7: „3,10 zł"), więc liczbę formatuje fmtNum z dwoma
 * miejscami, a „zł" dokładamy jako jednostkę.
 */
function fmtCostPerPerson(value) {
  return `${fmtNum(value, 2)} zł`;
}

function emptyBox(text) {
  return h('div', { class: 'empty-state', text });
}

/* ------------------------------------------------------------------ *
 * Widok
 * ------------------------------------------------------------------ */

async function render(root, ctx) {
  destroy(); // przerysowanie po save() — zwolnij listenery poprzedniego renderu

  const project = state.project;
  if (!project) {
    mount(root, emptyBox('Brak aktywnego projektu — wróć do pulpitu i otwórz audyt.'));
    return;
  }

  const view = state.ui.roadmapView === 'timeline' ? 'timeline' : 'kanban';
  const recommendations = state.recommendations || [];

  /* ---------------- Sub bar: [Kanban | Oś czasu] ---------------- */

  if (ctx.subbar && ctx.subbar.controls) {
    mount(
      ctx.subbar.controls,
      segControl(
        [
          { value: 'kanban', label: 'Kanban' },
          { value: 'timeline', label: 'Oś czasu' },
        ],
        view,
        async (value) => {
          state.ui.roadmapView = value;
          await save();
        }
      )
    );
  }

  /* ---------------- Obliczenia (zawsze z model.js) ---------------- */

  const { phases, total } = roadmapTotals(recommendations);
  const unassigned = recommendations.filter((rec) => phaseOf(rec) === null);

  const analysisBase = {
    demandPoints: state.demandPoints,
    districts: project.districts || [],
    standardMinutes: project.standardMinutes,
    population: project.population,
    // Roadmapa raportuje pokrycie dzienne — to ono trafia do kamieni milowych
    // i na okładkę raportu. Tryb nocny zostaje w kroku 2.
    mode: 'day',
  };

  /** Scenariusz „plan" ograniczony do faz ≤ maxPhase (istniejące zawsze liczą się). */
  const coverageUpToPhase = (maxPhase) =>
    analyze({
      ...analysisBase,
      points: state.points.filter(
        (p) => p.kind === 'existing' || (Number(p.phase) || Infinity) <= maxPhase
      ),
      scenario: 'plan',
    });

  const nowAnalysis = analyze({ ...analysisBase, points: state.points, scenario: 'now' });
  const afterPhase1 = coverageUpToPhase(1);
  const afterPhase2 = coverageUpToPhase(2);
  const afterPlan = analyze({ ...analysisBase, points: state.points, scenario: 'plan' });

  const coverageDelta = afterPlan.coveragePct - nowAnalysis.coveragePct;
  const peopleGained = afterPlan.coveredPeople - nowAnalysis.coveredPeople;
  const costPerPerson = peopleGained > 0 ? total / peopleGained : null;

  if (ctx.setMeta) {
    ctx.setMeta(
      `${fmtNum(recommendations.length)} pozycji: ` +
        PHASES.map((n) => `${fmtNum(phases[n].items.length)} w fazie ${fmtNum(n)}`).join(' · ') +
        `${unassigned.length ? ` · ${fmtNum(unassigned.length)} bez fazy` : ''} · ` +
        `suma ${fmtCost(total)}`
    );
  }

  /* ---------------- Akcje na danych ---------------- */

  /** Przeniesienie pozycji do innej fazy (drag & drop w kanbanie). */
  const movePhase = async (recId, targetPhase) => {
    const rec = recommendations.find((r) => r.id === recId);
    if (!rec) return;
    if (phaseOf(rec) === targetPhase) return;

    const patch = { id: rec.id, phase: targetPhase };
    if (targetPhase) {
      // Zachowaj długość zadania, ale wstaw je w okno nowej fazy, żeby oś czasu
      // nie kłóciła się z kanbanem.
      const span = PHASE_SPAN[targetPhase];
      const length = barMonths(rec).length;
      patch.startMonth = span.start;
      patch.lengthMonths = clamp(length, 1, MONTHS - span.start + 1);
    }
    upsertRecommendation(patch);
    await save();
    toast(
      targetPhase
        ? `„${rec.text}" → ${PHASE_META[targetPhase].label} (${PHASE_META[targetPhase].months}).`
        : `„${rec.text}" wróciło do pozycji nieprzypisanych.`
    );
  };

  /** „+ pozycja" — nowa rekomendacja bez punktu, w wybranej fazie. */
  const addItem = async (targetPhase) => {
    const textInput = h('input', {
      class: 'input',
      type: 'text',
      placeholder: 'np. Szkolenie z obsługi AED dla pracowników urzędu',
    });
    const ownerSelect = h(
      'select',
      { class: 'select' },
      ...OWNERS.map((o) => h('option', { value: o.id }, o.label))
    );
    const costInput = h('input', { class: 'input num', type: 'number', min: '0', step: '100', value: '0' });

    const heading = targetPhase
      ? `${PHASE_META[targetPhase].label} — ${PHASE_META[targetPhase].title}`
      : 'Nieprzypisane';

    const confirmed = await modal({
      title: `Nowa pozycja roadmapy — ${heading}`,
      body: h(
        'div',
        { class: 'stack' },
        field('Treść pozycji', textInput),
        field('Odpowiedzialny', ownerSelect),
        field('Koszt (zł)', costInput),
        h('p', {
          class: 'note',
          text:
            'Pozycja nie jest powiązana z żadnym punktem AED (pointId: null) — tak zapisujemy ' +
            'zadania organizacyjne: przetargi, dokumentację, szkolenia.',
        })
      ),
      confirmLabel: 'DODAJ POZYCJĘ',
    });
    if (!confirmed) return;

    const text = textInput.value.trim();
    if (!text) {
      toast('Pozycja bez treści nie zostanie dodana.');
      return;
    }

    const span = targetPhase ? PHASE_SPAN[targetPhase] : { start: 1, length: 3 };
    upsertRecommendation({
      id: nextManualId(),
      pointId: null,
      rule: 'manual',
      text,
      priority: 'medium',
      cost: Math.max(0, Math.round(Number(costInput.value) || 0)),
      owner: ownerSelect.value,
      phase: targetPhase,
      auto: false,
      done: false,
      startMonth: span.start,
      lengthMonths: span.length,
    });
    await save();
    toast(`Dodano pozycję: „${text}".`);
  };

  /** Usunięcie pozycji dodanej ręcznie (pozycji auto nie kasujemy — wracają z reguł). */
  const deleteItem = async (rec) => {
    const confirmed = await modal({
      title: 'Usunąć pozycję roadmapy?',
      body: h('p', { text: `„${rec.text}" zniknie z planu i z sum kosztów.` }),
      confirmLabel: 'USUŃ',
    });
    if (!confirmed) return;
    removeRecommendation(rec.id);
    await save();
    toast('Pozycja usunięta z roadmapy.');
  };

  const approve = async () => {
    markStepDone(4);
    await save();
    ctx.navigate('#/report');
  };

  /* ---------------- Nagłówek: KPI + kontrolki poza zakresem ---------------- */

  const toolbar = h(
    'div',
    { class: 'row row--wrap', style: { marginBottom: '10px' } },
    h('span', {
      class: 'label-caps',
      text: `Plan wdrożenia — ${fmtNum(PHASES.length)} fazy · horyzont ${fmtNum(MONTHS)} mies.`,
    }),
    h('span', { class: 'spacer' }),
    disabledControl(h('button', { class: 'btn btn--sm' }, 'ZALEŻNOŚCI MIĘDZY ZADANIAMI')),
    disabledControl(h('button', { class: 'btn btn--sm' }, 'EKSPORT HARMONOGRAMU (MS PROJECT)'))
  );

  const kpis = h(
    'div',
    { class: 'kpi-grid kpi-grid--3', style: { marginBottom: '14px' } },
    h(
      'div',
      { class: 'kpi' },
      h('div', { class: 'kpi__label', text: 'Suma kosztów całości planu' }),
      h('div', { class: 'kpi__value', text: fmtCost(total) }),
      h('div', {
        class: 'kpi__delta',
        text: PHASES.map((n) => `${PHASE_META[n].label}: ${fmtCost(phases[n].cost)}`).join(' · '),
      })
    ),
    h(
      'div',
      { class: 'kpi' },
      h('div', { class: 'kpi__label', text: 'Koszt na mieszkańca objętego ochroną' }),
      h('div', { class: 'kpi__value', text: costPerPerson === null ? '—' : fmtCostPerPerson(costPerPerson) }),
      h('div', {
        class: 'kpi__delta',
        text:
          costPerPerson === null
            ? 'Plan nie obejmuje jeszcze nikogo nowego — brak mianownika.'
            : `suma planu ÷ przyrost objętej ludności (${fmtNum(peopleGained)} os.)`,
      })
    ),
    h(
      'div',
      { class: 'kpi' },
      h('div', { class: 'kpi__label', text: 'Przyrost pokrycia po planie (dzień)' }),
      h('div', {
        class: 'kpi__value',
        text: `${coverageDelta >= 0 ? '+' : '−'}${fmtNum(Math.abs(coverageDelta), 1)} pkt proc.`,
      }),
      h('div', {
        class: `kpi__delta${coverageDelta > 0.05 ? ' is-up' : coverageDelta < -0.05 ? ' is-down' : ''}`,
        text: `teraz ${fmtPct(nowAnalysis.coveragePct, 0)} → po planie ${fmtPct(afterPlan.coveragePct, 0)}`,
      })
    )
  );

  /* ---------------- Stopka wspólna dla obu trybów ---------------- */

  const footer = h(
    'div',
    { class: 'row row--wrap', style: { marginTop: '14px' } },
    h('p', {
      class: 'note',
      style: { flex: '1', minWidth: '260px', margin: '0' },
      text:
        `Zatwierdzenie zalicza krok 4 w stepperze i przenosi do raportu. Sumy i terminy ` +
        `pozostają edytowalne — raport czyta je na bieżąco ze stanu projektu.`,
    }),
    h('button', { class: 'btn btn--primary', onclick: approve }, 'ZATWIERDŹ → RAPORT')
  );

  /* ---------------- Zawartość trybu ---------------- */

  const body = recommendations.length
    ? view === 'timeline'
      ? buildTimeline({
          recommendations,
          phases,
          unassigned,
          nowAnalysis,
          afterPhase1,
          afterPhase2,
          afterPlan,
        })
      : buildKanban({ phases, unassigned, movePhase, addItem, deleteItem, afterPlan })
    : emptyBox(
        'Roadmapa jest pusta — rekomendacje powstają w kartach punktów (krok 3), ' +
          'a zadania organizacyjne dodasz przyciskiem „+ pozycja" w kanbanie.'
      );

  mount(root, toolbar, kpis, body, footer);
}

/* ------------------------------------------------------------------ *
 * Tryb KANBAN
 * ------------------------------------------------------------------ */

function buildKanban({ phases, unassigned, movePhase, addItem, deleteItem, afterPlan }) {
  const columns = [
    ...PHASES.map((n) => ({
      phase: n,
      title: `${PHASE_META[n].label} — ${PHASE_META[n].title}`,
      months: PHASE_META[n].months,
      items: phases[n].items,
      cost: phases[n].cost,
    })),
    {
      phase: null,
      title: 'Nieprzypisane',
      months: 'bez terminu — przeciągnij do fazy',
      items: unassigned,
      cost: unassigned.reduce((sum, rec) => sum + (rec.cost || 0), 0),
    },
  ];

  const board = h('div', {
    class: 'kanban',
    // Czwarta kolumna „Nieprzypisane" jest poza siatką 3-kolumnową z app.css —
    // rozszerzamy ją lokalnie, bez dopisywania klas do arkusza rdzenia.
    style: { gridTemplateColumns: `repeat(${columns.length}, 1fr)` },
  });

  for (const column of columns) {
    board.appendChild(kanbanColumn(column, { movePhase, addItem, deleteItem }));
  }

  return h('div', {}, board, mapStrip(afterPlan));
}

function kanbanColumn(column, actions) {
  const gain = phaseGainPct(column.items);

  const body = h('div', { class: 'kanban__body' });
  let enterDepth = 0;

  body.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  });
  body.addEventListener('dragenter', (e) => {
    e.preventDefault();
    enterDepth += 1;
    body.classList.add('is-dropzone');
  });
  body.addEventListener('dragleave', () => {
    enterDepth = Math.max(0, enterDepth - 1);
    if (!enterDepth) body.classList.remove('is-dropzone');
  });
  body.addEventListener('drop', (e) => {
    e.preventDefault();
    enterDepth = 0;
    body.classList.remove('is-dropzone');
    const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || draggedRecId;
    draggedRecId = null;
    if (id) actions.movePhase(id, column.phase);
  });

  if (column.items.length) {
    for (const rec of column.items) body.appendChild(kanbanCard(rec, actions.deleteItem));
  } else {
    body.appendChild(
      h('div', {
        class: 'empty-state',
        style: { padding: '18px 8px' },
        text: 'Pusto — przeciągnij tu pozycję.',
      })
    );
  }

  body.appendChild(
    h(
      'button',
      {
        class: 'btn btn--sm btn--block',
        style: { marginTop: 'auto' },
        title: 'Dodaj pozycję niezwiązaną z konkretnym punktem AED',
        onclick: () => actions.addItem(column.phase),
      },
      '+ pozycja'
    )
  );

  return h(
    'div',
    { class: 'kanban__col' },
    h('div', { class: `kanban__stripe${column.phase ? ` kanban__stripe--${column.phase}` : ''}` }),
    h(
      'div',
      { class: 'kanban__head' },
      h(
        'div',
        { class: 'row' },
        h('h3', { style: { flex: '1' }, text: column.title }),
        h('span', {
          html: pillHtml(
            `${fmtNum(column.items.length)} poz.`,
            column.phase ? PHASE_VARIANT[column.phase] : ''
          ),
        })
      ),
      h('div', { class: 'muted', text: column.months }),
      h(
        'div',
        { class: 'row', style: { marginTop: '4px' } },
        h('span', { class: 'num', style: { fontWeight: '700' }, text: fmtCost(column.cost) }),
        h('span', { class: 'spacer' }),
        gain > 0
          ? h('span', { class: 'kanban__effect num', text: `+${fmtPct(gain, 1)} pokrycia` })
          : h('span', { class: 'muted', style: { fontSize: '11px' }, text: 'bez nowych lokalizacji' })
      )
    ),
    body
  );
}

function kanbanCard(rec, onDelete) {
  const gain = pointGainPct(rec.pointId);

  const card = h(
    'div',
    {
      class: 'kanban__card',
      draggable: 'true',
      title: 'Przeciągnij na inną fazę — sumy i terminy przeliczą się same',
    },
    h('span', { class: 'kanban__grip', html: '⋮⋮', 'aria-hidden': 'true' }),
    h(
      'div',
      { style: { flex: '1', minWidth: '0' } },
      h(
        'div',
        { class: 'row' },
        h('h4', { style: { flex: '1' }, text: rec.text }),
        h('span', {
          html: pillHtml(PRIORITY_LABEL[rec.priority] || 'priorytet ?', PRIORITY_VARIANT[rec.priority] || ''),
        })
      ),
      h('div', {
        class: 'kanban__meta num',
        text: `${recSource(rec)} · ${ownerLabel(rec.owner)} · ${fmtCost(rec.cost)}`,
      }),
      gain > 0 ? h('div', { class: 'kanban__effect num', text: `+${fmtPct(gain, 1)} pokrycia` }) : null
    ),
    rec.auto
      ? null
      : h(
          'button',
          {
            class: 'btn btn--sm btn--ghost btn--danger',
            title: 'Usuń pozycję dodaną ręcznie',
            'aria-label': 'Usuń pozycję',
            onclick: (e) => {
              e.stopPropagation();
              onDelete(rec);
            },
          },
          '✕'
        )
  );

  card.addEventListener('dragstart', (e) => {
    draggedRecId = rec.id;
    if (e.dataTransfer) {
      e.dataTransfer.setData('text/plain', rec.id);
      e.dataTransfer.effectAllowed = 'move';
    }
    card.classList.add('is-dragging');
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('is-dragging');
    draggedRecId = null;
  });

  return card;
}

/**
 * Pasek mapy pod kolumnami: punkty pokolorowane fazą, istniejąca sieć jako
 * strefy pokrycia. Renderowany przez renderSceneSvg() i przemalowywany przy
 * zmianie szerokości, żeby SVG nie był rozciągany.
 */
function mapStrip(afterPlan) {
  /** Faza punktu = jego własna faza (propozycje) albo najwcześniejsza faza jego zadań. */
  const phaseByPoint = new Map();
  for (const point of state.points) {
    const own = Number(point.phase);
    if (PHASES.includes(own)) phaseByPoint.set(point.id, own);
  }
  for (const rec of state.recommendations || []) {
    const phase = phaseOf(rec);
    if (!phase || !rec.pointId) continue;
    const current = phaseByPoint.get(rec.pointId);
    if (current === undefined || phase < current) phaseByPoint.set(rec.pointId, phase);
  }

  const pins = [];
  for (const point of state.points) {
    if (point.status === 'rejected') continue;
    const phase = phaseByPoint.get(point.id);
    if (!phase) continue;
    pins.push({
      id: point.id,
      lat: point.lat,
      lon: point.lon,
      level: PHASE_LEVEL[phase],
      name: point.name,
    });
  }

  const scene = {
    boundary: state.boundary,
    districts: state.districtsGeo,
    showDistricts: true,
    coverage: afterPlan.activePoints.map((p) => ({
      lat: p.lat,
      lon: p.lon,
      radiusM: afterPlan.radiusM,
